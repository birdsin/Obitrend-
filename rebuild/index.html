<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07070a">
  <meta name="color-scheme" content="dark">
  <title>OBITREND — AI Fashion Creator</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app" class="app-shell">
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<section id="authScreen" class="auth-screen">
  <div class="ref-auth-panel auth-reference-panel" aria-label="Sign in">
    <div class="ref-auth-art"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=90" alt="OBITREND fashion"></div>
    <div class="ref-auth-brand"><b>OBITREND</b><span>AI Fashion Creator</span><em>Fashion<br>Reimagined<br>with AI</em><small>Create. Inspire. Stand Out.</small></div>
    <div class="ref-auth-box">
      <h2>Sign In</h2><p>Access your OBITREND account</p>
      <form id="authForm" novalidate>
        <label class="ref-auth-input">✉ <input id="authEmail" type="email" autocomplete="email" placeholder="Email address" required></label>
        <label class="ref-auth-input">♙ <input id="authPassword" type="password" autocomplete="current-password" placeholder="Password" required><button type="button" id="authPasswordToggle" aria-label="Show password">◉</button></label>
        <div class="ref-auth-row"><label><input id="authRemember" type="checkbox"> Remember me</label><button id="forgotBtn" type="button">Forgot password?</button></div>
        <button id="signInBtn" class="ref-auth-submit" type="submit">Sign In&nbsp; →</button>
        <button id="signUpBtn" class="ref-auth-submit hidden" type="button">Sign Up&nbsp; →</button>
        <div class="ref-auth-or"><span></span>or continue with<span></span></div>
        <button id="authGoogleBtn" class="ref-social" type="button">G&nbsp;&nbsp; Continue with Google</button>
        <button id="authAppleBtn" class="ref-social" type="button">●&nbsp;&nbsp; Continue with Apple</button>
        <p class="ref-signup">Don't have an account? <button id="signUpTab" type="button">Sign Up</button></p>
        <p id="authStatus" class="ref-auth-status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>>
