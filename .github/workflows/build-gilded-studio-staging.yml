name: Build and Integrate Gilded Studio (Staging Only)

on:
  push:
    branches:
      - staging/creator-studio-integration
    paths:
      - .github/workflows/build-gilded-studio-staging.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-studio-export:
    if: github.ref == 'refs/heads/staging/creator-studio-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out OBITREND staging branch
        uses: actions/checkout@v4
        with:
          ref: staging/creator-studio-integration
          path: obitrend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out private Gilded dashboard source
        uses: actions/checkout@v4
        with:
          repository: birdsin/gilded-fashion-forge
          ref: main
          token: ${{ secrets.GILDED_REPO_TOKEN }}
          path: gilded

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Gilded dependencies
        working-directory: gilded
        run: bun install --frozen-lockfile

      - name: Remove unsupported biometric and passkey UI from staging auth
        working-directory: gilded
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const authFormPath = 'src/components/studio/auth-form.tsx';
          let authForm = fs.readFileSync(authFormPath, 'utf8');
          authForm = authForm.replace("import { AlertCircle, CheckCircle2, Fingerprint } from 'lucide-react';", "import { AlertCircle, CheckCircle2 } from 'lucide-react';");
          authForm = authForm.replace(/\n\s*<p className="flex gap-2 text-\[11px\] text-muted-foreground mt-3" data-testid="passkey-note">\s*<Fingerprint size=\{15\} className="shrink-0" \/>\{t\('repair\.passkey\.unavailable'\)\}<\/p>/, '');
          if (authForm.includes('data-testid="passkey-note"') || authForm.includes('Fingerprint')) throw new Error('Passkey note removal failed; stopping staging build.');
          fs.writeFileSync(authFormPath, authForm);

          const authRoutePath = 'src/routes/auth.tsx';
          let authRoute = fs.readFileSync(authRoutePath, 'utf8');
          authRoute = authRoute.replace("import { PasskeyOption } from '@/components/studio/passkey-option';\n", '');
          authRoute = authRoute.replace(/\n\s*<PasskeyOption \/>/, '');
          if (authRoute.includes('PasskeyOption')) throw new Error('Passkey component removal failed; stopping staging build.');
          fs.writeFileSync(authRoutePath, authRoute);
          console.log('Removed unsupported biometric/passkey UI from staging sign-in and sign-up screen only.');
          NODE

      - name: Build and verify static studio export
        working-directory: gilded
        env:
          STUDIO_STATIC: "1"
        run: bun run build:studio

      - name: Integrate export under staging /studio
        shell: bash
        run: |
          set -euo pipefail
          test -s gilded/dist-studio/index.html
          mkdir -p obitrend/studio
          rsync -a --delete gilded/dist-studio/ obitrend/studio/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'obitrend/supabase.js';
          let s = fs.readFileSync(p, 'utf8');
          const host = 'window.location.hostname === "obitrend-git-staging-creator-studio-integration-birdsins-projects.vercel.app"';
          if (!s.includes(host)) {
            const marker = 'window.location.hostname === "obitrend-p98lspizf-birdsins-projects.vercel.app"';
            if (!s.includes(marker)) throw new Error('Expected staging hostname marker not found; refusing to alter Supabase routing.');
            s = s.replace(marker, marker + ' ||\n  ' + host);
            fs.writeFileSync(p, s);
          }
          NODE
          test -s obitrend/studio/index.html
          test -d obitrend/studio/assets
          grep -q 'window.OBITREND_HOST_MODE = true' obitrend/studio/index.html
          grep -q 'obitrend-git-staging-creator-studio-integration-birdsins-projects.vercel.app' obitrend/supabase.js

      - name: Commit verified staging integration
        working-directory: obitrend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/ supabase.js
          if git diff --cached --quiet; then
            echo "No staging integration changes to commit."
            exit 0
          fi
          git commit -m "Integrate Gilded Studio export on staging"
          git push origin HEAD:staging/creator-studio-integration

      - name: Upload verified export for review
        uses: actions/upload-artifact@v4
        with:
          name: obitrend-staging-studio-export
          path: gilded/dist-studio/
          if-no-files-found: error
          retention-days: 7
