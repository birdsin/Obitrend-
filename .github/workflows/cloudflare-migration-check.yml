name: Cloudflare migration checks

on:
  push:
    branches:
      - migration/cloudflare-2026-11-19
  pull_request:
    branches:
      - main

jobs:
  worker-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run cf:assets
      - run: npx --yes wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler/deploy
