name: Cloudflare migration checks
# Re-run build validation after compatibility adapter fixes.

on:
  push:
    branches:
      - migration/cloudflare-2026-11-19
  pull_request:
    branches:
      - main

jobs:
  worker-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - name: Report dependency audit summary
        run: |
          npm audit --json > /tmp/obitrend-audit.json || true
          node -e 'const r=require("/tmp/obitrend-audit.json"); console.log("Dependency audit:", JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(r.vulnerabilities || {})) console.log(name, item.severity, item.isDirect ? "direct" : "transitive", item.fixAvailable ? "fix available" : "no automatic fix");'
      - run: npm run cf:assets
      - run: npx --yes wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler/deploy
