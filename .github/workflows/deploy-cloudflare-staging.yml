name: Deploy OBITREND Cloudflare staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obitrend-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-2026-11-19

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Prepare allowlisted static assets
        run: npm run cf:assets

      - name: Deploy staging Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
