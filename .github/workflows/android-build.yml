name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE.JS
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # =========================================================
      # 4. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-}"

          echo ""
          echo "ANDROID SDK: READY"


      # =========================================================
      # 5. VERIFY SECRETS
      # =========================================================

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BUBBLEWRAP_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEY_PASSWORD:-}" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is missing."
            exit 1
          fi

          if [ "${#BUBBLEWRAP_KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "ERROR: Keystore password must contain at least 6 characters."
            exit 1
          fi

          if [ "${#BUBBLEWRAP_KEY_PASSWORD}" -lt 6 ]; then
            echo "ERROR: Key password must contain at least 6 characters."
            exit 1
          fi

          echo "SIGNING SECRETS: FOUND"


            # =========================================================
      # 6. INSTALL BUBBLEWRAP
      # =========================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING BUBBLEWRAP"
          echo "=========================================="

          npm install -g @bubblewrap/cli

          echo ""
          echo "CREATING BUBBLEWRAP CONFIGURATION"

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          }
          EOF

          echo ""
          echo "BUBBLEWRAP CONFIG:"
          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "VERIFYING JAVA:"
          java -version

          echo ""
          echo "VERIFYING ANDROID SDK:"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo ""
          echo "BUBBLEWRAP VERSION:"
          bubblewrap --version

          echo ""
          echo "BUBBLEWRAP: READY"


      # =========================================================
      # 7. CONFIGURE BUBBLEWRAP WITHOUT PROMPTS
      # =========================================================

      - name: Configure Bubblewrap environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING BUBBLEWRAP"
          echo "=========================================="

          BUBBLEWRAP_HOME="$HOME/.bubblewrap"

          mkdir -p "$BUBBLEWRAP_HOME"

          cat > "$BUBBLEWRAP_HOME/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          }
          EOF

          echo ""
          echo "BUBBLEWRAP CONFIG:"
          cat "$BUBBLEWRAP_HOME/config.json"

          echo ""
          echo "JAVA VERSION:"
          java -version

          echo ""
          echo "ANDROID SDK:"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo ""
          echo "BUBBLEWRAP ENVIRONMENT: READY"


      # =========================================================
      # 8. VERIFY WEB MANIFEST
      # =========================================================

      - name: Verify Web Manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING OBITREND WEB MANIFEST"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";

          let manifest;

          try {
            manifest = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            console.error("ERROR: Manifest JSON is invalid.");
            console.error(error.message);
            process.exit(1);
          }

          if (!manifest.name) {
            throw new Error("Manifest is missing name.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest is missing start_url.");
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error("Manifest has no icons.");
          }

          console.log("MANIFEST JSON: VALID");
          console.log("NAME:", manifest.name);
          console.log("START URL:", manifest.start_url);
          console.log("ICONS:", manifest.icons.length);
          NODE

          echo ""
          echo "WEB MANIFEST: VALID"


      # =========================================================
      # 9. PREPARE ANDROID DIRECTORY
      # =========================================================

      - name: Prepare Android directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "ANDROID DIRECTORY:"
          echo "$ANDROID_DIR"


                        # =========================================================
      # 10. INITIALIZE BUBBLEWRAP ANDROID PROJECT
      # =========================================================

      - name: Initialize Bubblewrap Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INITIALIZING BUBBLEWRAP ANDROID PROJECT"
          echo "=========================================="

          sudo apt-get update -qq
          sudo apt-get install -y -qq expect

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          }
          EOF

          echo ""
          echo "BUBBLEWRAP CONFIGURATION:"
          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "ANDROID SDK:"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          rm -rf "$ANDROID_DIR"
          mkdir -p "$ANDROID_DIR"

          cat > /tmp/init-bubblewrap.exp <<'EXPECT'
          set timeout 900
          log_user 1

          set manifest $env(MANIFEST_URL)
          set directory $env(ANDROID_DIR)

          set storepass $env(BUBBLEWRAP_KEYSTORE_PASSWORD)
          set keypass $env(BUBBLEWRAP_KEY_PASSWORD)

          spawn bubblewrap init \
            --manifest=$manifest \
            --directory=$directory

          expect {

            # ===================================================
            # JDK
            # ===================================================

            -re "(?i).*install.*JDK.*\\?.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i).*existing JDK.*:" {
              send -- "$env(JAVA_HOME)\r"
              exp_continue
            }

            # ===================================================
            # ANDROID SDK
            # ===================================================

            -re "(?i).*install.*Android SDK.*\\?.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i).*existing Android SDK.*:" {
              send -- "$env(ANDROID_HOME)\r"
              exp_continue
            }

            # ===================================================
            # WEB APP
            # ===================================================

            -re "(?i).*Domain.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i).*URL path.*:" {
              send "\r"
              exp_continue
            }

            # ===================================================
            # APPLICATION NAME
            # IMPORTANT: DO NOT USE A GENERIC name REGEX
            # ===================================================

            -re "(?i).*Application name.*:" {
              send "OBITREND\r"
              exp_continue
            }

            # ===================================================
            # LAUNCHER NAME
            # ===================================================

            -re "(?i).*Launcher name.*:" {
              send "OBITREND\r"
              exp_continue
            }

            # ===================================================
            # APPLICATION ID / PACKAGE ID
            # ===================================================

            -re "(?i).*(Application ID|Package ID).*:" {
              send "ai.obitrend.app\r"
              exp_continue
            }

            # ===================================================
            # VERSION CODE
            # MUST COME BEFORE ANY GENERIC RULE
            # ===================================================

            -re "(?i).*Starting version code.*:" {
              send "1\r"
              exp_continue
            }

            -re "(?i).*version code.*:" {
              send "1\r"
              exp_continue
            }

            # ===================================================
            # DISPLAY MODE
            # ===================================================

            -re "(?i).*Display mode.*:" {
              send "\r"
              exp_continue
            }

            # ===================================================
            # ORIENTATION
            # ===================================================

            -re "(?i).*Orientation.*:" {
              send "\r"
              exp_continue
            }

            # ===================================================
            # THEME COLOR
            # ===================================================

            -re "(?i).*Theme color.*:" {
              send "\r"
              exp_continue
            }

            # ===================================================
            # BACKGROUND COLOR
            # ===================================================

            -re "(?i).*Background color.*:" {
              send "\r"
              exp_continue
            }

            # ===================================================
            # ICON URL
            # ===================================================

            -re "(?i).*Icon URL.*:" {
              send "\r"
              exp_continue
            }

            # ===================================================
            # MASKABLE ICON
            # ===================================================

            -re "(?i).*Maskable icon.*:" {
              send "\r"
              exp_continue
            }

            # ===================================================
            # MONOCHROME ICON
            # ===================================================

            -re "(?i).*Monochrome icon.*:" {
              send "\r"
              exp_continue
            }

            # ===================================================
            # OPTIONAL FEATURES
            # ===================================================

            -re "(?i).*Play Billing.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i).*location.*delegation.*" {
              send "n\r"
              exp_continue
            }

            # ===================================================
            # SIGNING KEY
            # ===================================================

            -re "(?i).*create.*signing.*key.*" {
              send "y\r"
              exp_continue
            }

            -re "(?i).*Full name.*:" {
              send "OBITREND\r"
              exp_continue
            }

            -re "(?i).*Organizational unit.*:" {
              send "OBITREND\r"
              exp_continue
            }

            -re "(?i).*Organization.*:" {
              send "OBITREND\r"
              exp_continue
            }

            -re "(?i).*Country.*:" {
              send "NG\r"
              exp_continue
            }

            # ===================================================
            # KEYSTORE PASSWORD
            # ===================================================

            -re "(?i).*Keystore password.*:" {
              send -- "$storepass\r"
              exp_continue
            }

            # ===================================================
            # KEY PASSWORD
            # ===================================================

            -re "(?i).*Key password.*:" {
              send -- "$keypass\r"
              exp_continue
            }

            # ===================================================
            # KEY PATH
            # ===================================================

            -re "(?i).*Key path.*:" {
              send "./android.keystore\r"
              exp_continue
            }

            # ===================================================
            # KEY ALIAS
            # ===================================================

            -re "(?i).*Key alias.*:" {
              send "obitrend\r"
              exp_continue
            }

            # ===================================================
            # FINISHED
            # ===================================================

            eof {
              catch wait result
              set exit_code [lindex $result 3]

              if {$exit_code != 0} {
                puts ""
                puts "ERROR: Bubblewrap initialization failed."
                exit $exit_code
              }

              exit 0
            }

            timeout {
              puts ""
              puts "ERROR: Bubblewrap initialization timed out."
              exit 1
            }
          }
          EXPECT

          echo ""
          echo "=========================================="
          echo "STARTING BUBBLEWRAP INIT"
          echo "=========================================="

          expect /tmp/init-bubblewrap.exp

          echo ""
          echo "=========================================="
          echo "CHECKING GENERATED PROJECT"
          echo "=========================================="

          test -f "$ANDROID_DIR/twa-manifest.json"
          test -f "$ANDROID_DIR/gradlew"
          test -f "$ANDROID_DIR/android.keystore"

          echo ""
          echo "twa-manifest.json: FOUND"
          echo "gradlew: FOUND"
          echo "android.keystore: FOUND"

          echo ""
          echo "BUBBLEWRAP PROJECT: READY"


      # =========================================================
      # 11. FORCE OBITREND SIGNING CONFIGURATION
      # =========================================================

      - name: Configure OBITREND signing
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const file =
            process.env.ANDROID_DIR +
            "/twa-manifest.json";

          const manifest = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          manifest.packageId = "ai.obitrend.app";
          manifest.launcherName = "OBITREND";

          manifest.signingKey = {
            path: "./android.keystore",
            alias: "obitrend"
          };

          manifest.appVersionCode = 1;
          manifest.appVersion = "1";

          fs.writeFileSync(
            file,
            JSON.stringify(manifest, null, 2) + "\n"
          );

          console.log("PACKAGE ID:", manifest.packageId);
          console.log("ALIAS:", manifest.signingKey.alias);
          console.log("KEYSTORE:", manifest.signingKey.path);
          console.log("VERSION CODE:", manifest.appVersionCode);
          NODE

          test -f "$ANDROID_DIR/android.keystore"

          echo ""
          echo "OBITREND SIGNING CONFIGURATION: READY"


      # =========================================================
      # 12. UPDATE BUBBLEWRAP PROJECT
      # =========================================================

      - name: Update Bubblewrap Android project
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

          chmod +x ./gradlew

          test -f ./gradlew
          test -f ./android.keystore

          echo ""
          echo "ANDROID PROJECT UPDATE: SUCCESS"


      # =========================================================
      # 13. BUILD SIGNED APK + AAB
      # =========================================================

      - name: Build signed APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING OBITREND APK + AAB"
          echo "=========================================="

          bubblewrap build \
            --skipPwaValidation \
            --manifest="$ANDROID_DIR/twa-manifest.json" \
            --signingKeyPath="$ANDROID_DIR/android.keystore" \
            --signingKeyAlias="obitrend"

          echo ""
          echo "BUBBLEWRAP BUILD FINISHED"

          echo ""
          echo "SEARCHING FOR SIGNED APK..."

          APK_SOURCE="$(
            find . \
              -type f \
              -name "app-release-signed.apk" \
              -print \
              | head -n 1
          )"

          echo ""
          echo "SEARCHING FOR SIGNED AAB..."

          AAB_SOURCE="$(
            find . \
              -type f \
              -name "app-release-bundle.aab" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK_SOURCE" ]; then
            echo ""
            echo "ERROR: Signed APK was not produced."
            echo ""
            echo "All APK files:"
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          if [ -z "$AAB_SOURCE" ]; then
            echo ""
            echo "ERROR: Signed AAB was not produced."
            echo ""
            echo "All AAB files:"
            find . -type f -name "*.aab" -print || true
            exit 1
          fi

          cp "$APK_SOURCE" ./app-release-signed.apk
          cp "$AAB_SOURCE" ./app-release-bundle.aab

          test -s ./app-release-signed.apk
          test -s ./app-release-bundle.aab

          echo ""
          echo "SIGNED APK: FOUND"
          echo "SIGNED AAB: FOUND"

          echo ""
          echo "APK:"
          ls -lh ./app-release-signed.apk

          echo ""
          echo "AAB:"
          ls -lh ./app-release-bundle.aab


      # =========================================================
      # 14. VERIFY APK SIGNATURE
      # =========================================================

      - name: Verify APK signature
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          APK="./app-release-signed.apk"

          test -s "$APK"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              -perm -111 \
              -print \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE: VALID"


      # =========================================================
      # 15. VERIFY AAB SIGNATURE
      # =========================================================

      - name: Verify AAB signature
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING AAB SIGNATURE"
          echo "=========================================="

          AAB="./app-release-bundle.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "AAB SIGNATURE: VALID"


      # =========================================================
      # 16. FINAL RELEASE CHECK
      # =========================================================

      - name: Final Android release check
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          APK="./app-release-signed.apk"
          AAB="./app-release-bundle.aab"

          test -s "$APK"
          test -s "$AAB"

          echo ""
          echo "=========================================="
          echo "OBITREND FINAL RELEASE"
          echo "=========================================="

          echo ""
          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "AAB:"
          ls -lh "$AAB"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"

          echo ""
          echo "AAB SHA256:"
          sha256sum "$AAB"

          echo ""
          echo "APK: READY"
          echo "AAB: READY"


      # =========================================================
      # 17. UPLOAD APK + AAB
      # =========================================================

      - name: Upload OBITREND APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            ${{ env.ANDROID_DIR }}/app-release-signed.apk
            ${{ env.ANDROID_DIR }}/app-release-bundle.aab
          if-no-files-found: error


      # =========================================================
      # 18. BUILD COMPLETE
      # =========================================================

      - name: Build complete
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          test -s "./app-release-signed.apk"
          test -s "./app-release-bundle.aab"

          echo ""
          echo "================================================"
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "================================================"
          echo ""
          echo "APK: SIGNED SUCCESSFULLY"
          echo "AAB: SIGNED SUCCESSFULLY"
          echo ""
          echo "PACKAGE ID: ai.obitrend.app"
          echo "ALIAS: obitrend"
          echo ""
          echo "APK: ./app-release-signed.apk"
          echo "AAB: ./app-release-bundle.aab"
          echo ""
          echo "READY FOR RELEASE"
          echo "================================================"
