name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT OBITREND
      # ------------------------------------------------------------
      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. NODE.JS
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------------------------
      # 3. JAVA 17
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------
      # 4. INSTALL BUBBLEWRAP
      # ------------------------------------------------------------
      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install -g @bubblewrap/cli@1.25.0

          echo "Bubblewrap version:"
          bubblewrap --version

      # ------------------------------------------------------------
      # 5. PREPARE ANDROID SDK
      # ------------------------------------------------------------
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

      # ------------------------------------------------------------
      # 6. ACCEPT ANDROID LICENSES
      # ------------------------------------------------------------
      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 7. CREATE BUBBLEWRAP CONFIG
      #
      # IMPORTANT:
      # Do NOT run "bubblewrap updateConfig".
      # We create the official Bubblewrap config directly.
      # ------------------------------------------------------------
      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          echo "Checking Java..."
          java -version

          echo "Checking Android SDK..."
          test -d "$ANDROID_SDK_ROOT"

          echo "Checking Bubblewrap..."
          bubblewrap --version

      # ------------------------------------------------------------
      # 8. PREPARE ANDROID BUILD DIRECTORY
      # ------------------------------------------------------------
      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          rm -rf android-build
          mkdir -p android-build

      # ------------------------------------------------------------
      # 9. CREATE SIGNING KEY
      #
      # The key is generated non-interactively so GitHub Actions
      # never gets stuck waiting for password input.
      # ------------------------------------------------------------
      - name: Create signing key
        shell: bash
        run: |
          set -e

          KEYSTORE="$GITHUB_WORKSPACE/android-build/android.keystore"

          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
            -alias obitrend \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

          echo "Signing key created."

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD"

      # ------------------------------------------------------------
      # 10. CREATE ANDROID PROJECT
      #
      # Bubblewrap init is interactive, so Expect supplies the
      # answers automatically.
      # ------------------------------------------------------------
      - name: Generate Android project
        shell: bash
        timeout-minutes: 15
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y expect

          cat > /tmp/bubblewrap-init.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 900

          set manifest "https://obitrend.vercel.app/manifest.webmanifest"
          set directory "$env(GITHUB_WORKSPACE)/android-build"
          set jdk "$env(JAVA_HOME)"
          set sdk "$env(ANDROID_SDK_ROOT)"
          set keystore "$env(GITHUB_WORKSPACE)/android-build/android.keystore"

          spawn bubblewrap init \
            --manifest="$manifest" \
            --directory="$directory"

          expect {
            -re "Do you want Bubblewrap to install the JDK" {
              send -- "No\r"
              exp_continue
            }

            -re "Path to your existing JDK" {
              send -- "$jdk\r"
              exp_continue
            }

            -re "Do you want Bubblewrap to install the Android SDK" {
              send -- "No\r"
              exp_continue
            }

            -re "Path to your existing Android SDK" {
              send -- "$sdk\r"
              exp_continue
            }

            -re "Domain:" {
              send -- "obitrend.vercel.app\r"
              exp_continue
            }

            -re "URL path:" {
              send -- "/\r"
              exp_continue
            }

            -re "Application name:" {
              send -- "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            -re "Short name:" {
              send -- "OBITREND\r"
              exp_continue
            }

            -re "Launcher Name:" {
              send -- "OBITREND\r"
              exp_continue
            }

            -re "Package ID:" {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -re "Application ID:" {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -re "Version Code:" {
              send -- "1\r"
              exp_continue
            }

            -re "Display mode:" {
              send -- "standalone\r"
              exp_continue
            }

            -re "Orientation:" {
              send -- "portrait\r"
              exp_continue
            }

            -re "Theme color:" {
              send -- "#050505\r"
              exp_continue
            }

            -re "Background color:" {
              send -- "#020204\r"
              exp_continue
            }

            -re "Navigation color:" {
              send -- "#020204\r"
              exp_continue
            }

            -re "Icon URL:" {
              send -- "https://obitrend.vercel.app/icons/icon-512.png\r"
              exp_continue
            }

            -re "Maskable icon URL:" {
              send -- "https://obitrend.vercel.app/icons/icon-512.png\r"
              exp_continue
            }

            -re "Monochrome icon URL:" {
              send -- "\r"
              exp_continue
            }

            -re "Do you want to enable Play Billing" {
              send -- "No\r"
              exp_continue
            }

            -re "Do you want to enable location delegation" {
              send -- "No\r"
              exp_continue
            }

            -re "Key path:" {
              send -- "$keystore\r"
              exp_continue
            }

            -re "Key alias:" {
              send -- "obitrend\r"
              exp_continue
            }

            eof {
              exit 0
            }

            timeout {
              puts stderr "ERROR: Bubblewrap init timed out."
              exit 1
            }

            default {
              exp_continue
            }
          }
          EXPECT

          chmod +x /tmp/bubblewrap-init.exp

          /tmp/bubblewrap-init.exp

          echo "Bubblewrap project generated."

          test -f android-build/twa-manifest.json
          test -f android-build/manifest-checksum.txt

          echo "Generated files:"
          find android-build -maxdepth 2 -type f | sort

      # ------------------------------------------------------------
      # 11. FORCE CORRECT SIGNING INFORMATION
      # ------------------------------------------------------------
      - name: Configure signing
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("android-build/twa-manifest.json")

          data = json.loads(path.read_text())

          data["signingKey"] = {
              "path": str(Path.cwd() / "android-build" / "android.keystore"),
              "alias": "obitrend"
          }

          path.write_text(
              json.dumps(data, indent=2) + "\n"
          )

          print("Updated signing configuration.")
          PY

          cat android-build/twa-manifest.json | grep -A4 '"signingKey"'

      # ------------------------------------------------------------
      # 12. VERIFY BUBBLEWRAP ENVIRONMENT
      # ------------------------------------------------------------
      - name: Verify Bubblewrap environment
        shell: bash
        run: |
          set -e

          cd android-build

          echo "Java:"
          java -version

          echo "Android SDK:"
          ls -la "$ANDROID_SDK_ROOT"

          echo "Bubblewrap:"
          bubblewrap --version

          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

          echo "Project:"
          ls -la

          echo "TWA manifest:"
          test -f twa-manifest.json

          echo "Keystore:"
          test -f android.keystore

      # ------------------------------------------------------------
      # 13. BUILD APK + AAB
      # ------------------------------------------------------------
      - name: Build Android APK and AAB
        shell: bash
        timeout-minutes: 20
        working-directory: android-build
        run: |
          set -e

          export BUBBLEWRAP_KEYSTORE_PASSWORD="${BUBBLEWRAP_KEYSTORE_PASSWORD}"
          export BUBBLEWRAP_KEY_PASSWORD="${BUBBLEWRAP_KEY_PASSWORD}"

          bubblewrap build \
            --manifest="$PWD/twa-manifest.json" \
            --signingKeyPath="$PWD/android.keystore" \
            --signingKeyAlias="obitrend"

      # ------------------------------------------------------------
      # 14. VERIFY OUTPUT
      # ------------------------------------------------------------
      - name: Verify APK and AAB
        shell: bash
        working-directory: android-build
        run: |
          set -e

          echo "Checking APK..."
          test -f app-release-signed.apk

          echo "Checking AAB..."
          test -f app-release-bundle.aab

          echo
          echo "BUILD SUCCESSFUL"
          echo
          ls -lh \
            app-release-signed.apk \
            app-release-bundle.aab

      # ------------------------------------------------------------
      # 15. UPLOAD APK + AAB
      # ------------------------------------------------------------
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-APK-and-AAB
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab
          if-no-files-found: error

      # ------------------------------------------------------------
      # 16. BUILD COMPLETE
      # ------------------------------------------------------------
      - name: Build complete
        shell: bash
        run: |
          echo "======================================"
          echo "OBITREND Android build completed."
          echo "APK and AAB uploaded successfully."
          echo "======================================"
