name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      PACKAGE_ID: com.obitrend.aifashioncreator
      APP_NAME: OBITREND AI Fashion Creator

      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest

      ANDROID_DIR: ${{ github.workspace }}/android-build

      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      KEYSTORE_FILE: ${{ github.workspace }}/android-build/android.keystore
      KEY_ALIAS: android

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 4. VERIFY BUILD ENVIRONMENT
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "OBITREND ANDROID BUILD"
          echo "============================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT"

          echo ""
          echo "PACKAGE ID:"
          echo "$PACKAGE_ID"

          if [ "$PACKAGE_ID" != "com.obitrend.aifashioncreator" ]; then
            echo "ERROR: WRONG PACKAGE ID"
            exit 1
          fi

          echo ""
          echo "PACKAGE ID CHECK PASSED."

      # ============================================================
      # 5. INSTALL BUBBLEWRAP
      # ============================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @bubblewrap/cli

          bubblewrap --version

      # ============================================================
      # 6. CONFIGURE BUBBLEWRAP
      # ============================================================

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      # ============================================================
      # 7. PREPARE BUILD DIRECTORY
      # ============================================================

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "Android build directory ready."

      # ============================================================
      # 8. DOWNLOAD WEB MANIFEST
      # ============================================================

      - name: Download OBITREND web manifest
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 60 \
            "$MANIFEST_URL" \
            -o "$ANDROID_DIR/web-manifest.json"

          test -s "$ANDROID_DIR/web-manifest.json"

          echo "Web manifest downloaded."

      # ============================================================
      # 9. VALIDATE WEB MANIFEST
      # ============================================================

      - name: Validate web manifest
        shell: bash
        run: |
          set -euo pipefail

          jq empty "$ANDROID_DIR/web-manifest.json"

          echo "Manifest JSON is valid."

          echo ""
          echo "Manifest information:"

          jq '{
            name: (.name // .short_name),
            short_name: (.short_name // .name),
            start_url: (.start_url // "/"),
            display: (.display // "standalone")
          }' "$ANDROID_DIR/web-manifest.json"

      # ============================================================
      # 10. CREATE TWA MANIFEST
      # ============================================================

      - name: Create OBITREND TWA manifest
        shell: bash
        run: |
          set -euo pipefail

          WEB_MANIFEST="$ANDROID_DIR/web-manifest.json"
          TWA_MANIFEST="$ANDROID_DIR/twa-manifest.json"

          NAME=$(jq -r \
            '.name // .short_name // "OBITREND AI Fashion Creator"' \
            "$WEB_MANIFEST")

          SHORT_NAME=$(jq -r \
            '.short_name // .name // "OBITREND"' \
            "$WEB_MANIFEST")

          START_URL=$(jq -r \
            '.start_url // "/"' \
            "$WEB_MANIFEST")

          THEME_COLOR=$(jq -r \
            '.theme_color // "#05050c"' \
            "$WEB_MANIFEST")

          BACKGROUND_COLOR=$(jq -r \
            '.background_color // "#05050c"' \
            "$WEB_MANIFEST")

          ICON_URL=$(jq -r '
            .icons
            | map(select(.src != null))
            | .[0].src
            // empty
          ' "$WEB_MANIFEST")

          if [ -z "$ICON_URL" ]; then
            echo "ERROR: No application icon found."
            exit 1
          fi

          if [[ "$ICON_URL" != http://* && "$ICON_URL" != https://* ]]; then
            ICON_URL="https://obitrend.vercel.app/${ICON_URL#/}"
          fi

          cat > "$TWA_MANIFEST" <<EOF
          {
            "packageId": "$PACKAGE_ID",
            "host": "obitrend.vercel.app",
            "name": "$NAME",
            "launcherName": "$SHORT_NAME",
            "startUrl": "$START_URL",
            "iconUrl": "$ICON_URL",
            "maskableIconUrl": "$ICON_URL",
            "themeColor": "$THEME_COLOR",
            "themeColorDark": "$THEME_COLOR",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "$BACKGROUND_COLOR",
            "display": "standalone",
            "enableNotifications": true,
            "enableSiteSettingsShortcut": true,
            "splashScreenFadeOutDuration": 300,
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "additionalTrustedOrigins": [],
            "shortcuts": [],
            "protocolHandlers": [],
            "fileHandlers": [],
            "retainedBundles": []
          }
          EOF

          jq empty "$TWA_MANIFEST"

          echo ""
          echo "TWA manifest created."

      # ============================================================
      # 11. HARD PACKAGE ID CHECK
      # ============================================================

      - name: Verify TWA package ID
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_PACKAGE_ID=$(jq -r '.packageId' \
            "$ANDROID_DIR/twa-manifest.json")

          echo "Required package ID:"
          echo "com.obitrend.aifashioncreator"

          echo ""
          echo "Generated package ID:"
          echo "$ACTUAL_PACKAGE_ID"

          if [ "$ACTUAL_PACKAGE_ID" != "com.obitrend.aifashioncreator" ]; then
            echo ""
            echo "ERROR: PACKAGE ID IS WRONG."
            exit 1
          fi

          echo ""
          echo "PACKAGE ID VERIFIED."

      # ============================================================
      # 12. CHECK SIGNING SECRETS
      # ============================================================

      - name: Check Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: Missing BUBBLEWRAP_KEYSTORE_PASSWORD."
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Missing BUBBLEWRAP_KEY_PASSWORD."
            exit 1
          fi

          echo "All signing secrets are available."

      # ============================================================
      # 13. RESTORE RELEASE KEYSTORE
      # ============================================================

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          echo "Release keystore restored."

      # ============================================================
      # 14. VERIFY SIGNING KEY
      # ============================================================

      - name: Verify signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Signing key verified."

      # ============================================================
      # 15. GENERATE ANDROID PROJECT
      # ============================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$PATH:$(npm prefix -g)/bin"

          cd "$ANDROID_DIR"

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

      # ============================================================
      # 16. SEARCH GENERATED PROJECT FOR WRONG PACKAGE ID
      # ============================================================

      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated Android project..."

          FOUND_CORRECT=0

          if grep -R \
            "com.obitrend.aifashioncreator" \
            "$ANDROID_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.xml" \
            --include="*.java" \
            --include="*.kt" \
            2>/dev/null \
            | head -20; then

            FOUND_CORRECT=1
          fi

          if [ "$FOUND_CORRECT" -ne 1 ]; then
            echo ""
            echo "ERROR: Correct package ID was not found."
            exit 1
          fi

          echo ""
          echo "Generated project contains:"
          echo "com.obitrend.aifashioncreator"

      # ============================================================
      # 17. REMOVE ANY PREVIOUS BUILD OUTPUT
      # ============================================================

      - name: Clean Android build outputs
        shell: bash
        run: |
          set -euo pipefail

          find "$ANDROID_DIR" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -delete

          echo "Old APK/AAB files removed."

      # ============================================================
      # 18. BUILD SIGNED APK + AAB
      # ============================================================

      - name: Build signed Android APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          export PATH="$PATH:$(npm prefix -g)/bin"

          cd "$ANDROID_DIR"

          bubblewrap build \
            --manifest="$ANDROID_DIR/twa-manifest.json" \
            --signingKeyPath="$KEYSTORE_FILE" \
            --signingKeyAlias="$KEY_ALIAS"

      # ============================================================
      # 19. FIND APK
      # ============================================================

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            ! -name "OBITREND-release.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          cp "$APK" \
            "$ANDROID_DIR/OBITREND-release.apk"

          test -s "$ANDROID_DIR/OBITREND-release.apk"

          echo "APK:"
          echo "$ANDROID_DIR/OBITREND-release.apk"

      # ============================================================
      # 20. FIND AAB
      # ============================================================

      - name: Locate AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.aab" \
            ! -name "OBITREND-release.aab" \
            -print \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: No AAB was produced."
            exit 1
          fi

          cp "$AAB" \
            "$ANDROID_DIR/OBITREND-release.aab"

          test -s "$ANDROID_DIR/OBITREND-release.aab"

          echo "AAB:"
          echo "$ANDROID_DIR/OBITREND-release.aab"

      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$ANDROID_DIR/OBITREND-release.apk"

          echo ""
          echo "APK SIGNATURE VERIFIED."

      # ============================================================
      # 22. VERIFY APK PACKAGE ID
      # ============================================================

      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/OBITREND-release.apk"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING" | head -5

          if ! echo "$BADGING" \
            | grep -q \
            "package: name='com.obitrend.aifashioncreator'"; then

            echo ""
            echo "ERROR: APK HAS THE WRONG PACKAGE ID."
            exit 1
          fi

          echo ""
          echo "APK PACKAGE ID VERIFIED:"
          echo "com.obitrend.aifashioncreator"

      # ============================================================
      # 23. VERIFY AAB EXISTS AND IS SIGNED
      # ============================================================

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/OBITREND-release.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            "$AAB"

          echo ""
          echo "AAB SIGNATURE VERIFIED."

      # ============================================================
      # 24. VERIFY AAB PACKAGE ID TEXT
      # ============================================================

      - name: Final AAB package verification
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/OBITREND-release.aab"

          echo "Final release:"
          echo "$AAB"

          echo ""
          echo "Required package:"
          echo "com.obitrend.aifashioncreator"

          echo ""
          echo "TWA package:"
          jq -r '.packageId' \
            "$ANDROID_DIR/twa-manifest.json"

          if [ "$(jq -r '.packageId' "$ANDROID_DIR/twa-manifest.json")" \
            != "com.obitrend.aifashioncreator" ]; then

            echo ""
            echo "ERROR: FINAL PACKAGE CHECK FAILED."
            exit 1
          fi

          echo ""
          echo "FINAL PACKAGE CHECK PASSED."

      # ============================================================
      # 25. SHA-256
      # ============================================================

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          sha256sum \
            OBITREND-release.apk \
            OBITREND-release.aab \
            > SHA256SUMS.txt

          echo ""
          cat SHA256SUMS.txt

      # ============================================================
      # 26. SHOW FINAL FILES
      # ============================================================

      - name: Show final release files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================"
          echo "FINAL OBITREND RELEASE"
          echo "============================================"

          echo ""
          echo "Package ID:"
          echo "com.obitrend.aifashioncreator"

          echo ""
          echo "Files:"

          ls -lh \
            "$ANDROID_DIR/OBITREND-release.apk" \
            "$ANDROID_DIR/OBITREND-release.aab" \
            "$ANDROID_DIR/SHA256SUMS.txt"

          echo ""
          echo "BUILD COMPLETE."

      # ============================================================
      # 27. UPLOAD APK + AAB
      # ============================================================

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            ${{ env.ANDROID_DIR }}/OBITREND-release.apk
            ${{ env.ANDROID_DIR }}/OBITREND-release.aab
            ${{ env.ANDROID_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 28. BUILD COMPLETE
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "============================================"
          echo "OBITREND BUILD SUCCESSFUL"
          echo "============================================"
          echo ""
          echo "Package ID:"
          echo "com.obitrend.aifashioncreator"
          echo ""
          echo "Signed APK: YES"
          echo "Signed AAB: YES"
          echo ""
          echo "Ready for Google Play internal testing."
