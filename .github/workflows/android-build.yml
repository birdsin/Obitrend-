name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE.JS
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # =========================================================
      # 4. INSTALL BUBBLEWRAP
      # =========================================================
      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING BUBBLEWRAP"
          echo "=========================================="

          npm install -g @bubblewrap/cli

          echo "Bubblewrap version:"
          bubblewrap --version

      # =========================================================
      # 5. VERIFY WEB MANIFEST
      # =========================================================
      - name: Verify Web Manifest
        shell: bash
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING WEB MANIFEST"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";
          const manifestUrl =
            "https://obitrend.vercel.app/manifest.webmanifest";

          let manifest;

          try {
            manifest = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            console.error(
              "ERROR: manifest.webmanifest is not valid JSON."
            );
            console.error(error.message);
            process.exit(1);
          }

          console.log("Manifest JSON: VALID");
          console.log("name:", manifest.name);
          console.log("short_name:", manifest.short_name);
          console.log("start_url:", manifest.start_url);
          console.log("display:", manifest.display);

          if (!manifest.name) {
            throw new Error("Manifest missing name.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest missing start_url.");
          }

          const startUrl =
            new URL(manifest.start_url, manifestUrl);

          console.log(
            "Resolved start URL:",
            startUrl.href
          );

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error("Manifest has no icons.");
          }

          console.log(
            "Icons:",
            manifest.icons.length
          );

          for (const [index, icon] of
            manifest.icons.entries()) {

            if (!icon.src) {
              throw new Error(
                `Icon ${index} has no src.`
              );
            }

            const iconUrl =
              new URL(icon.src, manifestUrl);

            if (
              !["http:", "https:"]
                .includes(iconUrl.protocol)
            ) {
              throw new Error(
                `Icon ${index} has invalid URL.`
              );
            }

            console.log(
              `Icon ${index}:`,
              iconUrl.href
            );
          }

          console.log(
            "MANIFEST VALIDATION: PASSED"
          );
          NODE

      # =========================================================
      # 6. PREPARE ANDROID DIRECTORY
      # =========================================================
      - name: Prepare Android build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"
          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

      # =========================================================
      # 7. CREATE BUBBLEWRAP PROJECT
      # =========================================================
      #
      # Bubblewrap init is interactive.
      #
      # We use a controlled pseudo-terminal, but ONLY match
      # the actual prompt text and never use broad patterns
      # such as .*Application name.*.
      #
      # =========================================================
      - name: Create Bubblewrap Android project
        shell: bash
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
          ANDROID_DIR: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING BUBBLEWRAP PROJECT"
          echo "=========================================="

          sudo apt-get update -y
          sudo apt-get install -y expect

          cd "$ANDROID_DIR"

          cat > /tmp/obitrend-bubblewrap.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 900

          set manifest $env(MANIFEST_URL)
          set android_dir $env(ANDROID_DIR)

          cd $android_dir

          spawn npx --yes @bubblewrap/cli init --manifest $manifest

          # -----------------------------------------------------
          # DOMAIN
          # -----------------------------------------------------
          expect -re {Domain:}
          send "\r"

          # -----------------------------------------------------
          # URL PATH
          # -----------------------------------------------------
          expect -re {URL path:}
          send "\r"

          # -----------------------------------------------------
          # APPLICATION NAME
          # -----------------------------------------------------
          expect -re {Application name:}
          send "OBITREND AI Fashion Creator\r"

          # -----------------------------------------------------
          # SHORT NAME
          # -----------------------------------------------------
          expect -re {Short name:}
          send "OBITREND\r"

          # -----------------------------------------------------
          # APPLICATION ID
          # -----------------------------------------------------
          expect -re {Application ID:}
          send "app.obitrend.ai\r"

          # -----------------------------------------------------
          # VERSION CODE
          # -----------------------------------------------------
          expect -re {Starting version code}
          send "1\r"

          # -----------------------------------------------------
          # DISPLAY MODE
          # -----------------------------------------------------
          expect -re {Display mode:}
          send "\r"

          # -----------------------------------------------------
          # ORIENTATION
          # -----------------------------------------------------
          expect -re {Orientation:}
          send "\r"

          # -----------------------------------------------------
          # STATUS BAR COLOR
          # -----------------------------------------------------
          expect -re {Status bar color:}
          send "#111827\r"

          # -----------------------------------------------------
          # SPLASH SCREEN COLOR
          # -----------------------------------------------------
          expect -re {Splash screen color:}
          send "#111827\r"

          # -----------------------------------------------------
          # ICON
          # -----------------------------------------------------
          expect -re {URL to an image that is at least 512x512px:}
          send "\r"

          # -----------------------------------------------------
          # MASKABLE ICON
          # -----------------------------------------------------
          expect -re {maskable icons}
          send "\r"

          # -----------------------------------------------------
          # MONOCHROME ICON
          # -----------------------------------------------------
          expect -re {monochrome icons}
          send "\r"

          # -----------------------------------------------------
          # SHORTCUTS
          # -----------------------------------------------------
          expect -re {Include app shortcuts}
          send "n\r"

          # -----------------------------------------------------
          # PLAY BILLING
          # -----------------------------------------------------
          expect -re {Include support for Play Billing}
          send "n\r"

          # -----------------------------------------------------
          # GEOLOCATION
          # -----------------------------------------------------
          expect -re {Request geolocation permission}
          send "n\r"

          # -----------------------------------------------------
          # SIGNING KEY PATH
          # -----------------------------------------------------
          expect -re {Key path:}
          send "./android.keystore\r"

          # -----------------------------------------------------
          # SIGNING KEY ALIAS
          # -----------------------------------------------------
          expect -re {Key alias:}
          send "android\r"

          # -----------------------------------------------------
          # WAIT FOR COMPLETION
          # -----------------------------------------------------
          expect {
            eof {
              catch wait result

              set exit_code [lindex $result 3]

              if {$exit_code != 0} {
                puts "ERROR: Bubblewrap init failed."
                exit $exit_code
              }

              exit 0
            }

            timeout {
              puts "ERROR: Bubblewrap init timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-bubblewrap.exp

          /usr/bin/expect /tmp/obitrend-bubblewrap.exp

          echo "=========================================="
          echo "BUBBLEWRAP PROJECT CREATED"
          echo "=========================================="

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json missing."
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "ERROR: gradlew missing."
            exit 1
          fi

          echo "twa-manifest.json: FOUND"
          echo "gradlew: FOUND"

      # =========================================================
      # 8. CREATE OWN SIGNING KEY
      # =========================================================
      - name: Create OBITREND signing keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING SIGNING KEYSTORE"
          echo "=========================================="

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is empty."
            exit 1
          fi

          rm -f "$ANDROID_DIR/android.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$ANDROID_DIR/android.keystore" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

          echo "Keystore created."

          echo "Testing keystore..."

          keytool \
            -list \
            -keystore "$ANDROID_DIR/android.keystore" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias android \
            >/dev/null

          echo "=========================================="
          echo "KEYSTORE PASSWORD: VALID"
          echo "KEY ALIAS: android"
          echo "KEYSTORE CHECK: PASSED"
          echo "=========================================="

      # =========================================================
      # 9. SET SIGNING CONFIGURATION
      # =========================================================
      - name: Configure signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          node <<'NODE'
          const fs = require("fs");

          const file = "twa-manifest.json";

          const manifest =
            JSON.parse(
              fs.readFileSync(file, "utf8")
            );

          manifest.signingKey = {
            path: "./android.keystore",
            alias: "android"
          };

          fs.writeFileSync(
            file,
            JSON.stringify(manifest, null, 2) + "\n"
          );

          console.log("Signing configuration:");
          console.log(
            JSON.stringify(
              manifest.signingKey,
              null,
              2
            )
          );
          NODE

          echo "Signing configuration saved."

      # =========================================================
      # 10. VERIFY PROJECT
      # =========================================================
      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING ANDROID PROJECT"
          echo "=========================================="

          test -f "$ANDROID_DIR/twa-manifest.json"
          test -f "$ANDROID_DIR/android.keystore"
          test -f "$ANDROID_DIR/gradlew"

          echo "twa-manifest.json: OK"
          echo "android.keystore: OK"
          echo "gradlew: OK"

          node <<'NODE'
          const fs = require("fs");

          const m =
            JSON.parse(
              fs.readFileSync(
                process.env.ANDROID_DIR +
                "/twa-manifest.json",
                "utf8"
              )
            );

          if (!m.signingKey) {
            throw new Error(
              "signingKey missing"
            );
          }

          if (
            m.signingKey.path !==
            "./android.keystore"
          ) {
            throw new Error(
              "Wrong keystore path"
            );
          }

          if (
            m.signingKey.alias !==
            "android"
          ) {
            throw new Error(
              "Wrong keystore alias"
            );
          }

          console.log(
            "Signing configuration: VALID"
          );
          NODE

      # =========================================================
      # 11. BUILD APK + AAB
      # =========================================================
      - name: Build Android APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING OBITREND APK + AAB"
          echo "=========================================="

          echo "Checking keystore..."

          keytool \
            -list \
            -keystore "./android.keystore" \
            -storetype PKCS12 \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -alias android \
            >/dev/null

          echo "Keystore: VALID"

          echo "Starting Bubblewrap build..."

          npx --yes @bubblewrap/cli build \
            --skipPwaValidation \
            --signingKeyPath="./android.keystore" \
            --signingKeyAlias="android"

          echo "=========================================="
          echo "BUBBLEWRAP BUILD FINISHED"
          echo "=========================================="

      # =========================================================
      # 12. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/app-release-signed.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK was not generated."
            find "$ANDROID_DIR" -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true
            exit 1
          fi

          echo "=========================================="
          echo "APK VERIFIED"
          echo "=========================================="

          ls -lh "$APK"

      # =========================================================
      # 13. VERIFY AAB
      # =========================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/app-release-bundle.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Signed AAB was not generated."
            find "$ANDROID_DIR" -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true
            exit 1
          fi

          echo "=========================================="
          echo "AAB VERIFIED"
          echo "=========================================="

          ls -lh "$AAB"

      # =========================================================
      # 14. UPLOAD APK + AAB
      # =========================================================
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Build
          path: |
            ${{ env.ANDROID_DIR }}/app-release-signed.apk
            ${{ env.ANDROID_DIR }}/app-release-bundle.aab
          if-no-files-found: error

      # =========================================================
      # 15. SUCCESS
      # =========================================================
      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " OBITREND ANDROID BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK:"
          ls -lh "$ANDROID_DIR/app-release-signed.apk"
          echo ""
          echo "AAB:"
          ls -lh "$ANDROID_DIR/app-release-bundle.aab"
          echo ""
          echo "Both files are ready."
