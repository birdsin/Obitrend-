name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. SET UP NODE
      # ---------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

                        # ---------------------------------------------------------
      # 3. SET UP ANDROID SDK + INSTALL BUBBLEWRAP
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Android SDK setup"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: ANDROID_HOME / ANDROID_SDK_ROOT is not set."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: Android SDK directory does not exist."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          sdkmanager --update || true

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed

          echo "Checking build-tools directory..."

          if [ ! -d "$SDK_PATH/build-tools" ]; then
            echo "ERROR: Android build-tools directory was not created."
            exit 1
          fi

          echo "Android SDK is ready."

      - name: Install and Configure Bubblewrap
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Installing Bubblewrap"
          echo "=========================================="

          npm install -g @bubblewrap/cli

                    echo "Java version:"

          echo "Java version:"
          java -version

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path is not available."
            exit 1
          fi

          if [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME does not exist."
            exit 1
          fi

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: Android SDK does not exist."
            exit 1
          fi

          if [ ! -d "$SDK_PATH/build-tools" ]; then
            echo "ERROR: Android SDK build-tools are missing."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          echo "Build-tools:"
          ls -la "$SDK_PATH/build-tools"

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          echo "Running Bubblewrap doctor..."

          bubblewrap doctor

          echo "=========================================="
          echo " Bubblewrap environment is READY"
          echo "=========================================="

      # ---------------------------------------------------------
      # 4. VERIFY WEB MANIFEST
      # ---------------------------------------------------------
      - name: Verify Web Manifest
        shell: bash
        run: |
          set -e

          echo "Checking:"
          echo "$MANIFEST_URL"

          HTTP_STATUS=$(curl -L -s -o /tmp/manifest.webmanifest \
            -w "%{http_code}" \
            "$MANIFEST_URL")

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Web Manifest could not be downloaded."
            cat /tmp/manifest.webmanifest || true
            exit 1
          fi

          echo "Manifest downloaded successfully."

          echo "----- MANIFEST -----"
          cat /tmp/manifest.webmanifest
          echo "--------------------"
                    echo "----- VALIDATING MANIFEST JSON -----"

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";
          const manifestUrl = process.env.MANIFEST_URL;

          let manifest;

          try {
            manifest = JSON.parse(fs.readFileSync(file, "utf8"));
          } catch (error) {
            console.error("ERROR: manifest.webmanifest is not valid JSON.");
            console.error(error.message);
            process.exit(1);
          }

          console.log("Manifest JSON: VALID");
          console.log("name:", manifest.name);
          console.log("short_name:", manifest.short_name);
          console.log("start_url:", manifest.start_url);
          console.log("scope:", manifest.scope);
          console.log("display:", manifest.display);
          console.log(
            "icons:",
            Array.isArray(manifest.icons) ? manifest.icons.length : 0
          );

          if (!manifest.name) {
            throw new Error("Manifest is missing name.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest is missing start_url.");
          }

          const startUrl = new URL(manifest.start_url, manifestUrl);
          console.log("Resolved start_url:", startUrl.href);

          if (manifest.scope) {
            const scopeUrl = new URL(manifest.scope, manifestUrl);
            console.log("Resolved scope:", scopeUrl.href);
          }

          if (!Array.isArray(manifest.icons) || manifest.icons.length === 0) {
            throw new Error("Manifest has no icons.");
          }

          for (const [index, icon] of manifest.icons.entries()) {
            if (!icon.src) {
              throw new Error(`Icon ${index} has no src.`);
            }

            const iconUrl = new URL(icon.src, manifestUrl);

            if (!["http:", "https:"].includes(iconUrl.protocol)) {
              throw new Error(
                `Icon ${index} has an invalid URL: ${icon.src}`
              );
            }

            console.log(`Icon ${index}:`, iconUrl.href);
          }

          console.log("Manifest URL validation: PASSED");
          NODE

          echo "----- MANIFEST VALIDATION COMPLETE -----"

      # ---------------------------------------------------------
      # 5. CREATE CLEAN ANDROID DIRECTORY
      # ---------------------------------------------------------
      - name: Prepare Android build directory
        shell: bash
        run: |
          set -e

          rm -rf "$ANDROID_DIR"
          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

          test -d "$ANDROID_DIR"

                                          # ---------------------------------------------------------
      # 6. CREATE BUBBLEWRAP PROJECT WITHOUT INTERACTIVE INIT
      # ---------------------------------------------------------
      - name: Create Bubblewrap Android project
        shell: bash
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
          ANDROID_DIR: ${{ env.ANDROID_DIR }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Creating OBITREND Bubblewrap project"
          echo "=========================================="

          mkdir -p "$ANDROID_DIR"
          cd "$ANDROID_DIR"

          echo "Android directory:"
          pwd

          echo "Checking Bubblewrap..."
          npx --yes @bubblewrap/cli --version

          # -----------------------------------------------------
          # DOWNLOAD WEB MANIFEST
          # -----------------------------------------------------

          echo "Downloading Web Manifest..."

          curl -L --fail --silent --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          echo "Web Manifest downloaded."

          # -----------------------------------------------------
          # READ ICON FROM WEB MANIFEST
          # -----------------------------------------------------

          ICON_URL=$(node <<'NODE'
          const fs = require("fs");

          const manifest = JSON.parse(
            fs.readFileSync("/tmp/manifest.webmanifest", "utf8")
          );

          if (!Array.isArray(manifest.icons) || manifest.icons.length === 0) {
            console.error("ERROR: No icons found in Web Manifest.");
            process.exit(1);
          }

          const icon = manifest.icons.find(i => {
            if (!i || !i.src) return false;

            const sizes = String(i.sizes || "")
              .split(/\s+/)
              .filter(Boolean);

            return sizes.some(size => {
              const match = size.match(/^(\d+)x(\d+)$/);
              if (!match) return false;

              return Number(match[1]) >= 512 &&
                     Number(match[2]) >= 512;
            });
          }) || manifest.icons[0];

          const base =
            process.env.MANIFEST_URL ||
            "https://obitrend.vercel.app/manifest.webmanifest";

          const iconUrl = new URL(icon.src, base).href;

          console.log(iconUrl);
          NODE
          )

          echo "Icon URL:"
          echo "$ICON_URL"

          # -----------------------------------------------------
          # CREATE TWA MANIFEST
          # -----------------------------------------------------

          echo "Creating twa-manifest.json..."

          node <<'NODE'
          const fs = require("fs");

          const source = JSON.parse(
            fs.readFileSync("/tmp/manifest.webmanifest", "utf8")
          );

          const manifestUrl =
            process.env.MANIFEST_URL ||
            "https://obitrend.vercel.app/manifest.webmanifest";

          const baseUrl = new URL(manifestUrl);

          const startUrl = new URL(
            source.start_url || "/",
            manifestUrl
          );

          const scopeUrl = new URL(
            source.scope || "/",
            manifestUrl
          );

          function findIcon(purpose) {
            if (!Array.isArray(source.icons)) return null;

            return source.icons.find(icon => {
              if (!icon || !icon.src) return false;

              if (!purpose) {
                return true;
              }

              const purposes = String(icon.purpose || "any")
                .split(/\s+/);

              return purposes.includes(purpose);
            }) || null;
          }

          const normalIcon =
            findIcon("any") ||
            (Array.isArray(source.icons) ? source.icons[0] : null);

          const maskableIcon = findIcon("maskable");

          if (!normalIcon || !normalIcon.src) {
            throw new Error(
              "Web Manifest does not contain a usable icon."
            );
          }

          const iconUrl =
            new URL(normalIcon.src, manifestUrl).href;

          const maskableIconUrl =
            maskableIcon && maskableIcon.src
              ? new URL(maskableIcon.src, manifestUrl).href
              : undefined;

          const twaManifest = {
            packageId: "ai.obitrend.app",

            host: baseUrl.host,

            name:
              source.name ||
              "OBITREND AI Fashion Creator",

            launcherName:
              source.short_name ||
              "OBITREND",

            display:
              source.display ||
              "standalone",

            themeColor:
              source.theme_color ||
              "#111827",

            themeColorDark:
              source.theme_color ||
              "#111827",

            navigationColor:
              source.background_color ||
              "#111827",

            navigationColorDark:
              source.background_color ||
              "#111827",

            navigationDividerColor:
              "#00000000",

            navigationDividerColorDark:
              "#00000000",

            backgroundColor:
              source.background_color ||
              "#111827",

            enableNotifications: true,

            startUrl:
              startUrl.pathname +
              startUrl.search +
              startUrl.hash,

            iconUrl,

            ...(maskableIconUrl
              ? { maskableIconUrl }
              : {}),

            splashScreenFadeOutDuration: 300,

            signingKey: {
              path: "./android.keystore",
              alias: "obitrend"
            },

            appVersionCode: 1,

            appVersion: "1",

            generatorApp: "bubblewrap-cli",

            webManifestUrl: manifestUrl,

            fallbackType: "customtabs",

            features: {},

            alphaDependencies: {
              enabled: false
            },

            enableSiteSettingsShortcut: false,

            isChromeOSOnly: false,

            isMetaQuest: false,

            fullScopeUrl: scopeUrl.href,

            minSdkVersion: 23,

            shortcuts: [],

            fingerprints: [],

            additionalTrustedOrigins: [],

            retainedBundles: [],

            orientation:
              source.orientation ||
              "portrait"
          };

          fs.writeFileSync(
            "twa-manifest.json",
            JSON.stringify(twaManifest, null, 2)
          );

          console.log(
            "twa-manifest.json created successfully."
          );
          NODE

          echo "=========================================="
          echo " TWA MANIFEST CREATED"
          echo "=========================================="

          cat twa-manifest.json

          # -----------------------------------------------------
          # CREATE SIGNING KEY
          # -----------------------------------------------------

          echo "=========================================="
          echo " Creating Android signing key"
          echo "=========================================="

          if [ ! -f "$ANDROID_DIR/android.keystore" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$ANDROID_DIR/android.keystore" \
              -alias obitrend \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
              -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

          else

            echo "Existing Android keystore found."

          fi

          test -f "$ANDROID_DIR/android.keystore"

          echo "Android signing key is ready."

          # -----------------------------------------------------
          # GENERATE ANDROID PROJECT
          # -----------------------------------------------------

          echo "=========================================="
          echo " Generating Android project"
          echo "=========================================="

          cd "$ANDROID_DIR"

          npx --yes @bubblewrap/cli update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

          echo "=========================================="
          echo " Bubblewrap Android project generated"
          echo "=========================================="

          if [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "ERROR: gradlew was not generated."
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json is missing."
            exit 1
          fi

          chmod +x "$ANDROID_DIR/gradlew"

          echo "Generated project files:"
          find "$ANDROID_DIR" -maxdepth 2 -type f | sort | head -150

          echo "=========================================="
          echo " Bubblewrap Android project is READY"
          echo "=========================================="

      # ---------------------------------------------------------
      # 7. VERIFY GENERATED ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Verify generated Android project
        shell: bash
        run: |
          set -e

          echo "Generated files:"
          find "$ANDROID_DIR" -maxdepth 2 -type f | sort | head -100

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json was not generated."
            exit 1
          fi

          echo "twa-manifest.json found."

            # ---------------------------------------------------------
      # 8. BUILD APK + AAB
      # ---------------------------------------------------------
      - name: Build Android APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Building OBITREND Android App"
          echo "=========================================="

          echo "Checking signing keystore..."

          test -f "./android.keystore"

          keytool -list \
            -keystore "./android.keystore" \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -alias android >/dev/null

          echo "Keystore password: VERIFIED"
          echo "Key alias: android"
          echo "Starting Bubblewrap build..."

          npx --yes @bubblewrap/cli build \
            --skipPwaValidation \
            --signingKeyPath="./android.keystore" \
            --signingKeyAlias="android"

          echo "=========================================="
          echo " APK + AAB BUILD FINISHED"
          echo "=========================================="

      # ---------------------------------------------------------
      # 9. VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # ---------------------------------------------------------
      # 10. VERIFY AAB
      # ---------------------------------------------------------
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB=$(find "$ANDROID_DIR" -type f -name "*.aab" | head -1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

      # ---------------------------------------------------------
      # 11. UPLOAD APK + AAB
      # ---------------------------------------------------------
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Build
          path: |
            ${{ env.ANDROID_DIR }}/**/*.apk
            ${{ env.ANDROID_DIR }}/**/*.aab
          if-no-files-found: error

      # ---------------------------------------------------------
      # 12. BUILD COMPLETE
      # ---------------------------------------------------------
      - name: Build complete
        run: |
          echo "=========================================="
          echo "       OBITREND ANDROID BUILD SUCCESS"
          echo "=========================================="
          echo ""
