name: Build OBITREND Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # INSTALL ANDROID SDK COMPONENTS
      # ============================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK_PATH"

          echo "Searching for sdkmanager..."

          SDKMANAGER=""

          if [ -x "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_PATH/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_PATH/cmdline-tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_PATH/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Searching entire runner..."
            find /usr/local/lib/android -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Checking SDK directories..."

          test -d "$SDK_PATH/build-tools"
          test -d "$SDK_PATH/platform-tools"

          echo "Android SDK is ready."

          echo "Build tools:"
          ls -la "$SDK_PATH/build-tools"

      # ============================================================
      # INSTALL BUBBLEWRAP
      # ============================================================
      - name: Install Bubblewrap and Expect
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y expect

          npm install -g @bubblewrap/cli \
            --ignore-scripts \
            --no-audit \
            --no-fund

          bubblewrap --version

      # ============================================================
      # CONFIGURE BUBBLEWRAP
      # ============================================================
      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo "ANDROID SDK:"
          echo "$SDK_PATH"

          test -d "$JAVA_HOME"
          test -d "$SDK_PATH"
          test -d "$SDK_PATH/build-tools"
          test -d "$SDK_PATH/platform-tools"

          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$SDK_PATH"

          echo ""
          echo "=============================="
          echo "BUBBLEWRAP CONFIG"
          echo "=============================="

          cat "$HOME/.bubblewrap/config.json"

      # ============================================================
      # VERIFY EVERYTHING
      # ============================================================
      - name: Verify Android and Bubblewrap
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "JAVA"
          echo "=============================="

          java -version

          echo ""
          echo "=============================="
          echo "NODE"
          echo "=============================="

          node --version

          echo ""
          echo "=============================="
          echo "BUBBLEWRAP"
          echo "=============================="

          bubblewrap --version

          echo ""
          echo "=============================="
          echo "BUBBLEWRAP DOCTOR"
          echo "=============================="

          bubblewrap doctor

      # ============================================================
      # CREATE ANDROID PROJECT
      # ============================================================
      - name: Create Android project
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          rm -rf android-build
          mkdir -p android-build

          cat > /tmp/bubblewrap-init.exp <<'EOF'
          #!/usr/bin/expect -f

          set timeout 900

          spawn bubblewrap init \
            --manifest=https://obitrend.vercel.app/manifest.webmanifest \
            --directory=android-build

          expect {

            "*Do you want Bubblewrap to install the JDK*" {
              send -- "n\r"
              exp_continue
            }

            "*Path to your existing JDK*" {
              send -- "$env(JAVA_HOME)\r"
              exp_continue
            }

            "*Do you want Bubblewrap to install the Android SDK*" {
              send -- "n\r"
              exp_continue
            }

            "*Path to your existing Android SDK*" {
              send -- "$env(ANDROID_HOME)\r"
              exp_continue
            }

            "*Host*" {
              send -- "\r"
              exp_continue
            }

            "*Start URL*" {
              send -- "\r"
              exp_continue
            }

            "*Name*" {
              send -- "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            "*Launcher Name*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Package ID*" {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            "*Version Code*" {
              send -- "1\r"
              exp_continue
            }

            "*Display Mode*" {
              send -- "\r"
              exp_continue
            }

            "*Orientation*" {
              send -- "\r"
              exp_continue
            }

            "*Theme Color*" {
              send -- "\r"
              exp_continue
            }

            "*Background Color*" {
              send -- "\r"
              exp_continue
            }

            "*Icon URL*" {
              send -- "\r"
              exp_continue
            }

            "*Maskable Icon URL*" {
              send -- "\r"
              exp_continue
            }

            "*Monochrome Icon URL*" {
              send -- "\r"
              exp_continue
            }

            "*Shortcuts*" {
              send -- "\r"
              exp_continue
            }

            "*Play Billing*" {
              send -- "\r"
              exp_continue
            }

            "*Location Delegation*" {
              send -- "\r"
              exp_continue
            }

            "*Key Path*" {
              send -- "android.keystore\r"
              exp_continue
            }

            "*Key Alias*" {
              send -- "obitrend\r"
              exp_continue
            }

            "*Create a signing key*" {
              send -- "y\r"
              exp_continue
            }

            "*Full Name*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Organizational Unit*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Organization*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Country*" {
              send -- "NG\r"
              exp_continue
            }

            "*Keystore Password*" {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            "*Key Password*" {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            eof {
              exit 0
            }

            timeout {
              puts "Bubblewrap initialization timed out."
              exit 1
            }
          }
          EOF

          chmod +x /tmp/bubblewrap-init.exp

          /tmp/bubblewrap-init.exp

      # ============================================================
      # BUILD APK + AAB
      # ============================================================
      - name: Build Android app
        working-directory: android-build
        shell: bash
        run: |
          set -e

          bubblewrap build --skipPwaValidation

      # ============================================================
      # UPLOAD APK + AAB
      # ============================================================
      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: obitrend-android-build
          path: |
            android-build/*.apk
            android-build/*.aab

      - name: Build complete
        if: always()
        run: |
          echo "OBITREND Android build workflow completed."
