name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      PACKAGE_ID: com.obitrend.aifashioncreator
      APP_NAME: OBITREND AI Fashion Creator
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build
      KEYSTORE_FILE: ${{ github.workspace }}/android-build/android.keystore
      KEY_ALIAS: android

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE.JS 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK components installed."

      # ============================================================
      # 5. VERIFY JAVA / NODE / ANDROID
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "OBITREND BUILD ENVIRONMENT"
          echo "=============================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not-set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"

          echo ""
          echo "Package ID:"
          echo "$PACKAGE_ID"

          if [ "$PACKAGE_ID" != "com.obitrend.aifashioncreator" ]; then
            echo ""
            echo "ERROR: PACKAGE ID IS WRONG."
            exit 1
          fi

          echo ""
          echo "BUILD ENVIRONMENT OK."

      # ============================================================
      # 6. INSTALL BUBBLEWRAP
      # ============================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @bubblewrap/cli

          bubblewrap --version

          echo "Bubblewrap installed successfully."

      # ============================================================
      # 7. PREPARE CLEAN ANDROID DIRECTORY
      # ============================================================

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "Clean Android build directory created."

      # ============================================================
      # 8. DOWNLOAD WEB MANIFEST
      # ============================================================

      - name: Download OBITREND web manifest
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 60 \
            "$MANIFEST_URL" \
            -o "$ANDROID_DIR/web-manifest.json"

          test -s "$ANDROID_DIR/web-manifest.json"

          echo "Web manifest downloaded."

      # ============================================================
      # 9. VALIDATE WEB MANIFEST
      # ============================================================

      - name: Validate web manifest
        shell: bash
        run: |
          set -euo pipefail

          jq empty "$ANDROID_DIR/web-manifest.json"

          echo "Web manifest JSON is valid."

          echo ""
          echo "Web manifest:"
          jq '{
            name: (.name // .short_name),
            short_name: (.short_name // .name),
            start_url: (.start_url // "/"),
            display: (.display // "standalone")
          }' "$ANDROID_DIR/web-manifest.json"

      # ============================================================
      # 10. GET ICON
      # ============================================================

      - name: Verify app icon
        shell: bash
        run: |
          set -euo pipefail

          ICON_URL=$(jq -r '
            .icons
            | map(select(.src != null))
            | .[0].src
            // empty
          ' "$ANDROID_DIR/web-manifest.json")

          if [ -z "$ICON_URL" ]; then
            echo "ERROR: No icon was found in the web manifest."
            exit 1
          fi

          if [[ "$ICON_URL" != http://* && "$ICON_URL" != https://* ]]; then
            ICON_URL="https://obitrend.vercel.app/${ICON_URL#/}"
          fi

          echo "Icon URL:"
          echo "$ICON_URL"

          echo "$ICON_URL" > "$ANDROID_DIR/icon-url.txt"

      # ============================================================
      # 11. CREATE TWA MANIFEST
      # ============================================================

      - name: Create TWA manifest
        shell: bash
        run: |
          set -euo pipefail

          WEB_MANIFEST="$ANDROID_DIR/web-manifest.json"
          TWA_MANIFEST="$ANDROID_DIR/twa-manifest.json"

          NAME=$(jq -r \
            '.name // .short_name // "OBITREND AI Fashion Creator"' \
            "$WEB_MANIFEST")

          SHORT_NAME=$(jq -r \
            '.short_name // .name // "OBITREND"' \
            "$WEB_MANIFEST")

          START_URL=$(jq -r \
            '.start_url // "/"' \
            "$WEB_MANIFEST")

          THEME_COLOR=$(jq -r \
            '.theme_color // "#111827"' \
            "$WEB_MANIFEST")

          BACKGROUND_COLOR=$(jq -r \
            '.background_color // "#111827"' \
            "$WEB_MANIFEST")

          ICON_URL=$(cat "$ANDROID_DIR/icon-url.txt")

          cat > "$TWA_MANIFEST" <<EOF
          {
            "packageId": "com.obitrend.aifashioncreator",
            "host": "obitrend.vercel.app",
            "name": "OBITREND AI Fashion Creator",
            "launcherName": "OBITREND",
            "display": "standalone",
            "themeColor": "$THEME_COLOR",
            "themeColorDark": "$THEME_COLOR",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#00000000",
            "navigationDividerColorDark": "#00000000",
            "backgroundColor": "$BACKGROUND_COLOR",
            "enableNotifications": true,
            "startUrl": "$START_URL",
            "iconUrl": "$ICON_URL",
            "maskableIconUrl": "$ICON_URL",
            "splashScreenFadeOutDuration": 300,
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "signingKey": {
              "path": "$KEYSTORE_FILE",
              "alias": "android"
            },
            "shortcuts": [],
            "generatorApp": "Bubblewrap",
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "protocolHandlers": [],
            "fileHandlers": [],
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": []
          }
          EOF

          jq empty "$TWA_MANIFEST"

          echo ""
          echo "TWA manifest created."

      # ============================================================
      # 12. HARD PACKAGE ID VERIFICATION
      # ============================================================

      - name: Verify package ID before Android generation
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_FROM_MANIFEST=$(jq -r \
            '.packageId' \
            "$ANDROID_DIR/twa-manifest.json")

          echo "Required:"
          echo "com.obitrend.aifashioncreator"

          echo ""
          echo "Generated:"
          echo "$PACKAGE_FROM_MANIFEST"

          if [ "$PACKAGE_FROM_MANIFEST" != "com.obitrend.aifashioncreator" ]; then
            echo ""
            echo "ERROR: WRONG PACKAGE ID."
            exit 1
          fi

          echo ""
          echo "PACKAGE ID VERIFIED."

      # ============================================================
      # 13. CHECK SIGNING SECRETS
      # ============================================================

      - name: Check signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEY_PASSWORD:-}" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "All required signing secrets exist."

      # ============================================================
      # 14. RESTORE SIGNING KEY
      # ============================================================

      - name: Restore Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          echo "Android signing keystore restored."

      # ============================================================
      # 15. VERIFY SIGNING KEY
      # ============================================================

      - name: Verify signing keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Signing keystore verified."

      # ============================================================
      # 16. CONFIGURE BUBBLEWRAP
      # ============================================================

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo "Bubblewrap configuration complete."

      # ============================================================
      # 17. GENERATE ANDROID PROJECT
      # ============================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

          echo ""
          echo "Android project generated."

      # ============================================================
      # 18. VERIFY GENERATED PACKAGE ID
      # ============================================================

      - name: Verify generated Android package ID
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching generated Android project..."

          if grep -R \
            "com.obitrend.aifashioncreator" \
            "$ANDROID_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.xml" \
            --include="*.java" \
            --include="*.kt" \
            2>/dev/null \
            | head -30; then

            echo ""
            echo "CORRECT PACKAGE ID FOUND."

          else

            echo ""
            echo "ERROR: CORRECT PACKAGE ID NOT FOUND."
            exit 1

          fi

      # ============================================================
      # 19. BUILD SIGNED APK + AAB
      # ============================================================

      - name: Build signed Android APK and AAB
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          bubblewrap build \
            --manifest="$ANDROID_DIR/twa-manifest.json" \
            --signingKeyPath="$KEYSTORE_FILE" \
            --signingKeyAlias="$KEY_ALIAS"

          echo ""
          echo "Bubblewrap build completed."

      # ============================================================
      # 20. LOCATE SIGNED APK
      # ============================================================

      - name: Locate signed APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/app-release-signed.apk"

          if [ ! -f "$APK" ]; then
            APK=$(find "$ANDROID_DIR" \
              -type f \
              -name "app-release-signed.apk" \
              -print \
              | head -n 1)
          fi

          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK was not produced."
            exit 1
          fi

          cp "$APK" \
            "$ANDROID_DIR/OBITREND-release.apk"

          test -s "$ANDROID_DIR/OBITREND-release.apk"

          echo "Signed APK found."

      # ============================================================
      # 21. LOCATE SIGNED AAB
      # ============================================================

      - name: Locate signed AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/app-release-bundle.aab"

          if [ ! -f "$AAB" ]; then
            AAB=$(find "$ANDROID_DIR" \
              -type f \
              -name "app-release-bundle.aab" \
              -print \
              | head -n 1)
          fi

          if [ -z "${AAB:-}" ] || [ ! -f "$AAB" ]; then
            echo "ERROR: Signed AAB was not produced."
            exit 1
          fi

          cp "$AAB" \
            "$ANDROID_DIR/OBITREND-release.aab"

          test -s "$ANDROID_DIR/OBITREND-release.aab"

          echo "Signed AAB found."

      # ============================================================
      # 22. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$ANDROID_DIR/OBITREND-release.apk"

          echo ""
          echo "APK SIGNATURE VERIFIED."

      # ============================================================
      # 23. VERIFY APK PACKAGE ID
      # ============================================================

      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$ANDROID_DIR/OBITREND-release.apk"
          )

          echo "$BADGING" | head -5

          if ! echo "$BADGING" \
            | grep -q \
            "package: name='com.obitrend.aifashioncreator'"; then

            echo ""
            echo "ERROR: APK PACKAGE ID IS WRONG."
            exit 1
          fi

          echo ""
          echo "APK PACKAGE ID VERIFIED:"
          echo "com.obitrend.aifashioncreator"

      # ============================================================
      # 24. VERIFY AAB SIGNATURE
      # ============================================================

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          jarsigner \
            -verify \
            "$ANDROID_DIR/OBITREND-release.aab"

          echo ""
          echo "AAB SIGNATURE VERIFIED."

      # ============================================================
      # 25. VERIFY AAB CONTAINS ANDROID MANIFEST
      # ============================================================

      - name: Verify AAB structure
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/OBITREND-release.aab"

          unzip -l "$AAB" | grep -q "base/manifest/AndroidManifest.xml"

          unzip -l "$AAB" | grep -q "base/dex/"

          echo ""
          echo "AAB STRUCTURE VERIFIED."

      # ============================================================
      # 26. FINAL PACKAGE ID CHECK
      # ============================================================

      - name: Final package ID verification
        shell: bash
        run: |
          set -euo pipefail

          FINAL_PACKAGE=$(jq -r \
            '.packageId' \
            "$ANDROID_DIR/twa-manifest.json")

          if [ "$FINAL_PACKAGE" != "com.obitrend.aifashioncreator" ]; then
            echo "ERROR: FINAL PACKAGE ID CHECK FAILED."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "FINAL PACKAGE ID"
          echo "=============================================="
          echo ""
          echo "com.obitrend.aifashioncreator"
          echo ""
          echo "PACKAGE ID CHECK PASSED."

      # ============================================================
      # 27. GENERATE CHECKSUMS
      # ============================================================

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          sha256sum \
            OBITREND-release.apk \
            OBITREND-release.aab \
            > SHA256SUMS.txt

          echo ""
          cat SHA256SUMS.txt

      # ============================================================
      # 28. SHOW RELEASE FILES
      # ============================================================

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "OBITREND RELEASE"
          echo "=============================================="

          echo ""
          echo "Package:"
          echo "com.obitrend.aifashioncreator"

          echo ""
          echo "Files:"

          ls -lh \
            "$ANDROID_DIR/OBITREND-release.apk" \
            "$ANDROID_DIR/OBITREND-release.aab" \
            "$ANDROID_DIR/SHA256SUMS.txt"

          echo ""
          echo "APK: SIGNED"
          echo "AAB: SIGNED"
          echo ""
          echo "READY FOR GOOGLE PLAY."

      # ============================================================
      # 29. UPLOAD RELEASE ARTIFACT
      # ============================================================

      - name: Upload Android release
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            ${{ env.ANDROID_DIR }}/OBITREND-release.apk
            ${{ env.ANDROID_DIR }}/OBITREND-release.aab
            ${{ env.ANDROID_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 30. COMPLETE
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "OBITREND ANDROID BUILD SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "Package ID:"
          echo "com.obitrend.aifashioncreator"
          echo ""
          echo "Signed APK: YES"
          echo "Signed AAB: YES"
          echo ""
          echo "The AAB is ready for Google Play."
