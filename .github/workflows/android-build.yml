name: Build OBITREND Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      APP_URL: https://obitrend.vercel.app
      ANDROID_PROJECT: android-build

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. ANDROID BUILD TOOLS
      # ============================================================

      - name: Install Android build tools
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 6. VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "OBITREND ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version
          adb version
          sdkmanager --version

      # ============================================================
      # 7. INSTALL BUBBLEWRAP
      # ============================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install --global @bubblewrap/cli@1.25.0 --ignore-scripts

          echo "Bubblewrap installed."

          command -v bubblewrap

      # ============================================================
      # 8. CONFIGURE BUBBLEWRAP
      # ============================================================

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME"

      # ============================================================
      # 9. CHECK SIGNING SECRETS
      # ============================================================

      - name: Check signing secrets
        shell: bash
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KS_PASS" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASS" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing secrets are present."

      # ============================================================
      # 10. PREPARE PROJECT DIRECTORY
      # ============================================================

      - name: Prepare Android project directory
        shell: bash
        run: |
          set -e

          PROJECT="$GITHUB_WORKSPACE/$ANDROID_PROJECT"

          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"

          echo "Android project:"
          echo "$PROJECT"

          test -d "$PROJECT"

      # ============================================================
      # 11. CREATE CLEAN LOCAL WEB MANIFEST
      #
      # IMPORTANT:
      # We do NOT feed Bubblewrap the live Vercel manifest.
      # This removes malformed/unsupported manifest fields from
      # the Bubblewrap initialization process.
      # ============================================================

      - name: Create clean OBITREND Web Manifest
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/obitrend-manifest

          cat > /tmp/obitrend-manifest/manifest.webmanifest <<'EOF'
          {
            "name": "OBITREND AI Fashion Creator",
            "short_name": "OBITREND",
            "start_url": "/",
            "scope": "/",
            "display": "standalone",
            "orientation": "portrait",
            "theme_color": "#050505",
            "background_color": "#050505",
            "icons": [
              {
                "src": "https://obitrend.vercel.app/icons/icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "https://obitrend.vercel.app/icons/icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              }
            ]
          }
          EOF

          echo "Clean manifest created:"
          cat /tmp/obitrend-manifest/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/obitrend-manifest/manifest.webmanifest";

          const manifest = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (!manifest.name) {
            throw new Error("Manifest name is missing.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest start_url is missing.");
          }

          if (!manifest.scope) {
            throw new Error("Manifest scope is missing.");
          }

          if (!Array.isArray(manifest.icons)) {
            throw new Error("Manifest icons are missing.");
          }

          for (const icon of manifest.icons) {
            new URL(icon.src);
          }

          console.log("Clean manifest validation successful.");
          NODE

      # ============================================================
      # 12. SERVE LOCAL MANIFEST
      #
      # Bubblewrap receives a real HTTP URL.
      # No malformed Vercel manifest is used for initialization.
      # ============================================================

      - name: Start local manifest server
        shell: bash
        run: |
          set -e

          cd /tmp/obitrend-manifest

          nohup python3 -m http.server 8765 \
            --bind 127.0.0.1 \
            >/tmp/obitrend-manifest-server.log 2>&1 &

          echo $! >/tmp/obitrend-manifest-server.pid

          sleep 3

          curl --fail \
            http://127.0.0.1:8765/manifest.webmanifest

      # ============================================================
      # 13. INSTALL EXPECT
      # ============================================================

      - name: Install Expect
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y expect

            # ============================================================
      # 14. CREATE BUBBLEWRAP PROJECT
      # ============================================================

      - name: Create Bubblewrap Android project
        shell: bash
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/$ANDROID_PROJECT"

          echo "=========================================="
          echo "CREATING OBITREND BUBBLEWRAP PROJECT"
          echo "=========================================="

          echo "Project:"
          echo "$PROJECT"

          # --------------------------------------------------------
          # Clean project directory.
          # --------------------------------------------------------

          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"

          test -d "$PROJECT"

          # --------------------------------------------------------
          # Verify the local manifest server is working.
          # --------------------------------------------------------

          MANIFEST_URL="http://127.0.0.1:8765/manifest.webmanifest"

          echo ""
          echo "Checking manifest:"
          echo "$MANIFEST_URL"

          curl --fail \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/obitrend-manifest-check.json

          echo ""
          echo "Manifest received:"
          cat /tmp/obitrend-manifest-check.json

          # --------------------------------------------------------
          # Validate manifest.
          # --------------------------------------------------------

          node <<'NODE'
          const fs = require("fs");

          const file =
            "/tmp/obitrend-manifest-check.json";

          const manifest = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (!manifest.name) {
            throw new Error("Manifest name is missing.");
          }

          if (!manifest.short_name) {
            throw new Error("Manifest short_name is missing.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest start_url is missing.");
          }

          if (!manifest.scope) {
            throw new Error("Manifest scope is missing.");
          }

          if (!Array.isArray(manifest.icons) ||
              manifest.icons.length === 0) {
            throw new Error("Manifest icons are missing.");
          }

          const base =
            "https://obitrend.vercel.app/";

          const startUrl =
            new URL(manifest.start_url, base);

          const scope =
            new URL(manifest.scope, base);

          if (
            startUrl.hostname !==
            "obitrend.vercel.app"
          ) {
            throw new Error(
              `Invalid start_url: ${startUrl.href}`
            );
          }

          if (
            scope.hostname !==
            "obitrend.vercel.app"
          ) {
            throw new Error(
              `Invalid scope: ${scope.href}`
            );
          }

          for (const icon of manifest.icons) {
            if (!icon.src) {
              throw new Error(
                "An icon is missing src."
              );
            }

            new URL(icon.src, base);
          }

          console.log("");
          console.log(
            "Manifest validation successful."
          );
          console.log(
            "Start URL:",
            startUrl.href
          );
          console.log(
            "Scope:",
            scope.href
          );
          NODE

          # --------------------------------------------------------
          # Bubblewrap initialization.
          #
          # IMPORTANT:
          # The manifest URL is a valid HTTP URL.
          # Bubblewrap init downloads and parses this manifest.
          # --------------------------------------------------------

          cat > /tmp/obitrend-bubblewrap.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 900

          set manifest \
            "http://127.0.0.1:8765/manifest.webmanifest"

          set project \
            "$env(GITHUB_WORKSPACE)/$env(ANDROID_PROJECT)"

          set java_home $env(JAVA_HOME)
          set android_home $env(ANDROID_HOME)

          set ks_pass $env(KS_PASS)
          set key_pass $env(KEY_PASS)

          spawn bubblewrap init \
            --manifest="$manifest" \
            --directory="$project"

          expect {

            -re {Directory .* does not exist.*} {
              send "y\r"
              exp_continue
            }

            -re {Do you want Bubblewrap to install the JDK.*} {
              send "n\r"
              exp_continue
            }

            -re {Path to your existing JDK.*} {
              send "$java_home\r"
              exp_continue
            }

            -re {Do you want Bubblewrap to install Android SDK.*} {
              send "n\r"
              exp_continue
            }

            -re {Path to your existing Android SDK.*} {
              send "$android_home\r"
              exp_continue
            }

            -re {Domain.*} {
              send "obitrend.vercel.app\r"
              exp_continue
            }

            -re {Start URL.*} {
              send "/\r"
              exp_continue
            }

            -re {Application name.*} {
              send "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            -re {Short name.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {Package ID.*} {
              send "com.obitrend.ai\r"
              exp_continue
            }

            -re {App Version.*} {
              send "1\r"
              exp_continue
            }

            -re {App Version Name.*} {
              send "1.0.0\r"
              exp_continue
            }

            -re {Display mode.*} {
              send "standalone\r"
              exp_continue
            }

            -re {Orientation.*} {
              send "portrait\r"
              exp_continue
            }

            -re {Theme color.*} {
              send "#050505\r"
              exp_continue
            }

            -re {Background color.*} {
              send "#050505\r"
              exp_continue
            }

            -re {Icon URL.*} {
              send "https://obitrend.vercel.app/icons/icon-512.png\r"
              exp_continue
            }

            -re {Maskable icon URL.*} {
              send "\r"
              exp_continue
            }

            -re {Monochrome icon URL.*} {
              send "\r"
              exp_continue
            }

            -re {Full name.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {Organizational Unit.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {Organization.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {Country.*} {
              send "NG\r"
              exp_continue
            }

            -re {Keystore password.*} {
              send "$ks_pass\r"
              exp_continue
            }

            -re {Key password.*} {
              send "$key_pass\r"
              exp_continue
            }

            -re {Do you want to create.*signing key.*} {
              send "y\r"
              exp_continue
            }

            eof {
              exit 0
            }

            timeout {
              puts stderr \
                "ERROR: Bubblewrap initialization timed out."
              exit 1
            }

            default {
              exp_continue
            }
          }
          EXPECT

          chmod +x \
            /tmp/obitrend-bubblewrap.exp

          /tmp/obitrend-bubblewrap.exp

          # --------------------------------------------------------
          # Confirm Bubblewrap actually generated its manifest.
          # --------------------------------------------------------

          echo ""
          echo "Checking generated twa-manifest.json..."

          test -f "$PROJECT/twa-manifest.json"

          # --------------------------------------------------------
          # Correct ONLY the generated TWA configuration.
          # --------------------------------------------------------

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const project = path.join(
            process.env.GITHUB_WORKSPACE,
            process.env.ANDROID_PROJECT
          );

          const file = path.join(
            project,
            "twa-manifest.json"
          );

          const twa = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          // Real OBITREND production host.
          twa.host =
            "obitrend.vercel.app";

          // Real application launch path.
          twa.startUrl = "/";

          // Real production Web Manifest.
          twa.webManifestUrl =
            "https://obitrend.vercel.app/manifest.webmanifest";

          // Android application identity.
          twa.packageId =
            "com.obitrend.ai";

          twa.name =
            "OBITREND AI Fashion Creator";

          twa.launcherName =
            "OBITREND";

          // Android version.
          twa.appVersionCode = 1;
          twa.appVersion = "1.0.0";

          // Production icon.
          twa.iconUrl =
            "https://obitrend.vercel.app/icons/icon-512.png";

          // App appearance.
          twa.themeColor = "#050505";
          twa.backgroundColor = "#050505";

          fs.writeFileSync(
            file,
            JSON.stringify(twa, null, 2) + "\n"
          );

          console.log("");
          console.log(
            "Corrected twa-manifest.json:"
          );
          console.log(
            JSON.stringify(twa, null, 2)
          );
          NODE

          # --------------------------------------------------------
          # IMPORTANT:
          # --manifest points to the DIRECTORY containing
          # twa-manifest.json.
          #
          # It does NOT point to the Web Manifest URL.
          # --------------------------------------------------------

          cd "$PROJECT"

          echo ""
          echo "Updating Android project..."

          bubblewrap update \
            --manifest="$PROJECT" \
            --skipVersionUpgrade

          # --------------------------------------------------------
          # Final validation.
          # --------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "FINAL BUBBLEWRAP VALIDATION"
          echo "=========================================="

          test -f "$PROJECT/twa-manifest.json"

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const file = path.join(
            process.env.GITHUB_WORKSPACE,
            process.env.ANDROID_PROJECT,
            "twa-manifest.json"
          );

          const twa = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (
            twa.host !==
            "obitrend.vercel.app"
          ) {
            throw new Error(
              `Wrong host: ${twa.host}`
            );
          }

          if (twa.startUrl !== "/") {
            throw new Error(
              `Wrong startUrl: ${twa.startUrl}`
            );
          }

          if (
            twa.webManifestUrl !==
            "https://obitrend.vercel.app/manifest.webmanifest"
          ) {
            throw new Error(
              `Wrong webManifestUrl: ${twa.webManifestUrl}`
            );
          }

          if (
            twa.packageId !==
            "com.obitrend.ai"
          ) {
            throw new Error(
              `Wrong package ID: ${twa.packageId}`
            );
          }

          console.log("");
          console.log(
            "Host:",
            twa.host
          );

          console.log(
            "Start URL:",
            twa.startUrl
          );

          console.log(
            "Web Manifest:",
            twa.webManifestUrl
          );

          console.log(
            "Package ID:",
            twa.packageId
          );

          console.log("");
          console.log(
            "BUBBLEWRAP PROJECT CREATED SUCCESSFULLY"
          );
          NODE

      # ============================================================
      # 15. VERIFY PROJECT
      # ============================================================

      - name: Verify generated Android project
        shell: bash
        run: |
          set -e

          PROJECT="$GITHUB_WORKSPACE/$ANDROID_PROJECT"

          echo "Generated project:"
          find "$PROJECT" -maxdepth 3 -type f | sort

          test -f "$PROJECT/twa-manifest.json"

          echo "twa-manifest.json:"
          cat "$PROJECT/twa-manifest.json"

      # ============================================================
      # 16. BUILD APK AND AAB
      # ============================================================

            - name: Build Android APK and AAB
        shell: bash
        working-directory: android-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING OBITREND"
          echo "=========================================="

          bubblewrap build \
            --skipPwaValidation

      # ============================================================
      # 17. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
              -type f | sort
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ============================================================
      # 18. VERIFY AAB
      # ============================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="$(find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
            -type f \
            -name '*.aab' \
            | head -n 1)"

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
              -type f | sort
            exit 1
          fi

          echo "AAB successfully generated:"
          ls -lh "$AAB"

      # ============================================================
      # 19. UPLOAD APK AND AAB
      # ============================================================

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android
          path: |
            android-build/**/*.apk
            android-build/**/*.aab
          if-no-files-found: error

      # ============================================================
      # 20. COMPLETE
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " OBITREND ANDROID BUILD COMPLETE"
          echo "=========================================="
          echo ""

          echo "APK:"
          find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
            -type f -name '*.apk' -print

          echo ""

          echo "AAB:"
          find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
            -type f -name '*.aab' -print
