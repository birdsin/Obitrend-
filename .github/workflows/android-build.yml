name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build
      PACKAGE_ID: com.obitrend.aifashioncreator
      APP_NAME: OBITREND AI Fashion Creator
      KEYSTORE_FILE: ${{ github.workspace }}/android-build/android.keystore
      KEY_ALIAS: android

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # 3. ANDROID SDK
      # ==========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================================
      # 4. VERIFY TOOLS
      # ==========================================================

      - name: Verify Java and Android tools
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OBITREND ANDROID BUILD"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "Android SDK:"
          echo "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

      # ==========================================================
      # 5. INSTALL REQUIRED ANDROID PACKAGES
      # ==========================================================

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================================
      # 6. INSTALL BUBBLEWRAP
      # ==========================================================

      - name: Install Bubblewrap CLI
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @bubblewrap/cli

          bubblewrap --version

      # ==========================================================
      # 7. PREPARE ANDROID DIRECTORY
      # ==========================================================

      - name: Prepare Android project directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

      # ==========================================================
      # 8. DOWNLOAD WEB MANIFEST
      # ==========================================================

      - name: Download OBITREND web manifest
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 60 \
            "$MANIFEST_URL" \
            -o "$ANDROID_DIR/web-manifest.json"

          echo ""
          echo "Downloaded manifest:"
          cat "$ANDROID_DIR/web-manifest.json"

      # ==========================================================
      # 9. VALIDATE WEB MANIFEST
      # ==========================================================

      - name: Validate OBITREND web manifest
        shell: bash
        run: |
          set -euo pipefail

          jq empty "$ANDROID_DIR/web-manifest.json"

          NAME=$(jq -r '.name // .short_name // empty' \
            "$ANDROID_DIR/web-manifest.json")

          START_URL=$(jq -r '.start_url // "/"' \
            "$ANDROID_DIR/web-manifest.json")

          ICON_URL=$(jq -r '
            .icons
            | map(select(.src != null))
            | .[0].src // empty
          ' "$ANDROID_DIR/web-manifest.json")

          if [ -z "$NAME" ]; then
            echo "ERROR: Manifest has no name or short_name."
            exit 1
          fi

          if [ -z "$ICON_URL" ]; then
            echo "ERROR: Manifest has no usable icon."
            exit 1
          fi

          echo "Manifest name: $NAME"
          echo "Start URL: $START_URL"
          echo "Icon: $ICON_URL"

      # ==========================================================
      # 10. CREATE TWA MANIFEST
      #
      # IMPORTANT:
      # This directly creates the Bubblewrap configuration.
      # No Node.js heredoc is used.
      # ==========================================================

      - name: Create OBITREND twa-manifest.json
        shell: bash
        run: |
          set -euo pipefail

          WEB_MANIFEST="$ANDROID_DIR/web-manifest.json"
          TWA_MANIFEST="$ANDROID_DIR/twa-manifest.json"

          NAME=$(jq -r '.name // .short_name // "OBITREND AI Fashion Creator"' \
            "$WEB_MANIFEST")

          SHORT_NAME=$(jq -r '.short_name // .name // "OBITREND"' \
            "$WEB_MANIFEST")

          START_URL=$(jq -r '.start_url // "/"' \
            "$WEB_MANIFEST")

          SCOPE=$(jq -r '.scope // "/"' \
            "$WEB_MANIFEST")

          DISPLAY=$(jq -r '.display // "standalone"' \
            "$WEB_MANIFEST")

          ORIENTATION=$(jq -r '.orientation // "portrait"' \
            "$WEB_MANIFEST")

          THEME_COLOR=$(jq -r '.theme_color // "#05050c"' \
            "$WEB_MANIFEST")

          BACKGROUND_COLOR=$(jq -r '.background_color // "#05050c"' \
            "$WEB_MANIFEST")

          ICON_URL=$(jq -r '
            .icons
            | map(select(.src != null))
            | map(select(
                ((.sizes // "") | test("512|1024"))
                or
                ((.purpose // "") | contains("maskable"))
              ))
            | .[0].src
            // (
              .icons
              | map(select(.src != null))
              | .[0].src
            )
            // empty
          ' "$WEB_MANIFEST")

          if [[ "$ICON_URL" != http://* && "$ICON_URL" != https://* ]]; then
            ICON_URL="https://obitrend.vercel.app/${ICON_URL#/}"
          fi

          case "$ORIENTATION" in
            portrait|portrait-primary|portrait-secondary)
              ORIENTATION="portrait"
              ;;
            landscape|landscape-primary|landscape-secondary)
              ORIENTATION="landscape"
              ;;
            *)
              ORIENTATION="default"
              ;;
          esac

          case "$DISPLAY" in
            fullscreen|standalone|minimal-ui|browser)
              ;;
            *)
              DISPLAY="standalone"
              ;;
          esac

          jq -n \
            --arg packageId "$PACKAGE_ID" \
            --arg host "obitrend.vercel.app" \
            --arg name "$NAME" \
            --arg launcherName "$SHORT_NAME" \
            --arg display "$DISPLAY" \
            --arg themeColor "$THEME_COLOR" \
            --arg backgroundColor "$BACKGROUND_COLOR" \
            --arg startUrl "$START_URL" \
            --arg iconUrl "$ICON_URL" \
            --arg manifestUrl "$MANIFEST_URL" \
            --arg orientation "$ORIENTATION" \
            --arg scope "$SCOPE" \
            --arg keystore "$KEYSTORE_FILE" \
            --arg alias "$KEY_ALIAS" \
            '{
              packageId: $packageId,
              host: $host,
              name: $name,
              launcherName: $launcherName,
              display: $display,
              themeColor: $themeColor,
              themeColorDark: $themeColor,
              navigationColor: "#000000",
              navigationColorDark: "#000000",
              navigationDividerColor: "#000000",
              navigationDividerColorDark: "#000000",
              backgroundColor: $backgroundColor,
              enableNotifications: true,
              startUrl: $startUrl,
              iconUrl: $iconUrl,
              maskableIconUrl: $iconUrl,
              splashScreenFadeOutDuration: 300,
              signingKey: {
                path: $keystore,
                alias: $alias
              },
              appVersionName: "1.0.0",
              appVersionCode: 1,
              shortcuts: [],
              generatorApp: "bubblewrap-cli",
              webManifestUrl: $manifestUrl,
              fallbackType: "customtabs",
              features: {},
              alphaDependencies: {
                enabled: false
              },
              enableSiteSettingsShortcut: true,
              isChromeOSOnly: false,
              isMetaQuest: false,
              fullScopeUrl: ("https://obitrend.vercel.app" + $scope),
              minSdkVersion: 23,
              orientation: $orientation,
              fingerprints: [],
              additionalTrustedOrigins: [],
              retainedBundles: [],
              protocolHandlers: [],
              fileHandlers: [],
              launchHandlerClientMode: "",
              displayOverride: [$display],
              appVersion: "1.0.0"
            }' \
            > "$TWA_MANIFEST"

          echo ""
          echo "=========================================="
          echo "FINAL PACKAGE ID"
          echo "=========================================="

          jq -r '.packageId' "$TWA_MANIFEST"

          echo ""
          echo "Expected:"
          echo "com.obitrend.aifashioncreator"

          test \
            "$(jq -r '.packageId' "$TWA_MANIFEST")" \
            = "com.obitrend.aifashioncreator"

          echo ""
          echo "twa-manifest.json:"
          cat "$TWA_MANIFEST"

      # ==========================================================
      # 11. RESTORE RELEASE KEYSTORE
      #
      # Required GitHub secret:
      #
      # ANDROID_KEYSTORE_BASE64
      #
      # This MUST be the same signing key used for your release.
      # ==========================================================

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            echo ""
            echo "Add your existing Android release keystore"
            echo "as the GitHub Actions secret:"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          echo "Release keystore restored successfully."

      # ==========================================================
      # 12. VERIFY KEYSTORE
      # ==========================================================

      - name: Verify Android signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Signing key verified."

      # ==========================================================
      # 13. GENERATE ANDROID PROJECT
      #
      # Bubblewrap update reads twa-manifest.json and generates
      # the Android project.
      # ==========================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

      # ==========================================================
      # 14. VERIFY GENERATED PACKAGE ID
      # ==========================================================

      - name: Verify Android application ID
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching generated Android project..."

          grep -R \
            "com.obitrend.aifashioncreator" \
            "$ANDROID_DIR/app" \
            "$ANDROID_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.xml" \
            --include="*.java" \
            --include="*.kt" \
            2>/dev/null \
            | head -20 || true

          echo ""
          echo "Package ID from twa-manifest:"
          jq -r '.packageId' \
            "$ANDROID_DIR/twa-manifest.json"

          test \
            "$(jq -r '.packageId' "$ANDROID_DIR/twa-manifest.json")" \
            = "com.obitrend.aifashioncreator"

      # ==========================================================
      # 15. BUILD SIGNED APK + AAB
      # ==========================================================

      - name: Build Android APK and AAB
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          bubblewrap build \
            --manifest="$ANDROID_DIR/twa-manifest.json" \
            --signingKeyPath="$KEYSTORE_FILE" \
            --signingKeyAlias="$KEY_ALIAS"

      # ==========================================================
      # 16. LOCATE APK
      # ==========================================================

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK files..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "app-release-signed.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          cp "$APK" \
            "$ANDROID_DIR/OBITREND-release.apk"

          echo "APK:"
          ls -lh "$ANDROID_DIR/OBITREND-release.apk"

      # ==========================================================
      # 17. LOCATE AAB
      # ==========================================================

      - name: Locate release AAB
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for AAB files..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.aab" \
            -print

          AAB=$(find "$ANDROID_DIR" \
            -type f \
            -name "app-release-bundle.aab" \
            -print \
            | head -n 1)

          if [ -z "$AAB" ]; then
            AAB=$(find "$ANDROID_DIR" \
              -type f \
              -name "*.aab" \
              -print \
              | head -n 1)
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: No AAB was produced."
            exit 1
          fi

          cp "$AAB" \
            "$ANDROID_DIR/OBITREND-release.aab"

          echo "AAB:"
          ls -lh "$ANDROID_DIR/OBITREND-release.aab"

      # ==========================================================
      # 18. VERIFY APK
      # ==========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/OBITREND-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK verification completed."

      # ==========================================================
      # 19. VERIFY APK PACKAGE NAME
      # ==========================================================

      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/OBITREND-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep -q \
            "package: name='com.obitrend.aifashioncreator'"

          echo "APK package ID verified:"
          echo "com.obitrend.aifashioncreator"

      # ==========================================================
      # 20. VERIFY AAB
      # ==========================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/OBITREND-release.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            "$AAB"

          echo ""
          echo "AAB verification completed."

      # ==========================================================
      # 21. VERIFY AAB PACKAGE ID
      # ==========================================================

      - name: Verify AAB package ID
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/OBITREND-release.aab"

          unzip -p "$AAB" \
            "base/manifest/AndroidManifest.xml" \
            > /tmp/obitrend-manifest.bin 2>/dev/null || true

          echo ""
          echo "Expected package ID:"
          echo "com.obitrend.aifashioncreator"

          echo ""
          echo "AAB exists and is ready for Play Console validation."

      # ==========================================================
      # 22. APK SHA-256
      # ==========================================================

      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$ANDROID_DIR/OBITREND-release.apk" \
            | tee "$ANDROID_DIR/OBITREND-release.apk.sha256"

      # ==========================================================
      # 23. AAB SHA-256
      # ==========================================================

      - name: Generate AAB SHA-256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$ANDROID_DIR/OBITREND-release.aab" \
            | tee "$ANDROID_DIR/OBITREND-release.aab.sha256"

      # ==========================================================
      # 24. DISPLAY FINAL BUILD INFORMATION
      # ==========================================================

      - name: Final build verification
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "================================================"
          echo "          OBITREND BUILD COMPLETE"
          echo "================================================"

          echo ""
          echo "Application ID:"
          echo "com.obitrend.aifashioncreator"

          echo ""
          echo "APK:"
          ls -lh "$ANDROID_DIR/OBITREND-release.apk"

          echo ""
          echo "AAB:"
          ls -lh "$ANDROID_DIR/OBITREND-release.aab"

          echo ""
          echo "APK SHA-256:"
          cat "$ANDROID_DIR/OBITREND-release.apk.sha256"

          echo ""
          echo "AAB SHA-256:"
          cat "$ANDROID_DIR/OBITREND-release.aab.sha256"

          echo ""
          echo "================================================"

      # ==========================================================
      # 25. UPLOAD APK + AAB
      # ==========================================================

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            android-build/OBITREND-release.apk
            android-build/OBITREND-release.aab
            android-build/OBITREND-release.apk.sha256
            android-build/OBITREND-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
