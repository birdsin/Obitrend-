name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE.JS 22
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          APKSIGNER="$SDK_PATH/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not installed."
            echo "Expected:"
            echo "$APKSIGNER"
            exit 1
          fi

          echo "Android SDK ready."
          echo "SDK: $SDK_PATH"
          echo "APKSIGNER: $APKSIGNER"

      # =========================================================
      # 5. INSTALL BUBBLEWRAP
      # NON-INTERACTIVE
      # =========================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Bubblewrap..."

          npm install -g @bubblewrap/cli

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          if [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "ERROR: Java executable not found."
            exit 1
          fi

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "Java version:"
          java -version

          echo ""
          echo "Bubblewrap installed successfully."

      # =========================================================
      # 6. DOWNLOAD PERMANENT UPLOAD KEY
      # =========================================================

      - name: Download permanent OBITREND upload key
        uses: actions/download-artifact@v4
        with:
          name: OBITREND-PERMANENT-UPLOAD-KEY
          path: /tmp/obitrend-upload-key
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33476492079

      # =========================================================
      # 7. VERIFY PERMANENT UPLOAD KEY
      # =========================================================

      - name: Verify permanent upload key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          KEY_SOURCE="/tmp/obitrend-upload-key/upload-keystore.jks"

          if [ ! -f "$KEY_SOURCE" ]; then
            echo "ERROR: Permanent upload keystore was not found."
            echo ""
            echo "Files downloaded:"
            find /tmp/obitrend-upload-key -maxdepth 2 -type f -print
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          echo "Permanent upload keystore found."

          keytool \
            -list \
            -keystore "$KEY_SOURCE" \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Permanent upload keystore: VALID"
          echo "Alias: upload"

      # =========================================================
      # 8. PREPARE CLEAN ANDROID DIRECTORY
      # =========================================================

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          cp \
            "/tmp/obitrend-upload-key/upload-keystore.jks" \
            "$ANDROID_DIR/upload-keystore.jks"

          echo "Android directory:"
          echo "$ANDROID_DIR"

          echo ""
          echo "Permanent signing keystore copied."

          test \
            -f \
            "$ANDROID_DIR/upload-keystore.jks"

      # =========================================================
      # 9. FIX SIGNING PASSWORD FOR BUBBLEWRAP
      # SAME PERMANENT PRIVATE KEY
      # =========================================================

      - name: Prepare Bubblewrap signing keystore
        shell: bash
        env:
          ORIGINAL_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          ORIGINAL_KEYSTORE="$ANDROID_DIR/upload-keystore.jks"
          TEMP_KEYSTORE="$ANDROID_DIR/upload-keystore-ci.jks"

          if [ -z "$ORIGINAL_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          echo "Preparing CI signing keystore..."

          CI_PASSWORD="$(
            printf '%s' \
              'OBITREND_CI_UPLOAD_2026_9_3_'
            printf '%s' \
              'A7K4P9X2M6Q8'
          )"

          keytool \
            -importkeystore \
            -srckeystore "$ORIGINAL_KEYSTORE" \
            -srcstoretype JKS \
            -srcstorepass "$ORIGINAL_PASSWORD" \
            -srckeypass "$ORIGINAL_PASSWORD" \
            -destkeystore "$TEMP_KEYSTORE" \
            -deststoretype JKS \
            -deststorepass "$CI_PASSWORD" \
            -destkeypass "$CI_PASSWORD" \
            -srcalias upload \
            -destalias upload \
            -noprompt

          keytool \
            -list \
            -keystore "$TEMP_KEYSTORE" \
            -storetype JKS \
            -storepass "$CI_PASSWORD" \
            -alias upload \
            >/dev/null

          cp \
            "$TEMP_KEYSTORE" \
            "$ANDROID_DIR/upload-keystore.jks"

          echo "CI signing keystore prepared."
          echo "Alias: upload"

          echo "BUBBLEWRAP_CI_PASSWORD=$CI_PASSWORD" \
            >> "$GITHUB_ENV"

      # =========================================================
      # 10. DOWNLOAD AND VERIFY WEB MANIFEST
      # =========================================================

      - name: Verify Web Manifest
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";

          const manifest = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (!manifest.name) {
            throw new Error("Manifest name is missing.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest start_url is missing.");
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error("Manifest icons are missing.");
          }

          console.log("Manifest: VALID");
          console.log("Name:", manifest.name);
          console.log(
            "Short name:",
            manifest.short_name || "OBITREND"
          );
          console.log(
            "Start URL:",
            manifest.start_url
          );
          console.log(
            "Icons:",
            manifest.icons.length
          );
          NODE

      # =========================================================
      # 11. CREATE TWA MANIFEST
      # =========================================================

      - name: Create TWA manifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          node <<'NODE'
          const fs = require("fs");

          const source = JSON.parse(
            fs.readFileSync(
              "/tmp/manifest.webmanifest",
              "utf8"
            )
          );

          const manifestUrl =
            process.env.MANIFEST_URL;

          const baseUrl =
            new URL(manifestUrl);

          const startUrl =
            new URL(
              source.start_url || "/",
              manifestUrl
            );

          const scopeUrl =
            new URL(
              source.scope || "/",
              manifestUrl
            );

          if (
            !Array.isArray(source.icons) ||
            source.icons.length === 0
          ) {
            throw new Error("No icons found.");
          }

          const normalIcon =
            source.icons.find(
              icon =>
                icon &&
                icon.src &&
                String(
                  icon.purpose || "any"
                )
                  .split(/\s+/)
                  .includes("any")
            ) ||
            source.icons.find(
              icon =>
                icon &&
                icon.src
            );

          if (!normalIcon) {
            throw new Error(
              "No usable icon found."
            );
          }

          const maskableIcon =
            source.icons.find(
              icon =>
                icon &&
                icon.src &&
                String(
                  icon.purpose || ""
                )
                  .split(/\s+/)
                  .includes("maskable")
            );

          const twaManifest = {
            packageId:
              "com.obitrend.aifashioncreator",

            host:
              baseUrl.host,

            name:
              source.name ||
              "OBITREND AI Fashion Creator",

            launcherName:
              source.short_name ||
              "OBITREND",

            display:
              source.display ||
              "standalone",

            themeColor:
              source.theme_color ||
              "#111827",

            themeColorDark:
              source.theme_color ||
              "#111827",

            navigationColor:
              source.background_color ||
              "#111827",

            navigationColorDark:
              source.background_color ||
              "#111827",

            navigationDividerColor:
              "#00000000",

            navigationDividerColorDark:
              "#00000000",

            backgroundColor:
              source.background_color ||
              "#111827",

            enableNotifications:
              true,

            startUrl:
              startUrl.pathname +
              startUrl.search +
              startUrl.hash,

            iconUrl:
              new URL(
                normalIcon.src,
                manifestUrl
              ).href,

            splashScreenFadeOutDuration:
              300,

            signingKey: {
              path:
                "./upload-keystore.jks",

              alias:
                "upload"
            },

            appVersionCode:
              1,

            appVersion:
              "1",

            generatorApp:
              "bubblewrap-cli",

            webManifestUrl:
              manifestUrl,

            fallbackType:
              "customtabs",

            features: {},

            alphaDependencies: {
              enabled:
                false
            },

            enableSiteSettingsShortcut:
              false,

            isChromeOSOnly:
              false,

            isMetaQuest:
              false,

            fullScopeUrl:
              scopeUrl.href,

            minSdkVersion:
              23,

            shortcuts: [],

            fingerprints: [],

            additionalTrustedOrigins: [],

            retainedBundles: [],

            orientation:
              source.orientation ||
              "portrait"
          };

          if (maskableIcon) {
            twaManifest.maskableIconUrl =
              new URL(
                maskableIcon.src,
                manifestUrl
              ).href;
          }

          fs.writeFileSync(
            "twa-manifest.json",
            JSON.stringify(
              twaManifest,
              null,
              2
            ) + "\n"
          );

          console.log(
            "TWA manifest created successfully."
          );

          console.log(
            "Package ID:",
            twaManifest.packageId
          );

          console.log(
            "Signing alias:",
            twaManifest.signingKey.alias
          );
          NODE

          test \
            -f \
            "$ANDROID_DIR/twa-manifest.json"

      # =========================================================
      # 12. GENERATE ANDROID PROJECT
      # =========================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          npx \
            --yes \
            @bubblewrap/cli update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

          test \
            -f \
            "$ANDROID_DIR/gradlew"

          test \
            -f \
            "$ANDROID_DIR/app/build.gradle"

          chmod +x \
            "$ANDROID_DIR/gradlew"

          echo "Android project generated successfully."

      # =========================================================
      # 13. BUILD APK + AAB
      # =========================================================

      - name: Build Android APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          if [ -z "${BUBBLEWRAP_CI_PASSWORD:-}" ]; then
            echo "ERROR: Bubblewrap signing password is empty."
            exit 1
          fi

          export BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_CI_PASSWORD"
          export BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_CI_PASSWORD"

          echo "Checking permanent upload key..."

          keytool \
            -list \
            -keystore "./upload-keystore.jks" \
            -storetype JKS \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -alias upload \
            >/dev/null

          echo "Signing keystore: VALID"
          echo "Alias: upload"

          echo ""
          echo "Building the Android App..."

          npx \
            --yes \
            @bubblewrap/cli build \
            --skipPwaValidation \
            --signingKeyPath="./upload-keystore.jks" \
            --signingKeyAlias="upload"

          echo ""
          echo "Bubblewrap build completed."

      # =========================================================
      # 14. VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/app-release-signed.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          ls -lh "$APK"

      # =========================================================
      # 15. VERIFY AAB
      # =========================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/app-release-bundle.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Signed AAB was not created."
            exit 1
          fi

          echo "AAB:"
          echo "$AAB"

          ls -lh "$AAB"

      # =========================================================
      # 16. VERIFY APK SIGNATURE
      # =========================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/app-release-signed.apk"

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          APKSIGNER=""

          if [ -x "$SDK_PATH/build-tools/35.0.0/apksigner" ]; then
            APKSIGNER="$SDK_PATH/build-tools/35.0.0/apksigner"
          else
            APKSIGNER="$(
              find "$SDK_PATH/build-tools" \
                -type f \
                -name "apksigner" \
                -perm -111 \
                2>/dev/null |
              sort -V |
              tail -n 1
            )"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: Could not locate apksigner."
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$APK"

          echo "APK SIGNATURE: VALID"

      # =========================================================
      # 17. VERIFY AAB SIGNATURE
      # =========================================================

      - name: Verify AAB signature
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          if [ -z "${BUBBLEWRAP_CI_PASSWORD:-}" ]; then
            echo "ERROR: Bubblewrap signing password is empty."
            exit 1
          fi

          export BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_CI_PASSWORD"

          AAB="./app-release-bundle.aab"

          echo "Verifying AAB..."

          jarsigner \
            -verify \
            -verbose \
            -keystore "./upload-keystore.jks" \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            "$AAB"

          echo ""
          echo "AAB SIGNATURE: VALID"

          echo ""
          echo "Upload certificate used:"

          keytool \
            -list \
            -v \
            -keystore "./upload-keystore.jks" \
            -storetype JKS \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -alias upload \
            | grep -E \
              "Alias name:|Owner:|SHA1:|SHA256:" \
              || true

      # =========================================================
      # 18. UPLOAD APK + AAB
      # =========================================================

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Build
          path: |
            ${{ env.ANDROID_DIR }}/app-release-signed.apk
            ${{ env.ANDROID_DIR }}/app-release-bundle.aab
          if-no-files-found: error

      # =========================================================
      # 19. BUILD COMPLETE
      # =========================================================

      - name: Build complete
        run: |
          echo "=========================================="
          echo "OBITREND ANDROID BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Package ID:"
          echo "com.obitrend.aifashioncreator"
          echo ""
          echo "Signing alias:"
          echo "upload"
          echo ""
          echo "APK: app-release-signed.apk"
          echo "AAB: app-release-bundle.aab"
          echo ""
          echo "APK SIGNATURE: VALID"
          echo "AAB SIGNATURE: VALID"
          echo ""
          echo "PERMANENT UPLOAD KEY: USED"
          echo ""
          echo "BUILD COMPLETE"
          echo "=========================================="
