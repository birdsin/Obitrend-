name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      PACKAGE_ID: com.obitrend.aifashioncreator
      APP_NAME: OBITREND AI Fashion Creator

      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest

      ANDROID_DIR: ${{ github.workspace }}/android-build

      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      KEYSTORE_FILE: ${{ github.workspace }}/android-build/android.keystore
      KEY_ALIAS: android

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. JAVA 17
      # =====================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =====================================================
      # 3. ANDROID SDK
      # =====================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # =====================================================
      # 4. INSTALL ANDROID BUILD TOOLS
      # =====================================================

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =====================================================
      # 5. VERIFY JAVA + ANDROID
      # =====================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "JAVA_HOME=$JAVA_HOME"

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT"

          echo ""
          echo "========================================"
          echo "PACKAGE ID"
          echo "========================================"

          echo "$PACKAGE_ID"

      # =====================================================
      # 6. INSTALL BUBBLEWRAP
      # =====================================================

      - name: Install Bubblewrap CLI
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @bubblewrap/cli

          bubblewrap --version

      # =====================================================
      # 7. CONFIGURE BUBBLEWRAP
      # =====================================================

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      # =====================================================
      # 8. PREPARE ANDROID DIRECTORY
      # =====================================================

      - name: Prepare Android project directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

      # =====================================================
      # 9. DOWNLOAD MANIFEST
      # =====================================================

      - name: Download OBITREND web manifest
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 60 \
            "$MANIFEST_URL" \
            -o "$ANDROID_DIR/web-manifest.json"

          test -s "$ANDROID_DIR/web-manifest.json"

          echo "Manifest downloaded successfully."

      # =====================================================
      # 10. VALIDATE MANIFEST
      # =====================================================

      - name: Validate OBITREND web manifest
        shell: bash
        run: |
          set -euo pipefail

          jq empty "$ANDROID_DIR/web-manifest.json"

          echo "Manifest JSON is valid."

          jq -r '
            {
              name: (.name // .short_name),
              start_url: (.start_url // "/"),
              display: (.display // "standalone")
            }
          ' "$ANDROID_DIR/web-manifest.json"

      # =====================================================
      # 11. CREATE TWA MANIFEST
      # =====================================================

      - name: Create OBITREND twa-manifest.json
        shell: bash
        run: |
          set -euo pipefail

          WEB_MANIFEST="$ANDROID_DIR/web-manifest.json"
          TWA_MANIFEST="$ANDROID_DIR/twa-manifest.json"

          NAME=$(jq -r \
            '.name // .short_name // "OBITREND AI Fashion Creator"' \
            "$WEB_MANIFEST")

          SHORT_NAME=$(jq -r \
            '.short_name // .name // "OBITREND"' \
            "$WEB_MANIFEST")

          START_URL=$(jq -r \
            '.start_url // "/"' \
            "$WEB_MANIFEST")

          THEME_COLOR=$(jq -r \
            '.theme_color // "#05050c"' \
            "$WEB_MANIFEST")

          BACKGROUND_COLOR=$(jq -r \
            '.background_color // "#05050c"' \
            "$WEB_MANIFEST")

          ICON_URL=$(jq -r '
            .icons
            | map(select(.src != null))
            | .[0].src
            // empty
          ' "$WEB_MANIFEST")

          if [ -z "$ICON_URL" ]; then
            echo "ERROR: No icon found in web manifest."
            exit 1
          fi

          if [[ "$ICON_URL" != http://* && "$ICON_URL" != https://* ]]; then
            ICON_URL="https://obitrend.vercel.app/${ICON_URL#/}"
          fi

          jq -n \
            --arg packageId "$PACKAGE_ID" \
            --arg host "obitrend.vercel.app" \
            --arg name "$NAME" \
            --arg launcherName "$SHORT_NAME" \
            --arg themeColor "$THEME_COLOR" \
            --arg backgroundColor "$BACKGROUND_COLOR" \
            --arg startUrl "$START_URL" \
            --arg iconUrl "$ICON_URL" \
            '{
              packageId: $packageId,
              host: $host,
              name: $name,
              launcherName: $launcherName,
              startUrl: $startUrl,
              iconUrl: $iconUrl,
              maskableIconUrl: $iconUrl,
              themeColor: $themeColor,
              themeColorDark: $themeColor,
              navigationColor: "#000000",
              navigationColorDark: "#000000",
              navigationDividerColor: "#000000",
              navigationDividerColorDark: "#000000",
              backgroundColor: $backgroundColor,
              display: "standalone",
              enableNotifications: true,
              enableSiteSettingsShortcut: true,
              splashScreenFadeOutDuration: 300,
              appVersionName: "1.0.0",
              appVersionCode: 1,
              additionalTrustedOrigins: [],
              shortcuts: [],
              protocolHandlers: [],
              fileHandlers: [],
              retainedBundles: []
            }' > "$TWA_MANIFEST"

          echo ""
          echo "========================================"
          echo "FINAL PACKAGE ID CHECK"
          echo "========================================"

          ACTUAL_PACKAGE_ID=$(jq -r '.packageId' "$TWA_MANIFEST")

          echo "Actual:"
          echo "$ACTUAL_PACKAGE_ID"

          echo ""
          echo "Required:"
          echo "com.obitrend.aifashioncreator"

          if [ "$ACTUAL_PACKAGE_ID" != "com.obitrend.aifashioncreator" ]; then
            echo "ERROR: WRONG PACKAGE ID"
            exit 1
          fi

          echo ""
          echo "PACKAGE ID VERIFIED."

      # =====================================================
      # 12. CHECK REQUIRED SIGNING SECRETS
      # =====================================================

      - name: Check Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking required Android signing secrets..."

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo ""
            echo "ERROR: Missing GitHub Actions secret:"
            echo "ANDROID_KEYSTORE_BASE64"
            echo ""
            echo "Add this secret before running the workflow."
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEYSTORE_PASSWORD:-}" ]; then
            echo ""
            echo "ERROR: Missing GitHub Actions secret:"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD"
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEY_PASSWORD:-}" ]; then
            echo ""
            echo "ERROR: Missing GitHub Actions secret:"
            echo "BUBBLEWRAP_KEY_PASSWORD"
            exit 1
          fi

          echo ""
          echo "All Android signing secrets are present."

      # =====================================================
      # 13. RESTORE RELEASE KEYSTORE
      # =====================================================

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          echo "Android release keystore restored."

      # =====================================================
      # 14. VERIFY RELEASE KEY
      # =====================================================

      - name: Verify Android signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Signing key verified."

      # =====================================================
      # 15. GENERATE ANDROID PROJECT
      # =====================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$PATH:$(npm prefix -g)/bin"

          cd "$ANDROID_DIR"

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

      # =====================================================
      # 16. VERIFY GENERATED PACKAGE ID
      # =====================================================

      - name: Verify Android application ID
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching generated Android project..."

          if grep -R \
            "com.obitrend.aifashioncreator" \
            "$ANDROID_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.xml" \
            --include="*.java" \
            --include="*.kt" \
            2>/dev/null \
            | head -20; then

            echo ""
            echo "ANDROID APPLICATION ID VERIFIED."

          else

            echo ""
            echo "ERROR: PACKAGE ID NOT FOUND."
            exit 1

          fi

      # =====================================================
      # 17. BUILD APK + AAB
      # =====================================================

      - name: Build Android APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          export PATH="$PATH:$(npm prefix -g)/bin"

          cd "$ANDROID_DIR"

          bubblewrap build \
            --manifest="$ANDROID_DIR/twa-manifest.json" \
            --signingKeyPath="$KEYSTORE_FILE" \
            --signingKeyAlias="$KEY_ALIAS"

      # =====================================================
      # 18. LOCATE APK
      # =====================================================

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" \
            "$ANDROID_DIR/OBITREND-release.apk"

          test -s \
            "$ANDROID_DIR/OBITREND-release.apk"

          echo "APK located successfully."

      # =====================================================
      # 19. LOCATE AAB
      # =====================================================

      - name: Locate release AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.aab" \
            -print \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          cp "$AAB" \
            "$ANDROID_DIR/OBITREND-release.aab"

          test -s \
            "$ANDROID_DIR/OBITREND-release.aab"

          echo "AAB located successfully."

      # =====================================================
      # 20. VERIFY APK SIGNATURE
      # =====================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$ANDROID_DIR/OBITREND-release.apk"

          echo "APK signature verified."

      # =====================================================
      # 21. VERIFY APK PACKAGE ID
      # =====================================================

      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$ANDROID_DIR/OBITREND-release.apk" \
            | grep -q \
            "package: name='com.obitrend.aifashioncreator'"

          echo ""
          echo "APK PACKAGE ID VERIFIED:"
          echo "com.obitrend.aifashioncreator"

      # =====================================================
      # 22. VERIFY AAB
      # =====================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            "$ANDROID_DIR/OBITREND-release.aab"

          jarsigner \
            -verify \
            "$ANDROID_DIR/OBITREND-release.aab"

          echo "AAB verified."

      # =====================================================
      # 23. APK SHA-256
      # =====================================================

      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$ANDROID_DIR/OBITREND-release.apk" \
            > "$ANDROID_DIR/OBITREND-release.apk.sha256"

          cat "$ANDROID_DIR/OBITREND-release.apk.sha256"

      # =====================================================
      # 24. AAB SHA-256
      # =====================================================

      - name: Generate AAB SHA-256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$ANDROID_DIR/OBITREND-release.aab" \
            > "$ANDROID_DIR/OBITREND-release.aab.sha256"

          cat "$ANDROID_DIR/OBITREND-release.aab.sha256"

      # =====================================================
      # 25. FINAL VERIFICATION
      # =====================================================

      - name: Final build verification
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "       OBITREND BUILD COMPLETE"
          echo "=============================================="

          echo ""
          echo "Application ID:"
          echo "com.obitrend.aifashioncreator"

          echo ""
          echo "APK:"
          ls -lh \
            "$ANDROID_DIR/OBITREND-release.apk"

          echo ""
          echo "AAB:"
          ls -lh \
            "$ANDROID_DIR/OBITREND-release.aab"

          echo ""
          echo "=============================================="

      # =====================================================
      # 26. UPLOAD APK + AAB
      # =====================================================

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            android-build/OBITREND-release.apk
            android-build/OBITREND-release.aab
            android-build/OBITREND-release.apk.sha256
            android-build/OBITREND-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
