name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK is ready."

      - name: Install required tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y jq curl

          echo "Required tools installed."

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install -g @bubblewrap/cli@1.25.0 --ignore-scripts

          echo "Bubblewrap installed."

          which bubblewrap

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          test -f "$HOME/.bubblewrap/config.json"

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          java -version

          test -d "$JAVA_HOME"
          test -d "$ANDROID_SDK_ROOT"
          test -f "$HOME/.bubblewrap/config.json"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Check signing secrets
        shell: bash
        run: |
          set -e

          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets found."

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-build"

          mkdir -p "$GITHUB_WORKSPACE/android-build"

          echo "Android build directory:"
          ls -ld "$GITHUB_WORKSPACE/android-build"

      - name: Download OBITREND manifest
        shell: bash
        run: |
          set -e

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 60 \
            -A "Mozilla/5.0" \
            "https://obitrend.vercel.app/manifest.webmanifest" \
            -o "$GITHUB_WORKSPACE/android-build/source-manifest.webmanifest"

          test -s "$GITHUB_WORKSPACE/android-build/source-manifest.webmanifest"

          echo "Manifest downloaded."

      - name: Validate OBITREND manifest
        shell: bash
        run: |
          set -e

          jq empty \
            "$GITHUB_WORKSPACE/android-build/source-manifest.webmanifest"

          echo "Manifest JSON is valid."

      - name: Create clean manifest
        shell: bash
        run: |
          set -e

          jq '
            .name = "OBITREND AI Fashion Creator"
            |
            .short_name = "OBITREND"
            |
            .description = "AI-powered fashion creation studio."
            |
            .id = "/"
            |
            .start_url = "/"
            |
            .scope = "/"
            |
            .display = "standalone"
            |
            .orientation = "portrait"
            |
            .theme_color = "#050505"
            |
            .background_color = "#020204"
          ' \
          "$GITHUB_WORKSPACE/android-build/source-manifest.webmanifest" \
          > "$GITHUB_WORKSPACE/android-build/manifest.webmanifest"

          jq empty \
            "$GITHUB_WORKSPACE/android-build/manifest.webmanifest"

          echo "Clean manifest created."

      - name: Create Bubblewrap Android project
        working-directory: android-build
        shell: bash
        timeout-minutes: 20
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo "Directory contents:"
          ls -la

          echo "Starting Bubblewrap initialization."

          printf '%s\n' \
            "n" \
            "$JAVA_HOME" \
            "n" \
            "$ANDROID_SDK_ROOT" \
            "OBITREND AI Fashion Creator" \
            "OBITREND" \
            "com.obitrend.app" \
            "1" \
            "1" \
            "#050505" \
            "portrait" \
            "#020204" \
            "https://obitrend.vercel.app/icons/icon-192.png" \
            "" \
            "" \
            "obitrend-keystore.jks" \
            "obitrend" \
            "OBITREND" \
            "OBITREND" \
            "OBITREND" \
            "NG" \
            "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            "$BUBBLEWRAP_KEY_PASSWORD" \
            "y" \
          | bubblewrap init \
              --manifest="https://obitrend.vercel.app/manifest.webmanifest"

          echo "Bubblewrap initialization finished."

          test -f "twa-manifest.json"

          echo "twa-manifest.json created."

      - name: Verify generated project
        working-directory: android-build
        shell: bash
        run: |
          set -e

          test -f "twa-manifest.json"

          echo "Generated Bubblewrap project:"
          find . -maxdepth 3 -type f | sort

      - name: Build Android APK and AAB
        working-directory: android-build
        shell: bash
        timeout-minutes: 30
        run: |
          set -e

          echo "Building OBITREND Android application."

          bubblewrap build \
            --manifest="twa-manifest.json"

          echo "Android build finished."

      - name: Verify APK and AAB
        working-directory: android-build
        shell: bash
        run: |
          set -e

          echo "Generated Android files:"

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK_FILE="$(find . -type f -name "*signed*.apk" | head -n 1)"
          AAB_FILE="$(find . -type f -name "*.aab" | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Signed APK was not generated."
            exit 1
          fi

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "AAB found:"
          echo "$AAB_FILE"

          ls -lh "$APK_FILE"
          ls -lh "$AAB_FILE"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-APK-and-AAB
          path: |
            android-build/**/*.apk
            android-build/**/*.aab
          if-no-files-found: error

      - name: Build complete
        shell: bash
        run: |
          echo "======================================"
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "======================================"
