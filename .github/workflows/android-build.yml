name: Build OBITREND Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Bubblewrap Android SDK
        shell: bash
        run: |
          set -e

          RUNNER_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUBBLEWRAP_SDK="$HOME/bubblewrap-android-sdk"

          echo "Runner Android SDK:"
          echo "$RUNNER_SDK"

          echo "Bubblewrap Android SDK:"
          echo "$BUBBLEWRAP_SDK"

          rm -rf "$BUBBLEWRAP_SDK"
          mkdir -p "$BUBBLEWRAP_SDK"

          CMDLINE_TOOLS=""

          if [ -x "$RUNNER_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_TOOLS="$RUNNER_SDK/cmdline-tools/latest"
          else
            CMDLINE_TOOLS="$(find "$RUNNER_SDK/cmdline-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name "*" \
              | sort \
              | head -n 1)"
          fi

          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "ERROR: Android command-line tools were not found."
            exit 1
          fi

          echo "Using command-line tools:"
          echo "$CMDLINE_TOOLS"

          cp -a "$CMDLINE_TOOLS/." "$BUBBLEWRAP_SDK/"

          test -f "$BUBBLEWRAP_SDK/bin/sdkmanager"

          chmod +x "$BUBBLEWRAP_SDK/bin/sdkmanager"

          echo "ANDROID_HOME=$BUBBLEWRAP_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BUBBLEWRAP_SDK" >> "$GITHUB_ENV"

          echo "Bubblewrap-compatible SDK created."

          echo "SDK contents:"
          ls -la "$BUBBLEWRAP_SDK"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          yes | "$SDK/bin/sdkmanager" \
            --sdk_root="$SDK" \
            --licenses >/dev/null 2>&1 || true

          "$SDK/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0"

          echo "Android SDK packages installed."

          test -d "$SDK/build-tools/34.0.0"
          test -d "$SDK/platform-tools"
          test -d "$SDK/platforms/android-35"

      - name: Install Bubblewrap and Expect
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y expect

          npm install -g @bubblewrap/cli \
            --ignore-scripts \
            --no-audit \
            --no-fund

          bubblewrap --version

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/bin"
          test -f "$ANDROID_HOME/bin/sdkmanager"

      - name: Verify Bubblewrap
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "Bubblewrap:"
          bubblewrap --version

          echo ""
          echo "Bubblewrap doctor:"
          bubblewrap doctor

      - name: Create Android project
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          rm -rf android-build
          mkdir -p android-build

          cat > /tmp/bubblewrap-init.exp <<'EOF'
          #!/usr/bin/expect -f

          set timeout 900

          spawn bubblewrap init \
            --manifest=https://obitrend.vercel.app/manifest.webmanifest \
            --directory=android-build

          expect {

            "*Do you want Bubblewrap to install the JDK*" {
              send -- "n\r"
              exp_continue
            }

            "*Path to your existing JDK*" {
              send -- "$env(JAVA_HOME)\r"
              exp_continue
            }

            "*Do you want Bubblewrap to install the Android SDK*" {
              send -- "n\r"
              exp_continue
            }

            "*Path to your existing Android SDK*" {
              send -- "$env(ANDROID_HOME)\r"
              exp_continue
            }

            "*Host*" {
              send -- "\r"
              exp_continue
            }

            "*Start URL*" {
              send -- "\r"
              exp_continue
            }

            "*Name*" {
              send -- "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            "*Launcher Name*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Package ID*" {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            "*Version Code*" {
              send -- "1\r"
              exp_continue
            }

            "*Display Mode*" {
              send -- "\r"
              exp_continue
            }

            "*Orientation*" {
              send -- "\r"
              exp_continue
            }

            "*Theme Color*" {
              send -- "\r"
              exp_continue
            }

            "*Background Color*" {
              send -- "\r"
              exp_continue
            }

            "*Icon URL*" {
              send -- "\r"
              exp_continue
            }

            "*Maskable Icon URL*" {
              send -- "\r"
              exp_continue
            }

            "*Monochrome Icon URL*" {
              send -- "\r"
              exp_continue
            }

            "*Shortcuts*" {
              send -- "\r"
              exp_continue
            }

            "*Play Billing*" {
              send -- "\r"
              exp_continue
            }

            "*Location Delegation*" {
              send -- "\r"
              exp_continue
            }

            "*Key Path*" {
              send -- "android.keystore\r"
              exp_continue
            }

            "*Key Alias*" {
              send -- "obitrend\r"
              exp_continue
            }

            "*Create a signing key*" {
              send -- "y\r"
              exp_continue
            }

            "*Full Name*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Organizational Unit*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Organization*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Country*" {
              send -- "NG\r"
              exp_continue
            }

            "*Keystore Password*" {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            "*Key Password*" {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            eof {
              exit 0
            }

            timeout {
              puts "ERROR: Bubblewrap initialization timed out."
              exit 1
            }
          }
          EOF

          chmod +x /tmp/bubblewrap-init.exp

          /tmp/bubblewrap-init.exp

      - name: Build Android app
        working-directory: android-build
        shell: bash
        run: |
          set -e

          bubblewrap build

      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: obitrend-android-build
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab
          if-no-files-found: error

      - name: Build complete
        run: |
          echo "OBITREND Android APK and AAB build completed successfully."
