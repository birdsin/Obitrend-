name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK ready."

      - name: Check signing secrets
        shell: bash
        run: |
          set -e

          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets are available."

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install -g @bubblewrap/cli@1.25.0

          echo "Bubblewrap installed."

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_SDK_ROOT"

          echo "Bubblewrap configuration OK."

      - name: Verify Java and Bubblewrap
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo
          echo "Bubblewrap:"
          bubblewrap --version

      - name: Install Expect
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y expect

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -e

          rm -rf android-build
          mkdir -p android-build

          test -d android-build

          echo "Android build directory created:"
          pwd
          ls -ld android-build

      - name: Generate Android project
        shell: bash
        working-directory: android-build
        timeout-minutes: 20
        run: |
          set -e

          cat > /tmp/obitrend-init.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 1200

          spawn bubblewrap init --manifest="https://obitrend.vercel.app/manifest.webmanifest"

          expect {
            -nocase -re {application name.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {short name.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {package id.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {application id.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {domain.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {url path.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {version code.*} {
              send -- "1\r"
              exp_continue
            }

            -nocase -re {version name.*} {
              send -- "1.0.0\r"
              exp_continue
            }

            -nocase -re {display mode.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {orientation.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {theme color.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {background color.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {navigation color.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {icon.*url.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {maskable.*url.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {country.*} {
              send -- "NG\r"
              exp_continue
            }

            -nocase -re {key store location.*} {
              send -- "android.keystore\r"
              exp_continue
            }

            -nocase -re {keystore location.*} {
              send -- "android.keystore\r"
              exp_continue
            }

            -nocase -re {key store alias.*} {
              send -- "android\r"
              exp_continue
            }

            -nocase -re {keystore alias.*} {
              send -- "android\r"
              exp_continue
            }

            -nocase -re {key alias.*} {
              send -- "android\r"
              exp_continue
            }

            -nocase -re {first and last names.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {first.*last.*names.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {organizational unit.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {organization.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {password for the key store.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {password for the keystore.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {password for the key.*} {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {do you want to create one now.*} {
              send -- "y\r"
              exp_continue
            }

            -nocase -re {do you want to.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {\(Y/n\).*} {
              send -- "y\r"
              exp_continue
            }

            -nocase -re {\(y/N\).*} {
              send -- "y\r"
              exp_continue
            }

            eof {
              catch wait result
              set code [lindex $result 3]
              exit $code
            }

            timeout {
              puts stderr "ERROR: Bubblewrap initialization timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-init.exp

          /tmp/obitrend-init.exp

          echo
          echo "Bubblewrap initialization finished."

          test -f twa-manifest.json

          echo "twa-manifest.json created."

      - name: Verify Android project
        shell: bash
        working-directory: android-build
        run: |
          set -e

          echo "Checking generated files..."

          test -f twa-manifest.json
          test -f android.keystore

          echo
          echo "Generated project:"
          find . -maxdepth 2 -type f | sort

          echo
          echo "Android project is ready."

      - name: Build APK and AAB
        shell: bash
        working-directory: android-build
        timeout-minutes: 30
        run: |
          set -e

          echo "Starting Bubblewrap build..."

          bubblewrap build \
            --manifest="$PWD/twa-manifest.json" \
            --signingKeyPath="$PWD/android.keystore" \
            --signingKeyAlias="android"

          echo
          echo "Bubblewrap build finished."

      - name: Verify APK and AAB
        shell: bash
        working-directory: android-build
        run: |
          set -e

          echo "Checking APK..."

          if [ ! -f "app-release-signed.apk" ]; then
            echo "ERROR: app-release-signed.apk was not created."
            find . -type f | sort
            exit 1
          fi

          echo "Checking AAB..."

          if [ ! -f "app-release-bundle.aab" ]; then
            echo "ERROR: app-release-bundle.aab was not created."
            find . -type f | sort
            exit 1
          fi

          echo
          echo "=========================================="
          echo "OBITREND BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh app-release-signed.apk
          ls -lh app-release-bundle.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-APK-and-AAB
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab
          if-no-files-found: error

      - name: Build complete
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "=========================================="
          echo "APK: app-release-signed.apk"
          echo "AAB: app-release-bundle.aab"
          echo "=========================================="
