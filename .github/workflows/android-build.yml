name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. SET UP NODE
      # ---------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

                        # ---------------------------------------------------------
      # 3. SET UP ANDROID SDK + INSTALL BUBBLEWRAP
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Android SDK setup"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: ANDROID_HOME / ANDROID_SDK_ROOT is not set."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: Android SDK directory does not exist."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          sdkmanager --update || true

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed

          echo "Checking build-tools directory..."

          if [ ! -d "$SDK_PATH/build-tools" ]; then
            echo "ERROR: Android build-tools directory was not created."
            exit 1
          fi

          echo "Android SDK is ready."

      - name: Install and Configure Bubblewrap
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Installing Bubblewrap"
          echo "=========================================="

          npm install -g @bubblewrap/cli

                    echo "Java version:"

          echo "Java version:"
          java -version

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path is not available."
            exit 1
          fi

          if [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME does not exist."
            exit 1
          fi

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: Android SDK does not exist."
            exit 1
          fi

          if [ ! -d "$SDK_PATH/build-tools" ]; then
            echo "ERROR: Android SDK build-tools are missing."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          echo "Build-tools:"
          ls -la "$SDK_PATH/build-tools"

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          echo "Running Bubblewrap doctor..."

          bubblewrap doctor

          echo "=========================================="
          echo " Bubblewrap environment is READY"
          echo "=========================================="

      # ---------------------------------------------------------
      # 4. VERIFY WEB MANIFEST
      # ---------------------------------------------------------
      - name: Verify Web Manifest
        shell: bash
        run: |
          set -e

          echo "Checking:"
          echo "$MANIFEST_URL"

          HTTP_STATUS=$(curl -L -s -o /tmp/manifest.webmanifest \
            -w "%{http_code}" \
            "$MANIFEST_URL")

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Web Manifest could not be downloaded."
            cat /tmp/manifest.webmanifest || true
            exit 1
          fi

          echo "Manifest downloaded successfully."

          echo "----- MANIFEST -----"
          cat /tmp/manifest.webmanifest
          echo "--------------------"

      # ---------------------------------------------------------
      # 5. CREATE CLEAN ANDROID DIRECTORY
      # ---------------------------------------------------------
      - name: Prepare Android build directory
        shell: bash
        run: |
          set -e

          rm -rf "$ANDROID_DIR"
          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

          test -d "$ANDROID_DIR"

            # ---------------------------------------------------------
      # 6. INITIALIZE BUBBLEWRAP
      #    Bubblewrap init is interactive, so GitHub Actions
      #    must answer its prompts automatically.
      # ---------------------------------------------------------
      - name: Create Bubblewrap Android project
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " Creating Bubblewrap Android project"
          echo "=========================================="

          echo "Manifest:"
          echo "$MANIFEST_URL"

          echo "Output directory:"
          echo "$ANDROID_DIR"

          cd "$ANDROID_DIR"

          # Install Expect so we can answer Bubblewrap's
          # interactive init questions automatically.
          sudo apt-get update -y
          sudo apt-get install -y expect

          # Make sure signing passwords exist.
          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is missing."
            exit 1
          fi

          cat > /tmp/bubblewrap-init.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 600

          set manifest $env(MANIFEST_URL)
          set directory $env(ANDROID_DIR)

          set keystore_password $env(BUBBLEWRAP_KEYSTORE_PASSWORD)
          set key_password $env(BUBBLEWRAP_KEY_PASSWORD)

          spawn npx @bubblewrap/cli init \
            --manifest="$manifest" \
            --directory="$directory"

          # Domain
          expect {
            -re {Domain:.*} {
              send "\r"
              exp_continue
            }
          }

          # URL path
          expect {
            -re {URL path:.*} {
              send "\r"
              exp_continue
            }
          }

          # Application name
          expect {
            -re {Application name:.*} {
              send "\r"
              exp_continue
            }
          }

          # Package ID
          expect {
            -re {Package ID:.*} {
              send "\r"
              exp_continue
            }
          }

          # Version code
          expect {
            -re {Version code:.*} {
              send "\r"
              exp_continue
            }
          }

          # Version name
          expect {
            -re {Version name:.*} {
              send "\r"
              exp_continue
            }
          }

          # Display mode
          expect {
            -re {Display mode:.*} {
              send "\r"
              exp_continue
            }
          }

          # Orientation
          expect {
            -re {Orientation:.*} {
              send "\r"
              exp_continue
            }
          }

          # Theme color
          expect {
            -re {Theme color:.*} {
              send "\r"
              exp_continue
            }
          }

          # Background color
          expect {
            -re {Background color:.*} {
              send "\r"
              exp_continue
            }
          }

          # Icon URL
          expect {
            -re {URL to an image.*512x512.*} {
              send "\r"
              exp_continue
            }
          }

          # Maskable icon
          expect {
            -re {maskable.*image.*} {
              send "\r"
              exp_continue
            }
          }

          # Monochrome icon
          expect {
            -re {monochrome.*image.*} {
              send "\r"
              exp_continue
            }
          }

          # Optional shortcuts
          expect {
            -re {shortcuts.*} {
              send "n\r"
              exp_continue
            }
          }

          # Play Billing
          expect {
            -re {Play Billing.*} {
              send "n\r"
              exp_continue
            }
          }

          # Location delegation
          expect {
            -re {Location delegation.*} {
              send "n\r"
              exp_continue
            }
          }

          # Key full name
          expect {
            -re {Full name.*} {
              send "OBITREND\r"
              exp_continue
            }
          }

          # Organizational unit
          expect {
            -re {Organizational unit.*} {
              send "OBITREND\r"
              exp_continue
            }
          }

          # Organization
          expect {
            -re {Organization.*} {
              send "OBITREND\r"
              exp_continue
            }
          }

          # Country
          expect {
            -re {Country.*} {
              send "NG\r"
              exp_continue
            }
          }

          # Keystore password
          expect {
            -re {Keystore password.*} {
              send "$keystore_password\r"
              exp_continue
            }
          }

          # Key password
          expect {
            -re {Key password.*} {
              send "$key_password\r"
              exp_continue
            }
          }

          expect eof
          EXPECT

          chmod +x /tmp/bubblewrap-init.exp

          export MANIFEST_URL
          export ANDROID_DIR

          /tmp/bubblewrap-init.exp

          echo "=========================================="
          echo " Bubblewrap project initialization finished"
          echo "=========================================="

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json was not generated."
            exit 1
          fi

          echo "twa-manifest.json successfully created."

      # ---------------------------------------------------------
      # 7. VERIFY GENERATED ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Verify generated Android project
        shell: bash
        run: |
          set -e

          echo "Generated files:"
          find "$ANDROID_DIR" -maxdepth 2 -type f | sort | head -100

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json was not generated."
            exit 1
          fi

          echo "twa-manifest.json found."

      # ---------------------------------------------------------
      # 8. BUILD APK + AAB
      # ---------------------------------------------------------
      - name: Build Android APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          npx @bubblewrap/cli build \
            --skipPwaValidation

      # ---------------------------------------------------------
      # 9. VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # ---------------------------------------------------------
      # 10. VERIFY AAB
      # ---------------------------------------------------------
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB=$(find "$ANDROID_DIR" -type f -name "*.aab" | head -1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

      # ---------------------------------------------------------
      # 11. UPLOAD APK + AAB
      # ---------------------------------------------------------
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Build
          path: |
            ${{ env.ANDROID_DIR }}/**/*.apk
            ${{ env.ANDROID_DIR }}/**/*.aab
          if-no-files-found: error

      # ---------------------------------------------------------
      # 12. BUILD COMPLETE
      # ---------------------------------------------------------
      - name: Build complete
        run: |
          echo "=========================================="
          echo "       OBITREND ANDROID BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK:"
          find "$ANDROID_DIR" -type f -name "*.apk" || true
          echo ""
          echo "AAB:"
          find "$ANDROID_DIR" -type f -name "*.aab" || true
