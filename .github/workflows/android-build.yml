name: Build OBITREND Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap and Expect
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get update
          sudo apt-get install -y expect

      - name: Create Android project
        working-directory: .
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -rf android-build
          mkdir -p android-build

          cat > /tmp/bubblewrap-init.exp <<'EOF'
          #!/usr/bin/expect -f

          set timeout 300

          set ks $env(BUBBLEWRAP_KEYSTORE_PASSWORD)
          set kp $env(BUBBLEWRAP_KEY_PASSWORD)

          spawn bubblewrap init \
            --manifest=https://obitrend.vercel.app/manifest.webmanifest \
            --directory=android-build

                      expect {
    "*Do you want Bubblewrap to install the JDK*" {
        send -- "n\r"
        exp_continue
    }
    "*Path to your existing JDK 17:*" {
        send -- "$env(JAVA_HOME)\r"
        exp_continue
    }
    "*Host*" {
        send -- "\r"
        exp_continue
    }
    "*Start URL*" {
        send -- "\r"
        exp_continue
    }
            "*Name*" {
              send -- "OBITREND AI Fashion Creator\r"
              exp_continue
            }
            "*Launcher Name*" {
              send -- "OBITREND\r"
              exp_continue
            }
            "*Package ID*" {
              send -- "com.obitrend.app\r"
              exp_continue
            }
            "*Version Code*" {
              send -- "1\r"
              exp_continue
            }
            "*Display Mode*" {
              send -- "\r"
              exp_continue
            }
            "*Orientation*" {
              send -- "\r"
              exp_continue
            }
            "*Theme Color*" {
              send -- "\r"
              exp_continue
            }
            "*Background Color*" {
              send -- "\r"
              exp_continue
            }
            "*Icon URL*" {
              send -- "\r"
              exp_continue
            }
            "*Maskable Icon URL*" {
              send -- "\r"
              exp_continue
            }
            "*Monochrome Icon URL*" {
              send -- "\r"
              exp_continue
            }
            "*shortcuts*" {
              send -- "\r"
              exp_continue
            }
            "*Play Billing*" {
              send -- "n\r"
              exp_continue
            }
            "*Location Delegation*" {
              send -- "n\r"
              exp_continue
            }
            "*Key Path*" {
              send -- "android.keystore\r"
              exp_continue
            }
            "*Key Alias*" {
              send -- "obitrend\r"
              exp_continue
            }
            "*Create a signing key*" {
              send -- "\r"
              exp_continue
            }
            "*Full Name*" {
              send -- "OBITREND\r"
              exp_continue
            }
            "*Organizational Unit*" {
              send -- "OBITREND\r"
              exp_continue
            }
            "*Organization*" {
              send -- "OBITREND\r"
              exp_continue
            }
            "*Country*" {
              send -- "NG\r"
              exp_continue
            }
            "*Keystore Password*" {
              send -- "$ks\r"
              exp_continue
            }
            "*Key Password*" {
              send -- "$kp\r"
              exp_continue
            }
            eof {
              exit 0
            }
            timeout {
              puts "Bubblewrap init timed out."
              exit 1
            }
          }
          EOF

          chmod +x /tmp/bubblewrap-init.exp
          /tmp/bubblewrap-init.exp

      - name: Build Android app
        working-directory: android-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: obitrend-android-build
          path: |
            android-build/*.apk
            android-build/*.aab
