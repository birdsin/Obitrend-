name: Build OBITREND Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap --version

      - name: Configure Bubblewrap
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "SDK_PATH=$SDK_PATH"

          test -d "$JAVA_HOME"
          test -d "$SDK_PATH"

          mkdir -p "$HOME/.bubblewrap"

          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$SDK_PATH"

          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Verify Bubblewrap
        run: |
          bubblewrap doctor

      - name: Create Android project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          rm -rf android-build
          mkdir -p android-build

          bubblewrap init \
            --manifest="https://obitrend.vercel.app/manifest.webmanifest" \
            --directory="android-build" <<EOF
          n
          y
          n
          y
          OBITREND AI Fashion Creator
          OBITREND
          com.obitrend.app
          1
          standalone
          portrait
          #000000
          #000000
          
          
          
          
          android.keystore
          obitrend
          y
          OBITREND
          OBITREND
          OBITREND
          NG
          $BUBBLEWRAP_KEYSTORE_PASSWORD
          $BUBBLEWRAP_KEY_PASSWORD
          EOF

      - name: Build Android app
        working-directory: android-build
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: obitrend-android-build
          path: |
            android-build/*.apk
            android-build/*.aab

      - name: Build complete
        if: always()
        run: |
          echo "OBITREND Android build workflow completed."
