name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.25.0

      - name: Prepare Android SDK
        run: |
          mkdir -p "$HOME/android-sdk"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Android project
        run: |
          rm -rf android-build
          mkdir -p android-build

      - name: Create TWA manifest
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |

          cat > android-build/twa-manifest.json <<'EOF'
          {
            "packageId": "com.obitrend.app",
            "host": "obitrend.vercel.app",
            "name": "OBITREND AI Fashion Creator",
            "launcherName": "OBITREND",
            "display": "standalone",
            "displayOverride": [],
            "themeColor": "#050505",
            "themeColorDark": "#050505",
            "navigationColor": "#050505",
            "navigationColorDark": "#050505",
            "navigationDividerColor": "#00000000",
            "navigationDividerColorDark": "#00000000",
            "backgroundColor": "#020204",
            "enableNotifications": true,
            "startUrl": "/?source=pwa",
            "iconUrl": "https://obitrend.vercel.app/icons/icon-512.png",
            "maskableIconUrl": "https://obitrend.vercel.app/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "obitrend"
            },
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://obitrend.vercel.app/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://obitrend.vercel.app/",
            "minSdkVersion": 23,
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "orientation": "portrait"
          }
          EOF

      - name: Create signing key
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |

          if [ -z "$KS_PASS" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASS" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is missing."
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore android-build/android.keystore \
            -storetype PKCS12 \
            -alias obitrend \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

      - name: Configure Bubblewrap
        run: |
          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME"

      - name: Generate Android project
        run: |
          cd android-build

          bubblewrap update \
            --manifest="./twa-manifest.json" \
            --skipVersionUpgrade

      - name: Verify Android project
        run: |

          test -f android-build/twa-manifest.json
          test -f android-build/android.keystore
          test -f android-build/gradlew

          echo "Android project successfully generated."

      - name: Build Android APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |

          cd android-build

          bubblewrap build \
            --manifest="./twa-manifest.json"

      - name: Verify APK and AAB
        run: |

          echo "Checking Android release files..."

          test -f android-build/app-release-signed.apk
          test -f android-build/app-release-bundle.aab

          echo ""
          echo "=========================================="
          echo "       OBITREND BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""

          ls -lh \
            android-build/app-release-signed.apk \
            android-build/app-release-bundle.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab
          if-no-files-found: error

      - name: Build complete
        run: |
          echo "OBITREND Android APK and AAB are ready."
