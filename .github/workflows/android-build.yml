name: Build OBITREND Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Install Expect
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      - name: Pull Bubblewrap
        run: |
          docker pull ghcr.io/googlechromelabs/bubblewrap:1.25.0

      - name: Prepare Android directory
        run: |
          rm -rf android-build
          mkdir -p android-build

      - name: Create Android project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |

          cat > /tmp/bubblewrap-init.exp <<'EOF'
          #!/usr/bin/expect -f

          set timeout 900

          set ks $env(BUBBLEWRAP_KEYSTORE_PASSWORD)
          set kp $env(BUBBLEWRAP_KEY_PASSWORD)

          spawn docker run --rm \
            -i \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="$ks" \
            -e BUBBLEWRAP_KEY_PASSWORD="$kp" \
            -v "$env(PWD):/work" \
            -w /work \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            init \
            --manifest=https://obitrend.vercel.app/manifest.webmanifest \
            --directory=/work/android-build

          expect {

            "*Do you want Bubblewrap to install the JDK*" {
              send -- "n\r"
              exp_continue
            }

            "*Path to your existing JDK*" {
              send -- "\r"
              exp_continue
            }

            "*Do you want Bubblewrap to install the Android SDK*" {
              send -- "n\r"
              exp_continue
            }

            "*Path to your existing Android SDK*" {
              send -- "\r"
              exp_continue
            }

            "*Domain*" {
              send -- "obitrend.vercel.app\r"
              exp_continue
            }

            "*URL path*" {
              send -- "/\r"
              exp_continue
            }

            "*Host*" {
              send -- "obitrend.vercel.app\r"
              exp_continue
            }

            "*Start URL*" {
              send -- "/\r"
              exp_continue
            }

            "*Name*" {
              send -- "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            "*Launcher Name*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Package ID*" {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            "*Version Code*" {
              send -- "1\r"
              exp_continue
            }

            "*Display Mode*" {
              send -- "\r"
              exp_continue
            }

            "*Orientation*" {
              send -- "\r"
              exp_continue
            }

            "*Theme Color*" {
              send -- "\r"
              exp_continue
            }

            "*Background Color*" {
              send -- "\r"
              exp_continue
            }

            "*Icon URL*" {
              send -- "\r"
              exp_continue
            }

            "*Maskable Icon URL*" {
              send -- "\r"
              exp_continue
            }

            "*Monochrome Icon URL*" {
              send -- "\r"
              exp_continue
            }

            "*Shortcuts*" {
              send -- "\r"
              exp_continue
            }

            "*Play Billing*" {
              send -- "\r"
              exp_continue
            }

            "*Location Delegation*" {
              send -- "\r"
              exp_continue
            }

            "*Key Path*" {
              send -- "android.keystore\r"
              exp_continue
            }

            "*Key Alias*" {
              send -- "obitrend\r"
              exp_continue
            }

            "*Create a signing key*" {
              send -- "y\r"
              exp_continue
            }

            "*Full Name*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Organizational Unit*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Organization*" {
              send -- "OBITREND\r"
              exp_continue
            }

            "*Country*" {
              send -- "NG\r"
              exp_continue
            }

            "*Keystore Password*" {
              send -- "$ks\r"
              exp_continue
            }

            "*Key Password*" {
              send -- "$kp\r"
              exp_continue
            }

            eof {
              exit 0
            }

            timeout {
              puts "ERROR: Bubblewrap initialization timed out."
              exit 1
            }
          }
          EOF

          chmod +x /tmp/bubblewrap-init.exp

          /tmp/bubblewrap-init.exp

      - name: Verify Android project
        run: |
          test -f android-build/twa-manifest.json
          test -f android-build/android.keystore

          echo "Android project created successfully."

      - name: Build Android app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |

          docker run --rm \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -e BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEY_PASSWORD" \
            -v "$PWD:/work" \
            -w /work/android-build \
            ghcr.io/googlechromelabs/bubblewrap:1.25.0 \
            build

      - name: Verify APK and AAB
        run: |

          test -f android-build/app-release-signed.apk
          test -f android-build/app-release-bundle.aab

          echo "========================================"
          echo "OBITREND BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh \
            android-build/app-release-signed.apk \
            android-build/app-release-bundle.aab

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab
          if-no-files-found: error

      - name: Build complete
        run: |
          echo "OBITREND Android APK and AAB are ready."
