name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

      # ======================================================
      # EXACT OBITREND ANDROID PACKAGE ID
      # ======================================================
      PACKAGE_ID: com.obitrend.aifashioncreator

      APP_NAME: OBITREND AI Fashion Creator
      KEY_ALIAS: android

      KEYSTORE_FILE: ${{ github.workspace }}/android-build/android.keystore

      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. JAVA 17
      # ======================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ======================================================
      # 3. ANDROID SDK
      # ======================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ======================================================
      # 4. VERIFY JAVA
      # ======================================================

      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          test -x "$JAVA_HOME/bin/java"

      # ======================================================
      # 5. VERIFY ANDROID SDK
      # ======================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT"

          sdkmanager --version

      # ======================================================
      # 6. INSTALL ANDROID BUILD TOOLS
      # ======================================================

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android packages:"
          sdkmanager --list_installed | head -100

      # ======================================================
      # 7. INSTALL BUBBLEWRAP
      # ======================================================

      - name: Install Bubblewrap CLI
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @bubblewrap/cli

          echo ""
          echo "Bubblewrap installed."

      # ======================================================
      # 8. CONFIGURE BUBBLEWRAP NON-INTERACTIVELY
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # Bubblewrap normally asks:
      #
      # Do you want Bubblewrap to install the JDK?
      #
      # GitHub Actions cannot answer interactive prompts.
      #
      # We explicitly tell Bubblewrap to use the Java 17
      # and Android SDK already installed by GitHub Actions.
      # ======================================================

      - name: Configure Bubblewrap for GitHub Actions
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING BUBBLEWRAP"
          echo "=========================================="

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          echo ""
          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "Checking Java:"
          "$JAVA_HOME/bin/java" -version

          echo ""
          echo "Checking Android SDK:"
          test -d "$ANDROID_SDK_ROOT"

          echo ""
          echo "Bubblewrap configuration complete."

      # ======================================================
      # 9. VERIFY BUBBLEWRAP WITHOUT INTERACTIVE SETUP
      # ======================================================

      - name: Verify Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$PATH:$(npm prefix -g)/bin"

          bubblewrap --version

          echo ""
          echo "Bubblewrap is ready for CI."

      # ======================================================
      # 10. PREPARE ANDROID DIRECTORY
      # ======================================================

      - name: Prepare Android project directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

      # ======================================================
      # 11. DOWNLOAD WEB MANIFEST
      # ======================================================

      - name: Download OBITREND web manifest
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 60 \
            "$MANIFEST_URL" \
            -o "$ANDROID_DIR/web-manifest.json"

          echo ""
          echo "OBITREND web manifest:"
          cat "$ANDROID_DIR/web-manifest.json"

      # ======================================================
      # 12. VALIDATE WEB MANIFEST
      # ======================================================

      - name: Validate OBITREND web manifest
        shell: bash
        run: |
          set -euo pipefail

          jq empty "$ANDROID_DIR/web-manifest.json"

          NAME=$(jq -r \
            '.name // .short_name // empty' \
            "$ANDROID_DIR/web-manifest.json")

          START_URL=$(jq -r \
            '.start_url // "/"' \
            "$ANDROID_DIR/web-manifest.json")

          ICON_URL=$(jq -r '
            .icons
            | map(select(.src != null))
            | .[0].src
            // empty
          ' "$ANDROID_DIR/web-manifest.json")

          if [ -z "$NAME" ]; then
            echo "ERROR: Web manifest has no name."
            exit 1
          fi

          if [ -z "$ICON_URL" ]; then
            echo "ERROR: Web manifest has no icon."
            exit 1
          fi

          echo ""
          echo "Manifest name:"
          echo "$NAME"

          echo ""
          echo "Start URL:"
          echo "$START_URL"

          echo ""
          echo "Icon:"
          echo "$ICON_URL"

      # ======================================================
      # 13. CREATE TWA MANIFEST
      #
      # NO NODE.JS HEREDOC
      # NO INTERACTIVE BUBBLEWRAP SETUP
      # ======================================================

      - name: Create OBITREND twa-manifest.json
        shell: bash
        run: |
          set -euo pipefail

          WEB_MANIFEST="$ANDROID_DIR/web-manifest.json"
          TWA_MANIFEST="$ANDROID_DIR/twa-manifest.json"

          NAME=$(jq -r \
            '.name // .short_name // "OBITREND AI Fashion Creator"' \
            "$WEB_MANIFEST")

          SHORT_NAME=$(jq -r \
            '.short_name // .name // "OBITREND"' \
            "$WEB_MANIFEST")

          START_URL=$(jq -r \
            '.start_url // "/"' \
            "$WEB_MANIFEST")

          DISPLAY=$(jq -r \
            '.display // "standalone"' \
            "$WEB_MANIFEST")

          THEME_COLOR=$(jq -r \
            '.theme_color // "#05050c"' \
            "$WEB_MANIFEST")

          BACKGROUND_COLOR=$(jq -r \
            '.background_color // "#05050c"' \
            "$WEB_MANIFEST")

          ICON_URL=$(jq -r '
            .icons
            | map(select(.src != null))
            | map(select(
                ((.sizes // "") | test("512|1024"))
                or
                ((.purpose // "") | contains("maskable"))
              ))
            | .[0].src
            // (
              .icons
              | map(select(.src != null))
              | .[0].src
            )
            // empty
          ' "$WEB_MANIFEST")

          if [[ "$ICON_URL" != http://* && "$ICON_URL" != https://* ]]; then
            ICON_URL="https://obitrend.vercel.app/${ICON_URL#/}"
          fi

          jq -n \
            --arg packageId "$PACKAGE_ID" \
            --arg host "obitrend.vercel.app" \
            --arg name "$NAME" \
            --arg launcherName "$SHORT_NAME" \
            --arg display "$DISPLAY" \
            --arg themeColor "$THEME_COLOR" \
            --arg backgroundColor "$BACKGROUND_COLOR" \
            --arg startUrl "$START_URL" \
            --arg iconUrl "$ICON_URL" \
            --arg manifestUrl "$MANIFEST_URL" \
            --arg keystore "$KEYSTORE_FILE" \
            --arg alias "$KEY_ALIAS" \
            '{
              packageId: $packageId,
              host: $host,
              name: $name,
              launcherName: $launcherName,
              display: $display,
              themeColor: $themeColor,
              themeColorDark: $themeColor,
              navigationColor: "#000000",
              navigationColorDark: "#000000",
              navigationDividerColor: "#000000",
              navigationDividerColorDark: "#000000",
              backgroundColor: $backgroundColor,
              startUrl: $startUrl,
              iconUrl: $iconUrl,
              maskableIconUrl: $iconUrl,
              enableNotifications: true,
              enableSiteSettingsShortcut: true,
              isChromeOSOnly: false,
              isMetaQuest: false,
              splashScreenFadeOutDuration: 300,
              appVersionName: "1.0.0",
              appVersionCode: 1,
              signingKey: {
                path: $keystore,
                alias: $alias
              },
              webManifestUrl: $manifestUrl,
              additionalTrustedOrigins: [],
              shortcuts: [],
              protocolHandlers: [],
              fileHandlers: [],
              retainedBundles: [],
              alphaDependencies: {
                enabled: false
              },
              generatorApp: "bubblewrap-cli",
              fallbackType: "customtabs"
            }' > "$TWA_MANIFEST"

          echo ""
          echo "=========================================="
          echo "PACKAGE ID CHECK"
          echo "=========================================="

          ACTUAL_PACKAGE_ID=$(jq -r \
            '.packageId' \
            "$TWA_MANIFEST")

          echo "Actual:"
          echo "$ACTUAL_PACKAGE_ID"

          echo ""
          echo "Required:"
          echo "com.obitrend.aifashioncreator"

          if [ "$ACTUAL_PACKAGE_ID" != "com.obitrend.aifashioncreator" ]; then
            echo ""
            echo "ERROR: WRONG PACKAGE ID"
            exit 1
          fi

          echo ""
          echo "PACKAGE ID VERIFIED."

      # ======================================================
      # 14. RESTORE EXISTING RELEASE KEYSTORE
      # ======================================================

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: Missing GitHub secret:"
            echo "ANDROID_KEYSTORE_BASE64"
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          echo "Existing Android release keystore restored."

      # ======================================================
      # 15. VERIFY SIGNING KEY
      # ======================================================

      - name: Verify Android signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: Missing GitHub secret:"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD"
            exit 1
          fi

          keytool \
            -list \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Android signing key verified."

      # ======================================================
      # 16. GENERATE ANDROID PROJECT
      # ======================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$PATH:$(npm prefix -g)/bin"

          cd "$ANDROID_DIR"

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

      # ======================================================
      # 17. VERIFY GENERATED PACKAGE ID
      # ======================================================

      - name: Verify Android application ID
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated Android project..."

          FOUND=0

          if grep -R \
            "com.obitrend.aifashioncreator" \
            "$ANDROID_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.xml" \
            --include="*.java" \
            --include="*.kt" \
            2>/dev/null \
            | head -20; then
            FOUND=1
          fi

          if [ "$FOUND" -ne 1 ]; then
            echo ""
            echo "ERROR: Package ID was not found in generated Android project."
            exit 1
          fi

          echo ""
          echo "ANDROID PACKAGE ID VERIFIED:"
          echo "com.obitrend.aifashioncreator"

      # ======================================================
      # 18. BUILD SIGNED APK + AAB
      # ======================================================

      - name: Build Android APK and AAB
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${BUBBLEWRAP_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: Missing BUBBLEWRAP_KEYSTORE_PASSWORD."
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Missing BUBBLEWRAP_KEY_PASSWORD."
            exit 1
          fi

          export PATH="$PATH:$(npm prefix -g)/bin"

          cd "$ANDROID_DIR"

          bubblewrap build \
            --manifest="$ANDROID_DIR/twa-manifest.json" \
            --signingKeyPath="$KEYSTORE_FILE" \
            --signingKeyAlias="$KEY_ALIAS"

      # ======================================================
      # 19. FIND APK
      # ======================================================

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "app-release-signed.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" \
            "$ANDROID_DIR/OBITREND-release.apk"

          test -s "$ANDROID_DIR/OBITREND-release.apk"

          echo ""
          echo "APK:"
          ls -lh "$ANDROID_DIR/OBITREND-release.apk"

      # ======================================================
      # 20. FIND AAB
      # ======================================================

      - name: Locate release AAB
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for AAB..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.aab" \
            -print

          AAB=$(find "$ANDROID_DIR" \
            -type f \
            -name "app-release-bundle.aab" \
            -print \
            | head -n 1)

          if [ -z "$AAB" ]; then
            AAB=$(find "$ANDROID_DIR" \
              -type f \
              -name "*.aab" \
              -print \
              | head -n 1)
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          cp "$AAB" \
            "$ANDROID_DIR/OBITREND-release.aab"

          test -s "$ANDROID_DIR/OBITREND-release.aab"

          echo ""
          echo "AAB:"
          ls -lh "$ANDROID_DIR/OBITREND-release.aab"

      # ======================================================
      # 21. VERIFY APK SIGNATURE
      # ======================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/OBITREND-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."

      # ======================================================
      # 22. VERIFY APK PACKAGE ID
      # ======================================================

      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/OBITREND-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep -q \
            "package: name='com.obitrend.aifashioncreator'"

          echo ""
          echo "APK PACKAGE ID VERIFIED:"
          echo "com.obitrend.aifashioncreator"

      # ======================================================
      # 23. VERIFY AAB
      # ======================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/OBITREND-release.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            "$AAB"

          echo ""
          echo "AAB SIGNATURE VERIFIED."

      # ======================================================
      # 24. GENERATE APK HASH
      # ======================================================

      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$ANDROID_DIR/OBITREND-release.apk" \
            | tee \
            "$ANDROID_DIR/OBITREND-release.apk.sha256"

      # ======================================================
      # 25. GENERATE AAB HASH
      # ======================================================

      - name: Generate AAB SHA-256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$ANDROID_DIR/OBITREND-release.aab" \
            | tee \
            "$ANDROID_DIR/OBITREND-release.aab.sha256"

      # ======================================================
      # 26. FINAL VERIFICATION
      # ======================================================

      - name: Final OBITREND build verification
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "================================================"
          echo "       OBITREND ANDROID BUILD COMPLETE"
          echo "================================================"

          echo ""
          echo "Application ID:"
          echo "com.obitrend.aifashioncreator"

          echo ""
          echo "APK:"
          ls -lh \
            "$ANDROID_DIR/OBITREND-release.apk"

          echo ""
          echo "AAB:"
          ls -lh \
            "$ANDROID_DIR/OBITREND-release.aab"

          echo ""
          echo "APK SHA-256:"
          cat \
            "$ANDROID_DIR/OBITREND-release.apk.sha256"

          echo ""
          echo "AAB SHA-256:"
          cat \
            "$ANDROID_DIR/OBITREND-release.aab.sha256"

          echo ""
          echo "================================================"
          echo "PACKAGE ID:"
          echo "com.obitrend.aifashioncreator"
          echo "================================================"

      # ======================================================
      # 27. UPLOAD APK + AAB
      # ======================================================

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            android-build/OBITREND-release.apk
            android-build/OBITREND-release.aab
            android-build/OBITREND-release.apk.sha256
            android-build/OBITREND-release.aab.sha256
          if-no-files-found: error
          retention-days: 30
