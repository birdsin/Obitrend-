name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE.JS
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # 3. JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android packages:"
          sdkmanager --list_installed

          echo ""
          echo "ANDROID SDK READY"

      # =========================================================
      # 5. INSTALL BUBBLEWRAP
      # =========================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING BUBBLEWRAP"
          echo "=========================================="

          npm install -g @bubblewrap/cli

          echo ""
          echo "Bubblewrap version:"
          bubblewrap --version

          echo ""
          echo "Java version:"
          java -version

      # =========================================================
      # 6. VERIFY WEB MANIFEST
      # =========================================================

      - name: Verify Web Manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING WEB MANIFEST"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";

          let manifest;

          try {
            manifest = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            console.error(
              "ERROR: manifest.webmanifest is invalid JSON."
            );
            console.error(error.message);
            process.exit(1);
          }

          console.log("Manifest JSON: VALID");
          console.log("name:", manifest.name);
          console.log("short_name:", manifest.short_name);
          console.log("start_url:", manifest.start_url);
          console.log("display:", manifest.display);

          if (!manifest.name) {
            throw new Error("Manifest is missing name.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest is missing start_url.");
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error("Manifest has no icons.");
          }

          const manifestUrl =
            "https://obitrend.vercel.app/manifest.webmanifest";

          const startUrl = new URL(
            manifest.start_url,
            manifestUrl
          );

          console.log(
            "Resolved start URL:",
            startUrl.href
          );

          for (
            const [index, icon]
            of manifest.icons.entries()
          ) {
            if (!icon.src) {
              throw new Error(
                `Icon ${index} has no src.`
              );
            }

            const iconUrl = new URL(
              icon.src,
              manifestUrl
            );

            if (
              !["http:", "https:"].includes(
                iconUrl.protocol
              )
            ) {
              throw new Error(
                `Icon ${index} has invalid URL.`
              );
            }

            console.log(
              `Icon ${index}:`,
              iconUrl.href
            );
          }

          console.log(
            "MANIFEST VALIDATION: PASSED"
          );
          NODE

      # =========================================================
      # 7. PREPARE CLEAN ANDROID DIRECTORY
      # =========================================================

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

      # =========================================================
      # 8. CREATE BUBBLEWRAP PROJECT
      # =========================================================

      - name: Create Bubblewrap Android project
        shell: bash
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
          ANDROID_DIR: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING BUBBLEWRAP PROJECT"
          echo "=========================================="

          cd "$ANDROID_DIR"

          npx --yes @bubblewrap/cli init \
            --manifest="$MANIFEST_URL" \
            --directory="$ANDROID_DIR"

          echo ""
          echo "Bubblewrap init completed."

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json was not generated."
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "ERROR: gradlew was not generated."
            exit 1
          fi

          echo "twa-manifest.json: FOUND"
          echo "gradlew: FOUND"

      # =========================================================
      # 9. CREATE SIGNING KEY
      # =========================================================
      #
      # IMPORTANT:
      # We deliberately use ONE GitHub secret for BOTH passwords.
      #
      # This eliminates the possibility that the keystore is
      # created with one password and Bubblewrap signs with
      # another.
      #
      # =========================================================

      - name: Create OBITREND signing keystore
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING OBITREND SIGNING KEY"
          echo "=========================================="

          if [ -z "$SIGNING_PASSWORD" ]; then
            echo ""
            echo "ERROR:"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD is empty."
            echo ""
            echo "Create this GitHub Actions secret first."
            exit 1
          fi

          if [ "${#SIGNING_PASSWORD}" -lt 6 ]; then
            echo ""
            echo "ERROR:"
            echo "Signing password must contain at least 6 characters."
            exit 1
          fi

          rm -f "$ANDROID_DIR/android.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$ANDROID_DIR/android.keystore" \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias obitrend \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

          echo ""
          echo "Keystore created."

          # -------------------------------------------------------
          # CRITICAL PASSWORD TEST
          # -------------------------------------------------------

          echo ""
          echo "Testing keystore password..."

          keytool \
            -list \
            -keystore "$ANDROID_DIR/android.keystore" \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -alias obitrend \
            >/dev/null

          echo ""
          echo "=========================================="
          echo "KEYSTORE TEST: PASSED"
          echo "ALIAS: obitrend"
          echo "PASSWORD: VALID"
          echo "=========================================="

      # =========================================================
      # 10. CONFIGURE TWA MANIFEST
      # =========================================================

      - name: Configure OBITREND signing
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          node <<'NODE'
          const fs = require("fs");

          const file = "twa-manifest.json";

          const manifest = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          manifest.packageId = "ai.obitrend.app";

          manifest.name =
            "OBITREND AI Fashion Creator";

          manifest.launcherName =
            "OBITREND";

          manifest.signingKey = {
            path: "./android.keystore",
            alias: "obitrend"
          };

          manifest.appVersionCode = 1;
          manifest.appVersion = "1";

          manifest.minSdkVersion = 23;

          fs.writeFileSync(
            file,
            JSON.stringify(manifest, null, 2) + "\n"
          );

          console.log(
            "Signing configuration:"
          );

          console.log(
            JSON.stringify(
              manifest.signingKey,
              null,
              2
            )
          );

          console.log(
            "TWA manifest configured successfully."
          );
          NODE

      # =========================================================
      # 11. VERIFY SIGNING CONFIGURATION
      # =========================================================

      - name: Verify signing configuration
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING SIGNING CONFIGURATION"
          echo "=========================================="

          test -f "$ANDROID_DIR/android.keystore"
          test -f "$ANDROID_DIR/twa-manifest.json"
          test -f "$ANDROID_DIR/gradlew"

          echo "android.keystore: FOUND"
          echo "twa-manifest.json: FOUND"
          echo "gradlew: FOUND"

          keytool \
            -list \
            -keystore "$ANDROID_DIR/android.keystore" \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -alias obitrend \
            >/dev/null

          node <<'NODE'
          const fs = require("fs");

          const file =
            process.env.ANDROID_DIR +
            "/twa-manifest.json";

          const manifest =
            JSON.parse(
              fs.readFileSync(file, "utf8")
            );

          if (!manifest.signingKey) {
            throw new Error(
              "signingKey is missing."
            );
          }

          if (
            manifest.signingKey.path !==
            "./android.keystore"
          ) {
            throw new Error(
              "Wrong signing key path."
            );
          }

          if (
            manifest.signingKey.alias !==
            "obitrend"
          ) {
            throw new Error(
              "Wrong signing key alias."
            );
          }

          console.log(
            "Signing configuration: VALID"
          );
          NODE

          echo ""
          echo "=========================================="
          echo "SIGNING CONFIGURATION: READY"
          echo "=========================================="

      # =========================================================
      # 12. BUILD APK + AAB
      # =========================================================

      - name: Build Android APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING OBITREND APK + AAB"
          echo "=========================================="

          echo ""
          echo "Final keystore verification..."

          keytool \
            -list \
            -keystore "./android.keystore" \
            -storetype PKCS12 \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -alias obitrend \
            >/dev/null

          echo "Keystore password: VALID"

          echo ""
          echo "Starting Bubblewrap build..."

          npx --yes @bubblewrap/cli build \
            --skipPwaValidation \
            --signingKeyPath="./android.keystore" \
            --signingKeyAlias="obitrend"

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP BUILD FINISHED"
          echo "=========================================="

      # =========================================================
      # 13. FIND APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="

          APK="$ANDROID_DIR/app-release-signed.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK was not generated."

            echo ""
            echo "Searching for APK files:"
            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

      # =========================================================
      # 14. FIND AAB
      # =========================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING AAB"
          echo "=========================================="

          AAB="$ANDROID_DIR/app-release-bundle.aab"

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Signed AAB was not generated."

            echo ""
            echo "Searching for AAB files:"
            find "$ANDROID_DIR" \
              -type f \
              -name "*.aab" \
              -print

            exit 1
          fi

          echo "AAB FOUND:"
          echo "$AAB"

          ls -lh "$AAB"

      # =========================================================
      # 15. VERIFY APK SIGNATURE
      # =========================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/app-release-signed.apk"

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          apksigner verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE: VALID"

      # =========================================================
      # 16. VERIFY AAB
      # =========================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/app-release-bundle.aab"

          echo "=========================================="
          echo "VERIFYING AAB"
          echo "=========================================="

          jarsigner \
            -verify \
            "$AAB"

          echo ""
          echo "AAB SIGNATURE: VALID"

      # =========================================================
      # 17. UPLOAD APK + AAB
      # =========================================================

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Build
          path: |
            ${{ env.ANDROID_DIR }}/app-release-signed.apk
            ${{ env.ANDROID_DIR }}/app-release-bundle.aab
          if-no-files-found: error

      # =========================================================
      # 18. BUILD COMPLETE
      # =========================================================

      - name: Build complete
        run: |
          echo ""
          echo "=========================================="
          echo "       OBITREND ANDROID BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK: app-release-signed.apk"
          echo "AAB: app-release-bundle.aab"
          echo ""
          echo "Both Android files were generated."
          echo "=========================================="
