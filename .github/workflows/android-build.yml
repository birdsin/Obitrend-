name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE.JS 22
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # =========================================================
      # 4. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo ""
          echo "ANDROID SDK: READY"


      # =========================================================
      # 5. VERIFY SIGNING SECRETS
      # =========================================================

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING SIGNING SECRETS"
          echo "=========================================="

          if [ -z "${BUBBLEWRAP_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEY_PASSWORD:-}" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is missing."
            exit 1
          fi

          if [ "${#BUBBLEWRAP_KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "ERROR: Keystore password must contain at least 6 characters."
            exit 1
          fi

          if [ "${#BUBBLEWRAP_KEY_PASSWORD}" -lt 6 ]; then
            echo "ERROR: Key password must contain at least 6 characters."
            exit 1
          fi

          echo "SIGNING SECRETS: FOUND"


      # =========================================================
      # 6. INSTALL BUBBLEWRAP
      # =========================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING BUBBLEWRAP"
          echo "=========================================="

          npm install -g @bubblewrap/cli

          mkdir -p "$HOME/.bubblewrap"

          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo ""
          echo "BUBBLEWRAP VERSION:"
          bubblewrap --version

          echo ""
          echo "BUBBLEWRAP: READY"


      # =========================================================
      # 7. VERIFY WEB MANIFEST
      # =========================================================

      - name: Verify Web Manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING OBITREND WEB MANIFEST"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";

          let manifest;

          try {
            manifest = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            console.error("ERROR: Manifest JSON is invalid.");
            console.error(error.message);
            process.exit(1);
          }

          if (!manifest.name) {
            throw new Error("Manifest is missing name.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest is missing start_url.");
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error("Manifest has no icons.");
          }

          console.log("MANIFEST JSON: VALID");
          console.log("NAME:", manifest.name);
          console.log("START URL:", manifest.start_url);
          console.log("ICONS:", manifest.icons.length);
          NODE

          echo ""
          echo "WEB MANIFEST: VALID"


      # =========================================================
      # 8. PREPARE ANDROID DIRECTORY
      # =========================================================

      - name: Prepare Android directory
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARING ANDROID DIRECTORY"
          echo "=========================================="

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo ""
          echo "ANDROID DIRECTORY:"
          echo "$ANDROID_DIR"


      # =========================================================
      # 9. CREATE SIGNING KEY
      # =========================================================

      - name: Create OBITREND signing key
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING OBITREND SIGNING KEY"
          echo "=========================================="

          KEYSTORE="$ANDROID_DIR/android.keystore"

          if [ -f "$KEYSTORE" ]; then
            echo "Existing keystore found."
          else

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
              -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -alias "obitrend" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, C=NG"

          fi

          test -s "$KEYSTORE"

          echo ""
          echo "KEYSTORE:"
          ls -lh "$KEYSTORE"

          echo ""
          echo "SIGNING KEY: READY"


      # =========================================================
      # 10. CREATE BUBBLEWRAP MANIFEST
      # =========================================================

      - name: Create OBITREND Bubblewrap manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING BUBBLEWRAP MANIFEST"
          echo "=========================================="

          cat > "$ANDROID_DIR/twa-manifest.json" <<EOF
          {
            "packageId": "ai.obitrend.app",
            "host": "obitrend.vercel.app",
            "name": "OBITREND",
            "launcherName": "OBITREND",
            "display": "standalone",
            "orientation": "default",
            "themeColor": "#000000",
            "themeColorDark": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#000000",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://obitrend.vercel.app/icons/icon-512.png",
            "maskableIconUrl": "https://obitrend.vercel.app/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "obitrend"
            },
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "generatorApp": "bubblewrap"
          }
          EOF

          echo ""
          echo "BUBBLEWRAP MANIFEST:"
          cat "$ANDROID_DIR/twa-manifest.json"

          echo ""
          echo "MANIFEST: CREATED"


      # =========================================================
      # 11. GENERATE ANDROID PROJECT
      # =========================================================

      - name: Generate Android project
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GENERATING ANDROID PROJECT"
          echo "=========================================="

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

          chmod +x ./gradlew

          echo ""
          echo "CHECKING PROJECT..."

          test -f "./gradlew"
          test -f "./twa-manifest.json"
          test -f "./android.keystore"

          echo ""
          echo "gradlew: FOUND"
          echo "twa-manifest.json: FOUND"
          echo "android.keystore: FOUND"

          echo ""
          echo "ANDROID PROJECT: READY"


      # =========================================================
      # 12. VERIFY PACKAGE ID
      # =========================================================

      - name: Verify OBITREND Android configuration
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING ANDROID CONFIGURATION"
          echo "=========================================="

          if ! grep -R \
            "ai.obitrend.app" \
            app \
            >/dev/null 2>&1; then

            echo "ERROR: Package ID ai.obitrend.app was not found."
            exit 1
          fi

          echo ""
          echo "PACKAGE ID: ai.obitrend.app"
          echo "ANDROID CONFIGURATION: VALID"


      # =========================================================
      # 13. BUILD SIGNED APK + AAB
      # =========================================================

      - name: Build signed APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING OBITREND APK + AAB"
          echo "=========================================="

          bubblewrap build \
            --skipPwaValidation \
            --manifest="$ANDROID_DIR/twa-manifest.json" \
            --signingKeyPath="$ANDROID_DIR/android.keystore" \
            --signingKeyAlias="obitrend"

          echo ""
          echo "BUBBLEWRAP BUILD FINISHED"


          # -----------------------------------------------------
          # FIND APK
          # -----------------------------------------------------

          echo ""
          echo "SEARCHING FOR SIGNED APK..."

          APK_SOURCE="$(
            find . \
              -type f \
              -name "app-release-signed.apk" \
              -print \
              | head -n 1
          )"


          # -----------------------------------------------------
          # FIND AAB
          # -----------------------------------------------------

          echo ""
          echo "SEARCHING FOR SIGNED AAB..."

          AAB_SOURCE="$(
            find . \
              -type f \
              -name "app-release-bundle.aab" \
              -print \
              | head -n 1
          )"


          # -----------------------------------------------------
          # VERIFY APK
          # -----------------------------------------------------

          if [ -z "$APK_SOURCE" ]; then
            echo ""
            echo "ERROR: Signed APK was not produced."
            echo ""
            echo "APK FILES FOUND:"
            find . -type f -name "*.apk" -print || true
            exit 1
          fi


          # -----------------------------------------------------
          # VERIFY AAB
          # -----------------------------------------------------

          if [ -z "$AAB_SOURCE" ]; then
            echo ""
            echo "ERROR: Signed AAB was not produced."
            echo ""
            echo "AAB FILES FOUND:"
            find . -type f -name "*.aab" -print || true
            exit 1
          fi


          # -----------------------------------------------------
          # COPY FINAL ARTIFACTS
          # -----------------------------------------------------

          cp "$APK_SOURCE" "./app-release-signed.apk"
          cp "$AAB_SOURCE" "./app-release-bundle.aab"

          test -s "./app-release-signed.apk"
          test -s "./app-release-bundle.aab"

          echo ""
          echo "SIGNED APK: FOUND"
          echo "SIGNED AAB: FOUND"

          echo ""
          echo "APK:"
          ls -lh "./app-release-signed.apk"

          echo ""
          echo "AAB:"
          ls -lh "./app-release-bundle.aab"


      # =========================================================
      # 14. VERIFY APK SIGNATURE
      # =========================================================

      - name: Verify APK signature
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          APK="./app-release-signed.apk"

          test -s "$APK"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              -print \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo ""
          echo "APKSIGNER:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE: VALID"


      # =========================================================
      # 15. VERIFY AAB SIGNATURE
      # =========================================================

      - name: Verify AAB signature
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING AAB SIGNATURE"
          echo "=========================================="

          AAB="./app-release-bundle.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "AAB SIGNATURE: VALID"


      # =========================================================
      # 16. FINAL RELEASE CHECK
      # =========================================================

      - name: Final Android release check
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          APK="./app-release-signed.apk"
          AAB="./app-release-bundle.aab"

          test -s "$APK"
          test -s "$AAB"

          echo ""
          echo "=========================================="
          echo "OBITREND FINAL RELEASE CHECK"
          echo "=========================================="

          echo ""
          echo "PACKAGE ID:"
          echo "ai.obitrend.app"

          echo ""
          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "AAB:"
          ls -lh "$AAB"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"

          echo ""
          echo "AAB SHA256:"
          sha256sum "$AAB"

          echo ""
          echo "APK: READY"
          echo "AAB: READY"


      # =========================================================
      # 17. UPLOAD APK + AAB
      # =========================================================

      - name: Upload OBITREND APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            ${{ env.ANDROID_DIR }}/app-release-signed.apk
            ${{ env.ANDROID_DIR }}/app-release-bundle.aab
          if-no-files-found: error


      # =========================================================
      # 18. BUILD COMPLETE
      # =========================================================

      - name: Build complete
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          test -s "./app-release-signed.apk"
          test -s "./app-release-bundle.aab"

          echo ""
          echo "================================================"
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "================================================"
          echo ""
          echo "APK: SIGNED SUCCESSFULLY"
          echo "AAB: SIGNED SUCCESSFULLY"
          echo ""
          echo "PACKAGE ID: ai.obitrend.app"
          echo "KEY ALIAS: obitrend"
          echo ""
          echo "APK: ./app-release-signed.apk"
          echo "AAB: ./app-release-bundle.aab"
          echo ""
          echo "READY FOR RELEASE"
          echo "================================================"
