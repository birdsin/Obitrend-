name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      APP_URL: https://obitrend.vercel.app
      WEB_MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_PROJECT: android-build

    steps:

      # ============================================================
      # 1. CHECK OUT OBITREND
      # ============================================================
      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE.JS 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. INSTALL ANDROID BUILD TOOLS
      # ============================================================
      - name: Install Android build tools
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 6. VERIFY JAVA AND ANDROID
      # ============================================================
      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version
          adb version
          sdkmanager --version

      # ============================================================
      # 7. INSTALL BUBBLEWRAP
      #
      # IMPORTANT:
      # Do NOT run "bubblewrap --version" here.
      # That command can initialize Bubblewrap configuration and
      # trigger the interactive JDK question in GitHub Actions.
      # ============================================================
      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install --global @bubblewrap/cli@1.25.0 --ignore-scripts

          echo "Bubblewrap package installed."

          command -v bubblewrap

      # ============================================================
      # 8. CREATE BUBBLEWRAP CONFIGURATION MANUALLY
      #
      # This prevents Bubblewrap from asking:
      # "Do you want Bubblewrap to install the JDK?"
      # ============================================================
      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo "Bubblewrap configuration created."

          cat "$HOME/.bubblewrap/config.json"

          test -f "$HOME/.bubblewrap/config.json"
          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME"

      # ============================================================
      # 9. VERIFY BUBBLEWRAP CONFIGURATION
      #
      # We deliberately do NOT use:
      #   bubblewrap --version
      #   bubblewrap doctor
      #
      # because those can invoke configuration loading before the
      # project is initialized.
      # ============================================================
      - name: Verify Bubblewrap configuration
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "Bubblewrap executable:"
          command -v bubblewrap

      # ============================================================
      # 10. CHECK SIGNING SECRETS
      # ============================================================
      - name: Check signing secrets
        shell: bash
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KS_PASS" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASS" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing secrets are present."

      # ============================================================
      # 11. PREPARE ANDROID PROJECT DIRECTORY
      # ============================================================
      - name: Prepare Android project directory
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/$ANDROID_PROJECT"
          mkdir -p "$GITHUB_WORKSPACE/$ANDROID_PROJECT"

          echo "Android project directory:"
          pwd
          ls -la "$GITHUB_WORKSPACE"

      # ============================================================
      # 12. DOWNLOAD WEB MANIFEST
      # ============================================================
      - name: Download OBITREND Web Manifest
        shell: bash
        run: |
          set -e

          curl --fail --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 60 \
            "$WEB_MANIFEST_URL" \
            --output /tmp/obitrend-web-manifest.json

          test -s /tmp/obitrend-web-manifest.json

          echo "Downloaded manifest:"
          cat /tmp/obitrend-web-manifest.json

      # ============================================================
      # 13. VALIDATE WEB MANIFEST
      # ============================================================
      - name: Validate Web Manifest
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require('fs');

          const file = '/tmp/obitrend-web-manifest.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (!data.name && !data.short_name) {
            throw new Error('Manifest has no name or short_name.');
          }

          if (!data.start_url) {
            throw new Error('Manifest has no start_url.');
          }

          if (!data.display) {
            console.log('WARNING: Manifest has no display value.');
          }

          console.log('Manifest validation successful.');
          console.log('name:', data.name || data.short_name);
          console.log('start_url:', data.start_url);
          console.log('display:', data.display || 'not specified');
          NODE

      # ============================================================
      # 14. CREATE BUBBLEWRAP PROJECT
      #
      # Bubblewrap init is interactive by design.
      # Expect supplies the answers automatically.
      # ============================================================
      - name: Create Bubblewrap Android project
        shell: bash
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y expect

          cat > /tmp/obitrend-bubblewrap.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 600

          set manifest "https://obitrend.vercel.app/manifest.webmanifest"
          set project "/home/runner/work/Obitrend/Obitrend/android-build"

          set java_home $env(JAVA_HOME)
          set android_home $env(ANDROID_HOME)

          set ks_pass $env(KS_PASS)
          set key_pass $env(KEY_PASS)

          spawn bubblewrap init \
            --manifest="$manifest" \
            --directory="$project"

          expect {
                      -re {Directory .* does not exist.*} {
              send "y\r"
              exp_continue
            }
            -re {Do you want Bubblewrap to install the JDK.*} {
              send "n\r"
              exp_continue
            }

            -re {Path to your existing JDK.*} {
              send "$java_home\r"
              exp_continue
            }

            -re {Do you want Bubblewrap to install Android SDK.*} {
              send "n\r"
              exp_continue
            }

            -re {Path to your existing Android SDK.*} {
              send "$android_home\r"
              exp_continue
            }

            -re {Domain.*} {
              send "obitrend.vercel.app\r"
              exp_continue
            }

            -re {URL path.*} {
              send "/\r"
              exp_continue
            }

            -re {Application name.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {Short name.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {Start URL.*} {
              send "https://obitrend.vercel.app/\r"
              exp_continue
            }

            -re {Package ID.*} {
              send "com.obitrend.ai\r"
              exp_continue
            }

            -re {App Version.*} {
              send "1\r"
              exp_continue
            }

            -re {App Version Name.*} {
              send "1.0.0\r"
              exp_continue
            }

            -re {Display mode.*} {
              send "standalone\r"
              exp_continue
            }

            -re {Orientation.*} {
              send "portrait\r"
              exp_continue
            }

            -re {Theme color.*} {
              send "#000000\r"
              exp_continue
            }

            -re {Background color.*} {
              send "#ffffff\r"
              exp_continue
            }

            -re {Icon URL.*} {
              send "\r"
              exp_continue
            }

            -re {Maskable icon URL.*} {
              send "\r"
              exp_continue
            }

            -re {Signing key path.*} {
              send "$project/android.keystore\r"
              exp_continue
            }

            -re {Key alias.*} {
              send "obitrend\r"
              exp_continue
            }

            -re {Full name.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {Organizational Unit.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {Organization.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {Country.*} {
              send "NG\r"
              exp_continue
            }

            -re {Keystore password.*} {
              send "$ks_pass\r"
              exp_continue
            }

            -re {Key password.*} {
              send "$key_pass\r"
              exp_continue
            }

            -re {Do you want to create.*signing key.*} {
              send "y\r"
              exp_continue
            }

            eof {
              exit 0
            }

            timeout {
              puts stderr "ERROR: Bubblewrap initialization timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-bubblewrap.exp

          /tmp/obitrend-bubblewrap.exp

      # ============================================================
      # 15. VERIFY GENERATED PROJECT
      # ============================================================
      - name: Verify generated Android project
        shell: bash
        run: |
          set -e

          test -f "$ANDROID_PROJECT/twa-manifest.json"

          echo "Generated TWA manifest:"
          cat "$ANDROID_PROJECT/twa-manifest.json"

          echo ""
          echo "Generated project:"
          find "$ANDROID_PROJECT" -maxdepth 3 -type f | sort

      # ============================================================
      # 16. BUILD APK AND AAB
      # ============================================================
      - name: Build Android APK and AAB
        shell: bash
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        working-directory: android-build
        run: |
          set -e

          echo "Building OBITREND..."

          bubblewrap build \
            --skipPwaValidation

      # ============================================================
      # 17. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$ANDROID_PROJECT" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$ANDROID_PROJECT" -type f | sort
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      # ============================================================
      # 18. VERIFY AAB
      # ============================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="$(find "$ANDROID_PROJECT" -type f -name '*.aab' | head -n 1)"

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            find "$ANDROID_PROJECT" -type f | sort
            exit 1
          fi

          echo "AAB generated:"
          ls -lh "$AAB"

      # ============================================================
      # 19. UPLOAD APK AND AAB
      # ============================================================
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android
          path: |
            android-build/**/*.apk
            android-build/**/*.aab
          if-no-files-found: error

      # ============================================================
      # 20. BUILD COMPLETE
      # ============================================================
      - name: Build complete
        shell: bash
        run: |
          echo "=========================================="
          echo "       OBITREND ANDROID BUILD COMPLETE"
          echo "=========================================="

          echo ""
          echo "APK files:"
          find android-build -type f -name '*.apk' -print

          echo ""
          echo "AAB files:"
          find android-build -type f -name '*.aab' -print
