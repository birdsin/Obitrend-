name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK ready."

      - name: Install required tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y curl jq expect

          echo "Required tools installed."

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install -g @bubblewrap/cli@1.25.0 --ignore-scripts

          bubblewrap --version

      - name: Verify environment
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          java -version

          test -d "$JAVA_HOME"
          test -d "$ANDROID_SDK_ROOT"

      - name: Check signing secrets
        shell: bash
        run: |
          set -e

          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets are available."

      - name: Prepare Android directory
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-build"

          mkdir -p "$GITHUB_WORKSPACE/android-build"

          echo "Android build directory prepared."

      - name: Download OBITREND manifest
        shell: bash
        run: |
          set -e

          curl \
            --location \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 60 \
            "https://obitrend.vercel.app/manifest.webmanifest" \
            -o "$GITHUB_WORKSPACE/android-build/original-manifest.json"

          test -s "$GITHUB_WORKSPACE/android-build/original-manifest.json"

          echo "Downloaded manifest:"
          cat "$GITHUB_WORKSPACE/android-build/original-manifest.json"

      - name: Validate downloaded manifest
        shell: bash
        run: |
          set -e

          jq empty \
            "$GITHUB_WORKSPACE/android-build/original-manifest.json"

          echo "Manifest JSON is valid."

      - name: Create clean OBITREND manifest
        shell: bash
        run: |
          set -e

          cat > "$GITHUB_WORKSPACE/android-build/manifest.json" <<'EOF'
          {
            "name": "OBITREND AI Fashion Creator",
            "short_name": "OBITREND",
            "description": "AI-powered fashion creation studio.",
            "id": "https://obitrend.vercel.app/",
            "start_url": "https://obitrend.vercel.app/",
            "scope": "https://obitrend.vercel.app/",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#020204",
            "theme_color": "#050505",
            "icons": [
              {
                "src": "https://obitrend.vercel.app/icons/icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "https://obitrend.vercel.app/icons/icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              }
            ]
          }
          EOF

          jq empty \
            "$GITHUB_WORKSPACE/android-build/manifest.json"

          echo "Clean manifest created."

          cat "$GITHUB_WORKSPACE/android-build/manifest.json"

      - name: Publish clean manifest temporarily
        shell: bash
        run: |
          set -e

          echo "Using the existing OBITREND HTTPS manifest endpoint."

          curl \
            --location \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 60 \
            "https://obitrend.vercel.app/" \
            -o /tmp/obitrend-home.html

          test -s /tmp/obitrend-home.html

          echo "OBITREND website is reachable."

      - name: Create Bubblewrap project
        working-directory: android-build
        shell: bash
        timeout-minutes: 20
        run: |
          set -e

          echo "Starting Bubblewrap."

          cat > /tmp/obitrend-init.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 1200

          spawn bubblewrap init --manifest "https://obitrend.vercel.app/manifest.webmanifest"

          expect {
            -nocase -re {Do you want Bubblewrap to install the JDK.*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {Path to your existing JDK.*} {
              send -- "$env(JAVA_HOME)\r"
              exp_continue
            }

            -nocase -re {Do you want Bubblewrap to install the Android SDK.*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {Path to your existing Android SDK.*} {
              send -- "$env(ANDROID_SDK_ROOT)\r"
              exp_continue
            }

            -nocase -re {Domain.*} {
              send -- "obitrend.vercel.app\r"
              exp_continue
            }

            -nocase -re {URL path.*} {
              send -- "/\r"
              exp_continue
            }

            -nocase -re {Application name.*} {
              send -- "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            -nocase -re {Short name.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Launcher name.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Application ID.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {Package ID.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {Version code.*} {
              send -- "1\r"
              exp_continue
            }

            -nocase -re {Display mode.*} {
              send -- "standalone\r"
              exp_continue
            }

            -nocase -re {Orientation.*} {
              send -- "portrait\r"
              exp_continue
            }

            -nocase -re {Theme color.*} {
              send -- "#050505\r"
              exp_continue
            }

            -nocase -re {Background color.*} {
              send -- "#020204\r"
              exp_continue
            }

            -nocase -re {Icon URL.*} {
              send -- "https://obitrend.vercel.app/icons/icon-512.png\r"
              exp_continue
            }

            -nocase -re {Maskable icon URL.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {Monochrome icon URL.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {Play Billing.*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {Location delegation.*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {Key path.*} {
              send -- "obitrend.keystore\r"
              exp_continue
            }

            -nocase -re {Key alias.*} {
              send -- "obitrend\r"
              exp_continue
            }

            -nocase -re {Do you want to create.*} {
              send -- "y\r"
              exp_continue
            }

            -nocase -re {Full Name.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Organizational Unit.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Organization.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Country.*} {
              send -- "NG\r"
              exp_continue
            }

            -nocase -re {Keystore Password.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {Key Password.*} {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            eof {
              catch wait result
              set exitCode [lindex $result 3]
              exit $exitCode
            }

            timeout {
              puts stderr "ERROR: Bubblewrap initialization timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-init.exp

          /tmp/obitrend-init.exp

          test -f twa-manifest.json

          echo "Bubblewrap project created successfully."

      - name: Verify Android project
        working-directory: android-build
        shell: bash
        run: |
          set -e

          test -f twa-manifest.json

          echo "Project verification successful."

          find . -maxdepth 3 -type f | sort

      - name: Build APK and AAB
        working-directory: android-build
        shell: bash
        timeout-minutes: 30
        run: |
          set -e

          bubblewrap build

          echo "APK and AAB build completed."

      - name: Verify APK and AAB
        working-directory: android-build
        shell: bash
        run: |
          set -e

          APK="$(find . -type f -name '*signed*.apk' | head -n 1)"
          AAB="$(find . -type f -name '*.aab' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Signed APK not found."
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found."
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

          echo "AAB:"
          ls -lh "$AAB"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-APK-and-AAB
          path: |
            android-build/**/*.apk
            android-build/**/*.aab
          if-no-files-found: error

      - name: Build complete
        shell: bash
        run: |
          echo "======================================"
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "======================================"
