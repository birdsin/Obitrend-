name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build
      BUBBLEWRAP_VERSION: latest

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. SETUP JAVA 17
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------
      # 3. SETUP NODE
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ------------------------------------------------------------
      # 4. VERIFY TOOLS
      # ------------------------------------------------------------
      - name: Verify build tools
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Python:"
          python3 --version

          echo ""
          echo "Git:"
          git --version

      # ------------------------------------------------------------
      # 5. INSTALL BUBBLEWRAP
      # ------------------------------------------------------------
      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install --global @bubblewrap/cli@${BUBBLEWRAP_VERSION}

          echo ""
          echo "Bubblewrap version:"
          bubblewrap --version

      # ------------------------------------------------------------
      # 6. PREPARE ANDROID DIRECTORY
      # ------------------------------------------------------------
      - name: Prepare Android project directory
        shell: bash
        run: |
          set -e

          rm -rf "$ANDROID_DIR"
          mkdir -p "$ANDROID_DIR"

          echo "Android project directory:"
          echo "$ANDROID_DIR"

      # ------------------------------------------------------------
      # 7. DOWNLOAD MANIFEST
      # ------------------------------------------------------------
      - name: Download web manifest
        shell: bash
        run: |
          set -e

          echo "Manifest URL:"
          echo "$MANIFEST_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            "$MANIFEST_URL" \
            --output "$ANDROID_DIR/manifest.webmanifest"

          echo ""
          echo "Manifest downloaded successfully."

          test -s "$ANDROID_DIR/manifest.webmanifest"

          echo ""
          echo "Manifest preview:"
          head -c 1000 "$ANDROID_DIR/manifest.webmanifest" || true
          echo ""

      # ------------------------------------------------------------
      # 8. CREATE BUBBLEWRAP CONFIG
      # ------------------------------------------------------------
      - name: Create Bubblewrap configuration
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.obitrend.app",
            "host": "obitrend.vercel.app",
            "name": "OBITREND AI Fashion CREATOR",
            "launcherName": "OBITREND",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "https://obitrend.vercel.app/favicon.ico",
            "maskableIconUrl": "https://obitrend.vercel.app/favicon.ico",
            "webManifestUrl": "https://obitrend.vercel.app/manifest.webmanifest",
            "enableNotifications": true,
            "enableSiteSettings": true,
            "fullScreen": false,
            "orientation": "portrait",
            "appVersion": "1.0.0",
            "appVersionCode": 1
          }
          EOF

          echo "Bubblewrap configuration created."

          echo ""
          echo "Configuration:"
          cat twa-manifest.json

      # ------------------------------------------------------------
      # 9. INITIALIZE BUBBLEWRAP
      # ------------------------------------------------------------
      - name: Generate Android project
        shell: bash
        env:
          CI: true
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Generating Android project..."

          bubblewrap init \
            --manifest "$MANIFEST_URL" \
            --directory "$ANDROID_DIR" \
            --skipPwaValidation

          echo ""
          echo "Bubblewrap project generated."

      # ------------------------------------------------------------
      # 10. PATCH ANDROID CONFIGURATION
      # ------------------------------------------------------------
      - name: Configure Android project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Android project contents:"
          find . -maxdepth 3 -type f | sort | head -200

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

          echo ""
          echo "Gradle wrapper:"
          if [ -f gradlew ]; then
            ./gradlew --version
          else
            echo "gradlew was not generated."
            exit 1
          fi

      # ------------------------------------------------------------
      # 11. BUILD DEBUG APK
      # ------------------------------------------------------------
      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew

          echo "Building APK..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            assembleRelease

          echo ""
          echo "APK build completed."

      # ------------------------------------------------------------
      # 12. BUILD AAB
      # ------------------------------------------------------------
      - name: Build Android AAB
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew

          echo "Building AAB..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            bundleRelease

          echo ""
          echo "AAB build completed."

      # ------------------------------------------------------------
      # 13. FIND APK
      # ------------------------------------------------------------
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE="$(find . \
            -type f \
            -name "*.apk" \
            ! -name "*unsigned*" \
            ! -name "*unaligned*" \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was found."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/release/OBITREND.apk"

      # ------------------------------------------------------------
      # 14. FIND AAB
      # ------------------------------------------------------------
      - name: Locate AAB
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Searching for AAB..."

          find . \
            -type f \
            -name "*.aab" \
            -print

          AAB_FILE="$(find . \
            -type f \
            -name "*.aab" \
            ! -name "*unsigned*" \
            | head -n 1)"

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: No AAB was found."
            exit 1
          fi

          echo ""
          echo "AAB found:"
          echo "$AAB_FILE"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$AAB_FILE" \
            "$GITHUB_WORKSPACE/release/OBITREND.aab"

      # ------------------------------------------------------------
      # 15. VERIFY APK
      # ------------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/release/OBITREND.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "APK file type:"
          file "$APK"

          echo ""
          echo "APK ZIP test:"

          unzip -t "$APK" >/dev/null

          echo "APK verification successful."

      # ------------------------------------------------------------
      # 16. VERIFY AAB
      # ------------------------------------------------------------
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="$GITHUB_WORKSPACE/release/OBITREND.aab"

          test -f "$AAB"
          test -s "$AAB"

          echo "AAB:"
          ls -lh "$AAB"

          echo ""
          echo "AAB file type:"
          file "$AAB"

          echo ""
          echo "AAB ZIP test:"

          unzip -t "$AAB" >/dev/null

          echo "AAB verification successful."

      # ------------------------------------------------------------
      # 17. VERIFY APK SIGNATURE
      # ------------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/release/OBITREND.apk"

          echo "Checking APK signature..."

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "APK signature verification successful."

      # ------------------------------------------------------------
      # 18. VERIFY AAB SIGNATURE
      # ------------------------------------------------------------
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          AAB="$GITHUB_WORKSPACE/release/OBITREND.aab"

          echo "Checking AAB signature..."

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "AAB signature verification completed."

      # ------------------------------------------------------------
      # 19. SHOW RELEASE FILES
      # ------------------------------------------------------------
      - name: Show release files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "OBITREND RELEASE FILES"
          echo "=========================================="

          ls -lah "$GITHUB_WORKSPACE/release"

          echo ""
          echo "APK SHA256:"
          sha256sum "$GITHUB_WORKSPACE/release/OBITREND.apk"

          echo ""
          echo "AAB SHA256:"
          sha256sum "$GITHUB_WORKSPACE/release/OBITREND.aab"

      # ------------------------------------------------------------
      # 20. UPLOAD ARTIFACTS
      # ------------------------------------------------------------
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: release/
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 21. BUILD COMPLETE
      # ------------------------------------------------------------
      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "=========================================="
          echo ""
          echo "APK: release/OBITREND.apk"
          echo "AAB: release/OBITREND.aab"
          echo ""
          echo "The Android build finished successfully."
