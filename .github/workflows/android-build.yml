name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE.JS
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo ""
          echo "ANDROID SDK: READY"

      # =========================================================
      # 5. VERIFY SIGNING SECRETS
      # =========================================================

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${BUBBLEWRAP_KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is empty."
            exit 1
          fi

          if [ -z "${BUBBLEWRAP_KEY_PASSWORD:-}" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is empty."
            exit 1
          fi

          if [ "${#BUBBLEWRAP_KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD must be at least 6 characters."
            exit 1
          fi

          if [ "${#BUBBLEWRAP_KEY_PASSWORD}" -lt 6 ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD must be at least 6 characters."
            exit 1
          fi

          echo "SIGNING SECRETS: FOUND"

            # =========================================================
      # 6. INSTALL AND CONFIGURE BUBBLEWRAP
      # =========================================================

      - name: Install and configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING BUBBLEWRAP"
          echo "=========================================="

          npm install -g @bubblewrap/cli

          echo ""
          echo "BUBBLEWRAP VERSION:"
          bubblewrap --version

          echo ""
          echo "CONFIGURING BUBBLEWRAP"

          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo ""
          echo "BUBBLEWRAP CONFIGURATION: COMPLETE"

          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "ANDROID SDK:"
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          echo ""
          echo "BUBBLEWRAP: READY"

      # =========================================================
      # 7. VERIFY WEB MANIFEST
      # =========================================================

      - name: Verify Web Manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING OBITREND WEB MANIFEST"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";

          let manifest;

          try {
            manifest = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            console.error("ERROR: Invalid manifest JSON.");
            console.error(error.message);
            process.exit(1);
          }

          if (!manifest.name) {
            throw new Error("Manifest is missing name.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest is missing start_url.");
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error("Manifest has no icons.");
          }

          console.log("MANIFEST JSON: VALID");
          console.log("NAME:", manifest.name);
          console.log(
            "SHORT NAME:",
            manifest.short_name || ""
          );
          console.log(
            "START URL:",
            manifest.start_url
          );
          console.log(
            "ICONS:",
            manifest.icons.length
          );
          NODE

          echo ""
          echo "WEB MANIFEST: VALID"

      # =========================================================
      # 8. PREPARE ANDROID DIRECTORY
      # =========================================================

      - name: Prepare Android directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "ANDROID DIRECTORY:"
          echo "$ANDROID_DIR"

      # =========================================================
      # 9. INITIALIZE BUBBLEWRAP PROJECT
      # =========================================================

      - name: Initialize Bubblewrap Android project
        shell: bash
        run: |
          set -euo pipefail

          apt-get update -qq
          apt-get install -y -qq expect

          cat > /tmp/init-bubblewrap.exp <<'EXPECT'
          set timeout 900
          log_user 1

          set manifest $env(MANIFEST_URL)
          set directory $env(ANDROID_DIR)
          set storepass $env(BUBBLEWRAP_KEYSTORE_PASSWORD)
          set keypass $env(BUBBLEWRAP_KEY_PASSWORD)

          spawn bubblewrap init \
            --manifest=$manifest \
            --directory=$directory

          expect {
            -re "(?i)host.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)start.*url.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)launcher.*name.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)name.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)package.*id.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)version.*code.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)display.*mode.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)orientation.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)theme.*color.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)background.*color.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)icon.*url.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)maskable.*icon.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)monochrome.*icon.*:" {
              send "\r"
              exp_continue
            }

            -re "(?i)play.*billing.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i)location.*delegation.*" {
              send "n\r"
              exp_continue
            }

            -re "(?i)create.*signing.*key.*" {
              send "\r"
              exp_continue
            }

            -re "(?i)organizational.*unit.*:" {
              send "OBITREND\r"
              exp_continue
            }

            -re "(?i)organization.*:" {
              send "OBITREND\r"
              exp_continue
            }

            -re "(?i)full.*name.*:" {
              send "OBITREND\r"
              exp_continue
            }

            -re "(?i)country.*:" {
              send "NG\r"
              exp_continue
            }

            -re "(?i)keystore.*password.*:" {
              send -- "$storepass\r"
              exp_continue
            }

            -re "(?i)key.*password.*:" {
              send -- "$keypass\r"
              exp_continue
            }

            -re "(?i)key.*path.*:" {
              send "./android.keystore\r"
              exp_continue
            }

            -re "(?i)key.*alias.*:" {
              send "obitrend\r"
              exp_continue
            }

            eof
          }

          catch wait result

          set exit_code [lindex $result 3]

          if {$exit_code != 0} {
            exit $exit_code
          }
          EXPECT

          expect /tmp/init-bubblewrap.exp

          echo ""
          echo "=========================================="
          echo "CHECKING GENERATED PROJECT"
          echo "=========================================="

          test -f "$ANDROID_DIR/twa-manifest.json"
          test -f "$ANDROID_DIR/gradlew"
          test -f "$ANDROID_DIR/android.keystore"

          echo "twa-manifest.json: FOUND"
          echo "gradlew: FOUND"
          echo "android.keystore: FOUND"

          echo ""
          echo "BUBBLEWRAP PROJECT: READY"

      # =========================================================
      # 10. FORCE OBITREND SIGNING SETTINGS
      # =========================================================

      - name: Configure OBITREND signing
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const file =
            process.env.ANDROID_DIR +
            "/twa-manifest.json";

          const manifest = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          manifest.packageId = "ai.obitrend.app";
          manifest.launcherName = "OBITREND";

          manifest.signingKey = {
            path: "./android.keystore",
            alias: "obitrend"
          };

          manifest.appVersionCode = 1;
          manifest.appVersion = "1";

          fs.writeFileSync(
            file,
            JSON.stringify(manifest, null, 2) + "\n"
          );

          console.log(
            "PACKAGE:",
            manifest.packageId
          );

          console.log(
            "ALIAS:",
            manifest.signingKey.alias
          );

          console.log(
            "KEYSTORE:",
            manifest.signingKey.path
          );

          console.log(
            "VERSION CODE:",
            manifest.appVersionCode
          );
          NODE

          test -f "$ANDROID_DIR/android.keystore"

          echo ""
          echo "OBITREND SIGNING CONFIGURATION: READY"

      # =========================================================
      # 11. UPDATE ANDROID PROJECT
      # =========================================================

      - name: Update Bubblewrap Android project
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

          chmod +x ./gradlew

          test -f ./gradlew
          test -f ./android.keystore

          echo "ANDROID PROJECT UPDATE: SUCCESS"

      # =========================================================
      # 12. BUILD AND SIGN APK + AAB
      # =========================================================

      - name: Build signed APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING OBITREND APK + AAB"
          echo "=========================================="

          BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD" \
          BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEY_PASSWORD" \
          bubblewrap build \
            --skipPwaValidation \
            --manifest="$ANDROID_DIR/twa-manifest.json" \
            --signingKeyPath="$ANDROID_DIR/android.keystore" \
            --signingKeyAlias="obitrend"

          echo ""
          echo "BUBBLEWRAP BUILD FINISHED"

          echo ""
          echo "APK FILES:"
          find . \
            -type f \
            -name "*.apk" \
            -print || true

          echo ""
          echo "AAB FILES:"
          find . \
            -type f \
            -name "*.aab" \
            -print || true

          APK_SOURCE="$(
            find . \
              -type f \
              -name "app-release-signed.apk" \
              -print \
              | head -n 1
          )"

          AAB_SOURCE="$(
            find . \
              -type f \
              -name "app-release-bundle.aab" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK_SOURCE" ]; then
            echo ""
            echo "ERROR: Signed APK was not produced."
            exit 1
          fi

          if [ -z "$AAB_SOURCE" ]; then
            echo ""
            echo "ERROR: Signed AAB was not produced."
            exit 1
          fi

          cp "$APK_SOURCE" ./app-release-signed.apk
          cp "$AAB_SOURCE" ./app-release-bundle.aab

          test -s ./app-release-signed.apk
          test -s ./app-release-bundle.aab

          echo ""
          echo "APK: FOUND"
          echo "AAB: FOUND"

      # =========================================================
      # 13. VERIFY APK SIGNATURE
      # =========================================================

      - name: Verify APK signature
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          APK="./app-release-signed.apk"

          test -s "$APK"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" \
              -perm -111 \
              -print \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE: VALID"

      # =========================================================
      # 14. VERIFY AAB SIGNATURE
      # =========================================================

      - name: Verify AAB signature
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          AAB="./app-release-bundle.aab"

          test -s "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "AAB SIGNATURE: VALID"

      # =========================================================
      # 15. FINAL RELEASE CHECK
      # =========================================================

      - name: Final Android release check
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          test -s "./app-release-signed.apk"
          test -s "./app-release-bundle.aab"

          echo "=========================================="
          echo "OBITREND FINAL RELEASE"
          echo "=========================================="

          echo ""
          echo "APK:"
          ls -lh "./app-release-signed.apk"

          echo ""
          echo "AAB:"
          ls -lh "./app-release-bundle.aab"

          echo ""
          echo "APK: READY"
          echo "AAB: READY"

          echo ""
          echo "=========================================="
          echo "READY FOR GOOGLE PLAY"
          echo "=========================================="

      # =========================================================
      # 16. UPLOAD APK + AAB
      # =========================================================

      - name: Upload OBITREND APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            ${{ env.ANDROID_DIR }}/app-release-signed.apk
            ${{ env.ANDROID_DIR }}/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 17. COMPLETE
      # =========================================================

      - name: Build complete
        run: |
          echo "=========================================="
          echo "OBITREND ANDROID BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK: app-release-signed.apk"
          echo "AAB: app-release-bundle.aab"
          echo ""
          echo "APK SIGNATURE: VALID"
          echo "AAB SIGNATURE: VALID"
          echo ""
          echo "OBITREND IS READY FOR GOOGLE PLAY"
          echo "=========================================="
