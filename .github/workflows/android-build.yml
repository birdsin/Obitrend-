name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. NODE.JS
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. INSTALL REQUIRED TOOLS
      # ============================================================
      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install -g @bubblewrap/cli

          bubblewrap --version

          echo "Bubblewrap installed successfully."

      # ============================================================
      # 6. CLEAN OLD BUILD DIRECTORY
      # ============================================================
      - name: Prepare Android build directory
        shell: bash
        run: |
          set -e

          rm -rf "$ANDROID_DIR"
          mkdir -p "$ANDROID_DIR"

          echo "Android build directory:"
          echo "$ANDROID_DIR"

      # ============================================================
      # 7. GENERATE TWA CONFIGURATION
      #
      # IMPORTANT:
      # No node -e JavaScript is used here.
      # This permanently removes the broken `host` syntax problem.
      # ============================================================
      - name: Create TWA configuration
        shell: bash
        run: |
          set -e

          cat > "$ANDROID_DIR/twa-manifest.json" <<'JSON'
          {
            "packageId": "com.obitrend.app",
            "host": "obitrend.vercel.app",
            "name": "OBITREND AI Fashion CREATOR",
            "launcherName": "OBITREND",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#ffffff",
            "navigationColor": "#ffffff",
            "navigationDividerColor": "#ffffff",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "webManifestUrl": "https://obitrend.vercel.app/manifest.webmanifest",
            "iconUrl": "https://obitrend.vercel.app/icon-512.png",
            "maskableIconUrl": "https://obitrend.vercel.app/icon-512.png",
            "fallbackType": "customtabs",
            "enableNotifications": true,
            "features": {
              "locationDelegation": false,
              "playBilling": false
            }
          }
          JSON

          echo "TWA configuration created."

          echo ""
          echo "Checking JSON syntax..."

          python3 - <<'PY'
          import json

          path = "android-build/twa-manifest.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "packageId",
              "host",
              "name",
              "startUrl"
          ]

          for key in required:
              if key not in data:
                  raise SystemExit(f"Missing required field: {key}")

          print("JSON syntax is valid.")
          print("Host:", data["host"])
          print("Package:", data["packageId"])
          print("Start URL:", data["startUrl"])
          PY

      # ============================================================
      # 8. GENERATE ANDROID PROJECT
      # ============================================================
      - name: Generate Android project
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          echo "Generating Android project..."

          bubblewrap init \
            --manifest "$MANIFEST_URL" \
            --directory "$ANDROID_DIR" \
            --overwrite

          echo ""
          echo "Android project generation completed."

      # ============================================================
      # 9. ENSURE CORRECT PACKAGE / HOST
      # ============================================================
      - name: Validate generated project
        shell: bash
        run: |
          set -e

          echo "Checking generated Android project..."

          test -d "$ANDROID_DIR"

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json was not generated."
            exit 1
          fi

          echo "Android project exists."
          echo "TWA manifest exists."

          find "$ANDROID_DIR" -maxdepth 2 -type f | sort | head -100

      # ============================================================
      # 10. DOWNLOAD / PREPARE BUBBLEWRAP DEPENDENCIES
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "ERROR: Gradle wrapper was not generated."
            exit 1
          fi

      # ============================================================
      # 11. BUILD APK + AAB
      # ============================================================
      - name: Build Android APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          chmod +x ./gradlew

          echo "Building APK..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

          echo ""
          echo "Building AAB..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            bundleRelease

          echo ""
          echo "Android APK and AAB build completed."

      # ============================================================
      # 12. FIND RELEASE APK
      # ============================================================
      - name: Locate release APK
        id: find_apk
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          APK=""

          if [ -d "app/build/outputs/apk" ]; then
            APK=$(find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              ! -name "*unsigned*" \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "No release APK found."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$ANDROID_DIR/$APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 13. FIND RELEASE AAB
      # ============================================================
      - name: Locate release AAB
        id: find_aab
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          AAB=""

          if [ -d "app/build/outputs/bundle" ]; then
            AAB=$(find app/build/outputs/bundle \
              -type f \
              -name "*.aab" \
              | head -n 1)
          fi

          if [ -z "$AAB" ]; then
            echo "No release AAB found."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

          echo "aab=$ANDROID_DIR/$AAB" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 14. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="${{ steps.find_apk.outputs.apk }}"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "APK file verification successful."

          file "$APK"

      # ============================================================
      # 15. VERIFY AAB
      # ============================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB="${{ steps.find_aab.outputs.aab }}"

          test -f "$AAB"

          echo "AAB:"
          ls -lh "$AAB"

          echo ""
          echo "AAB file verification successful."

          file "$AAB"

      # ============================================================
      # 16. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="${{ steps.find_apk.outputs.apk }}"

          echo "Checking APK signature..."

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          else
            SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1)

            if [ -z "$SDK_APKSIGNER" ]; then
              echo "ERROR: apksigner not found."
              exit 1
            fi

            "$SDK_APKSIGNER" verify --verbose "$APK"
          fi

          echo ""
          echo "APK signature verification completed."

      # ============================================================
      # 17. VERIFY AAB SIGNATURE
      # ============================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -e

          AAB="${{ steps.find_aab.outputs.aab }}"

          echo "Checking AAB..."

          if command -v jarsigner >/dev/null 2>&1; then
            jarsigner -verify "$AAB"
          else
            echo "ERROR: jarsigner not found."
            exit 1
          fi

          echo ""
          echo "AAB signature verification completed."

      # ============================================================
      # 18. CREATE RELEASE DIRECTORY
      # ============================================================
      - name: Prepare release files
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "${{ steps.find_apk.outputs.apk }}" \
            release/OBITREND-release.apk

          cp "${{ steps.find_aab.outputs.aab }}" \
            release/OBITREND-release.aab

          echo "Release files:"
          ls -lh release

      # ============================================================
      # 19. UPLOAD APK + AAB
      # ============================================================
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: release/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 20. BUILD COMPLETE
      # ============================================================
      - name: Build complete
        shell: bash
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "        OBITREND ANDROID BUILD COMPLETE"
          echo "=============================================="
          echo ""
          echo "APK:"
          ls -lh release/OBITREND-release.apk
          echo ""
          echo "AAB:"
          ls -lh release/OBITREND-release.aab
          echo ""
          echo "All required build and verification stages completed."
          echo "=============================================="
