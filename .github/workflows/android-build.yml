name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      APP_URL: https://obitrend.vercel.app
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build
      RELEASE_DIR: ${{ github.workspace }}/release

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # 3. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ============================================================
      # 4. BASIC TOOLS
      # ============================================================
      - name: Verify tools
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Python:"
          python3 --version

          echo ""
          echo "Android SDK:"
          echo "${ANDROID_HOME}"

      # ============================================================
      # 5. INSTALL BUBBLEWRAP
      # ============================================================
      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @bubblewrap/cli

          echo ""
          echo "Bubblewrap:"
          bubblewrap --version

      # ============================================================
      # 6. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"
          rm -rf "$RELEASE_DIR"

          mkdir -p "$ANDROID_DIR"
          mkdir -p "$RELEASE_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR"
          echo "RELEASE_DIR=$RELEASE_DIR"

      # ============================================================
      # 7. DOWNLOAD WEB MANIFEST
      # ============================================================
      - name: Download OBITREND web manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading:"
          echo "$MANIFEST_URL"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            "$MANIFEST_URL" \
            -o "$ANDROID_DIR/web-manifest.json"

          test -s "$ANDROID_DIR/web-manifest.json"

          echo ""
          echo "Web manifest downloaded successfully."

          python3 -m json.tool \
            "$ANDROID_DIR/web-manifest.json" \
            > "$ANDROID_DIR/web-manifest-formatted.json"

          echo ""
          echo "Manifest:"
          cat "$ANDROID_DIR/web-manifest-formatted.json"

      # ============================================================
      # 8. CREATE TWA MANIFEST
      # ============================================================
      - name: Create Bubblewrap TWA manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          android_dir = Path(os.environ["ANDROID_DIR"])

          source_file = android_dir / "web-manifest.json"
          target_file = android_dir / "twa-manifest.json"

          with source_file.open("r", encoding="utf-8") as f:
              web = json.load(f)

          name = web.get(
              "name",
              "OBITREND AI Fashion CREATOR"
          )

          short_name = web.get(
              "short_name",
              "OBITREND"
          )

          start_url = web.get(
              "start_url",
              "/"
          )

          display = web.get(
              "display",
              "standalone"
          )

          theme_color = web.get(
              "theme_color",
              "#000000"
          )

          background_color = web.get(
              "background_color",
              "#ffffff"
          )

          icons = web.get("icons", [])

          icon_url = None
          maskable_icon_url = None

          for icon in icons:
              src = icon.get("src")
              purpose = str(icon.get("purpose", ""))

              if not src:
                  continue

              if icon_url is None:
                  icon_url = src

              if "maskable" in purpose and maskable_icon_url is None:
                  maskable_icon_url = src

          if icon_url and icon_url.startswith("/"):
              icon_url = os.environ["APP_URL"] + icon_url

          if maskable_icon_url and maskable_icon_url.startswith("/"):
              maskable_icon_url = os.environ["APP_URL"] + maskable_icon_url

          if not icon_url:
              icon_url = os.environ["APP_URL"] + "/favicon.ico"

          if not maskable_icon_url:
              maskable_icon_url = icon_url

          twa = {
              "packageId": "com.obitrend.app",
              "host": "obitrend.vercel.app",
              "name": name[:50],
              "launcherName": short_name[:12],
              "display": display,
              "themeColor": theme_color,
              "navigationColor": theme_color,
              "backgroundColor": background_color,
              "startUrl": start_url,
              "iconUrl": icon_url,
              "maskableIconUrl": maskable_icon_url,
              "enableNotifications": True,
              "orientation": "portrait",
              "appVersion": "1.0.0",
              "appVersionCode": 1,
              "signingKey": {
                  "path": "./android.keystore",
                  "alias": "android"
              }
          }

          with target_file.open("w", encoding="utf-8") as f:
              json.dump(twa, f, indent=2)

          print("Created:")
          print(target_file)

          print()
          print("TWA MANIFEST:")
          print(json.dumps(twa, indent=2))
          PY

          echo ""
          echo "Validating TWA manifest..."

          python3 -m json.tool \
            "$ANDROID_DIR/twa-manifest.json" \
            >/dev/null

          echo "TWA manifest JSON is valid."

      # ============================================================
      # 9. GENERATE ANDROID PROJECT
      # ============================================================
      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          echo "Generating Android project..."

          bubblewrap update \
            --manifest="$ANDROID_DIR/twa-manifest.json" \
            --skipVersionUpgrade

          echo ""
          echo "Android project generated."

          test -f "$ANDROID_DIR/gradlew"

          chmod +x "$ANDROID_DIR/gradlew"

      # ============================================================
      # 10. ACCEPT ANDROID LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ============================================================
      # 11. BUILD RELEASE APK AND AAB
      # ============================================================
      - name: Build Android APK and AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          chmod +x gradlew

          echo "=========================================="
          echo "BUILDING RELEASE APK"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

          echo ""
          echo "=========================================="
          echo "BUILDING RELEASE AAB"
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            bundleRelease

          echo ""
          echo "Android build completed."

      # ============================================================
      # 12. FIND APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          APK="$(find "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            ! -name "*unsigned*" \
            ! -name "*unaligned*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            echo ""
            echo "Available APK files:"
            find "$ANDROID_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$RELEASE_DIR/OBITREND.apk"

          test -s "$RELEASE_DIR/OBITREND.apk"

      # ============================================================
      # 13. FIND AAB
      # ============================================================
      - name: Locate AAB
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for AAB..."

          AAB="$(find "$ANDROID_DIR/app/build/outputs/bundle" \
            -type f \
            -name "*.aab" \
            ! -name "*unsigned*" \
            | head -n 1)"

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB not found."
            echo ""
            echo "Available AAB files:"
            find "$ANDROID_DIR" -type f -name "*.aab" -print || true
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

          cp "$AAB" "$RELEASE_DIR/OBITREND.aab"

          test -s "$RELEASE_DIR/OBITREND.aab"

      # ============================================================
      # 14. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$RELEASE_DIR/OBITREND.apk"

          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "Testing APK archive..."

          unzip -t "$APK" >/dev/null

          echo "APK archive is valid."

      # ============================================================
      # 15. VERIFY AAB
      # ============================================================
      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$RELEASE_DIR/OBITREND.aab"

          echo "AAB:"
          ls -lh "$AAB"

          echo ""
          echo "Testing AAB archive..."

          unzip -t "$AAB" >/dev/null

          echo "AAB archive is valid."

      # ============================================================
      # 16. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="$RELEASE_DIR/OBITREND.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "Using:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          echo ""
          echo "APK signature verification completed."

      # ============================================================
      # 17. VERIFY AAB SIGNATURE
      # ============================================================
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail

          AAB="$RELEASE_DIR/OBITREND.aab"

          echo "Verifying AAB signature..."

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB"

          echo ""
          echo "AAB signature verification completed."

      # ============================================================
      # 18. SHA256
      # ============================================================
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail

          cd "$RELEASE_DIR"

          sha256sum OBITREND.apk > OBITREND.apk.sha256
          sha256sum OBITREND.aab > OBITREND.aab.sha256

          echo "=========================================="
          echo "RELEASE CHECKSUMS"
          echo "=========================================="

          cat OBITREND.apk.sha256
          cat OBITREND.aab.sha256

      # ============================================================
      # 19. UPLOAD APK + AAB
      # ============================================================
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: release/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 20. COMPLETE
      # ============================================================
      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       OBITREND BUILD COMPLETE"
          echo "=========================================="
          echo ""
          echo "APK:"
          echo "release/OBITREND.apk"
          echo ""
          echo "AAB:"
          echo "release/OBITREND.aab"
          echo ""
          echo "Checksums:"
          echo "release/OBITREND.apk.sha256"
          echo "release/OBITREND.aab.sha256"
          echo ""
          echo "=========================================="
