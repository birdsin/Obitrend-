name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    env:
      APP_URL: https://obitrend.vercel.app
      WEB_MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_PROJECT: android-build

    steps:

      # ---------------------------------------------------------
      # 1. CHECK OUT OBITREND
      # ---------------------------------------------------------
      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. NODE.JS
      # ---------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. JAVA 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # 4. ANDROID SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 5. ACCEPT ANDROID LICENSES
      # ---------------------------------------------------------
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # ---------------------------------------------------------
      # 6. INSTALL REQUIRED ANDROID TOOLS
      # ---------------------------------------------------------
      - name: Install Android build tools
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ---------------------------------------------------------
      # 7. INSTALL BUBBLEWRAP
      # ---------------------------------------------------------
      - name: Install Bubblewrap
        run: |
          npm install --global @bubblewrap/cli

          echo "Bubblewrap version:"
          bubblewrap --version

      # ---------------------------------------------------------
      # 8. CONFIGURE BUBBLEWRAP
      # ---------------------------------------------------------
      - name: Configure Bubblewrap
        run: |
          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME"

      # ---------------------------------------------------------
      # 9. CHECK BUBBLEWRAP ENVIRONMENT
      # ---------------------------------------------------------
      - name: Verify Bubblewrap environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version
          adb version

          bubblewrap doctor

      # ---------------------------------------------------------
      # 10. CHECK SIGNING SECRETS
      # ---------------------------------------------------------
      - name: Check signing secrets
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASS" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing secrets are available."

      # ---------------------------------------------------------
      # 11. PREPARE CLEAN ANDROID DIRECTORY
      # ---------------------------------------------------------
      - name: Prepare Android directory
        run: |
          rm -rf "$ANDROID_PROJECT"
          mkdir -p "$ANDROID_PROJECT"

          echo "Android directory:"
          pwd
          ls -la

      # ---------------------------------------------------------
      # 12. DOWNLOAD OBITREND WEB MANIFEST
      # ---------------------------------------------------------
      - name: Download OBITREND Web Manifest
        run: |
          curl --fail --location \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 60 \
            "$WEB_MANIFEST_URL" \
            --output /tmp/obitrend-web-manifest.json

          echo "Downloaded Web Manifest:"
          cat /tmp/obitrend-web-manifest.json

      # ---------------------------------------------------------
      # 13. VALIDATE WEB MANIFEST
      # ---------------------------------------------------------
      - name: Validate Web Manifest
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/obitrend-web-manifest.json";

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (!data.name) {
            throw new Error("Web Manifest is missing name");
          }

          if (!data.start_url) {
            throw new Error("Web Manifest is missing start_url");
          }

          if (!data.icons || !Array.isArray(data.icons) || data.icons.length === 0) {
            throw new Error("Web Manifest is missing icons");
          }

          console.log("Web Manifest is valid.");
          console.log("Name:", data.name);
          console.log("Start URL:", data.start_url);
          console.log("Icons:", data.icons.length);
          NODE

      # ---------------------------------------------------------
      # 14. CREATE CLEAN TWA MANIFEST
      #
      # IMPORTANT:
      # We DO NOT run:
      #
      # bubblewrap init
      #
      # This completely removes the interactive prompt problem.
      # ---------------------------------------------------------
      - name: Create TWA manifest
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          cat > "$ANDROID_PROJECT/twa-manifest.json" <<'EOF'
          {
            "manifestVersion": "1.0",
            "name": "OBITREND AI Fashion Creator",
            "shortName": "OBITREND",
            "startUrl": "https://obitrend.vercel.app/",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#050505",
            "navigationColor": "#020202",
            "backgroundColor": "#020202",
            "enableNotifications": false,
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "iconUrl": "https://obitrend.vercel.app/icons/icon-512.png",
            "maskableIconUrl": "https://obitrend.vercel.app/icons/icon-512.png",
            "webManifestUrl": "https://obitrend.vercel.app/manifest.webmanifest",
            "packageId": "com.obitrend.app",
            "launcherName": "OBITREND",
            "fullScopeUrl": "https://obitrend.vercel.app/",
            "host": "obitrend.vercel.app",
            "minSdkVersion": 23,
            "signingKey": {
              "alias": "obitrend",
              "path": "android-keystore.keystore"
            },
            "features": {
              "locationDelegation": {
                "enabled": false
              },
              "playBilling": {
                "enabled": false
              },
              "notificationDelegation": {
                "enabled": false
              }
            }
          }
          EOF

          echo "TWA manifest created:"
          cat "$ANDROID_PROJECT/twa-manifest.json"

      # ---------------------------------------------------------
      # 15. CREATE SIGNING KEY
      # ---------------------------------------------------------
      - name: Create signing key
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          KEYSTORE="$ANDROID_PROJECT/android-keystore.keystore"

          if [ -f "$KEYSTORE" ]; then
            echo "Keystore already exists."
            exit 0
          fi

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -alias obitrend \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

          echo "Signing key created successfully."

      # ---------------------------------------------------------
      # 16. CREATE ANDROID PROJECT
      #
      # NO bubblewrap init.
      # NO expect.
      # NO interactive questions.
      # ---------------------------------------------------------
      - name: Create Bubblewrap Android project
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          echo "Creating Android project from twa-manifest.json..."

          bubblewrap update \
            --skipVersionUpgrade \
            --manifest="$PWD/twa-manifest.json" \
            --directory="$PWD"

          echo "Bubblewrap Android project created."

          test -f "gradlew"

          chmod +x gradlew

          echo "Generated project:"
          ls -la

      # ---------------------------------------------------------
      # 17. VERIFY PROJECT
      # ---------------------------------------------------------
      - name: Verify Android project
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          test -f gradlew
          test -f twa-manifest.json
          test -f android-keystore.keystore

          echo "Android project verified."

      # ---------------------------------------------------------
      # 18. BUILD APK + AAB
      # ---------------------------------------------------------
      - name: Build APK and AAB
        working-directory: ${{ env.ANDROID_PROJECT }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --manifest="$PWD/twa-manifest.json" \
            --signingKeyPath="$PWD/android-keystore.keystore" \
            --signingKeyAlias="obitrend" \
            --skipPwaValidation

      # ---------------------------------------------------------
      # 19. VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          test -f app-release-signed.apk

          echo "APK successfully created:"
          ls -lh app-release-signed.apk

      # ---------------------------------------------------------
      # 20. VERIFY AAB
      # ---------------------------------------------------------
      - name: Verify AAB
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          test -f app-release-bundle.aab

          echo "AAB successfully created:"
          ls -lh app-release-bundle.aab

      # ---------------------------------------------------------
      # 21. UPLOAD APK + AAB
      # ---------------------------------------------------------
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-APK-and-AAB
          if-no-files-found: error
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab

      # ---------------------------------------------------------
      # 22. BUILD COMPLETE
      # ---------------------------------------------------------
      - name: Build complete
        run: |
          echo "=========================================="
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "=========================================="
          echo "APK: app-release-signed.apk"
          echo "AAB: app-release-bundle.aab"
          echo "Package: com.obitrend.app"
          echo "Website: https://obitrend.vercel.app"
          echo "=========================================="
