name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK ready."

      - name: Install required tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y jq curl expect

          echo "Required tools installed."

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install -g @bubblewrap/cli@1.25.0 --ignore-scripts

          echo "Bubblewrap installed."

          which bubblewrap

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          test -f "$HOME/.bubblewrap/config.json"

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          java -version

          test -d "$JAVA_HOME"
          test -d "$ANDROID_SDK_ROOT"
          test -f "$HOME/.bubblewrap/config.json"

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Check signing secrets
        shell: bash
        run: |
          set -e

          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets found."

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/android-build"

          mkdir -p "$GITHUB_WORKSPACE/android-build"

          echo "Android directory:"
          ls -ld "$GITHUB_WORKSPACE/android-build"

      - name: Download OBITREND manifest
        shell: bash
        run: |
          set -e

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 60 \
            -A "Mozilla/5.0" \
            "https://obitrend.vercel.app/manifest.webmanifest" \
            -o "$GITHUB_WORKSPACE/android-build/source-manifest.webmanifest"

          test -s "$GITHUB_WORKSPACE/android-build/source-manifest.webmanifest"

          echo "Manifest downloaded."

      - name: Validate OBITREND manifest
        shell: bash
        run: |
          set -e

          jq empty \
            "$GITHUB_WORKSPACE/android-build/source-manifest.webmanifest"

          echo "Manifest JSON is valid."

      - name: Create clean manifest
        shell: bash
        run: |
          set -e

          jq '
            .name = "OBITREND AI Fashion Creator"
            |
            .short_name = "OBITREND"
            |
            .description = "AI-powered fashion creation studio."
            |
            .id = "/"
            |
            .start_url = "/"
            |
            .scope = "/"
            |
            .display = "standalone"
            |
            .orientation = "portrait"
            |
            .theme_color = "#050505"
            |
            .background_color = "#020204"
          ' \
          "$GITHUB_WORKSPACE/android-build/source-manifest.webmanifest" \
          > "$GITHUB_WORKSPACE/android-build/manifest.webmanifest"

          jq empty \
            "$GITHUB_WORKSPACE/android-build/manifest.webmanifest"

          echo "Clean manifest created."

      - name: Create Bubblewrap Android project
        working-directory: android-build
        shell: bash
        timeout-minutes: 20
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo "Starting Bubblewrap initialization."

          cat > /tmp/obitrend-bubblewrap.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 1200

          spawn bubblewrap init --manifest="https://obitrend.vercel.app/manifest.webmanifest"

          expect {
            -nocase -re {Do you want Bubblewrap to install the JDK.*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {Path to your existing JDK.*} {
              send -- "$env(JAVA_HOME)\r"
              exp_continue
            }

            -nocase -re {Do you want Bubblewrap to install the Android SDK.*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {Path to your existing Android SDK.*} {
              send -- "$env(ANDROID_SDK_ROOT)\r"
              exp_continue
            }

            -nocase -re {Domain.*} {
              send -- "obitrend.vercel.app\r"
              exp_continue
            }

            -nocase -re {URL path.*} {
              send -- "/\r"
              exp_continue
            }

            -nocase -re {Application name.*} {
              send -- "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            -nocase -re {Short name.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Application ID.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {Package ID.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {Version code.*} {
              send -- "1\r"
              exp_continue
            }

            -nocase -re {Display mode.*} {
              send -- "standalone\r"
              exp_continue
            }

            -nocase -re {Orientation.*} {
              send -- "portrait\r"
              exp_continue
            }

            -nocase -re {Status bar color.*} {
              send -- "#050505\r"
              exp_continue
            }

            -nocase -re {Theme color.*} {
              send -- "#050505\r"
              exp_continue
            }

            -nocase -re {Navigation bar color.*} {
              send -- "#020204\r"
              exp_continue
            }

            -nocase -re {Background color.*} {
              send -- "#020204\r"
              exp_continue
            }

            -nocase -re {Icon URL.*} {
              send -- "https://obitrend.vercel.app/icons/icon-512.png\r"
              exp_continue
            }

            -nocase -re {Maskable icon URL.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {Key path.*} {
              send -- "obitrend.keystore\r"
              exp_continue
            }

            -nocase -re {Key alias.*} {
              send -- "obitrend\r"
              exp_continue
            }

            -nocase -re {Do you want to create.*key.*now.*} {
              send -- "y\r"
              exp_continue
            }

            -nocase -re {Full Name.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Organizational Unit.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Organization.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Country.*} {
              send -- "NG\r"
              exp_continue
            }

            -nocase -re {Keystore Password.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {Key Password.*} {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            eof {
              catch wait result
              set code [lindex $result 3]
              exit $code
            }

            timeout {
              puts stderr "ERROR: Bubblewrap initialization timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-bubblewrap.exp

          /tmp/obitrend-bubblewrap.exp

          echo "Bubblewrap initialization finished."

          test -f "twa-manifest.json"

          echo "twa-manifest.json created successfully."

      - name: Verify generated project
        working-directory: android-build
        shell: bash
        run: |
          set -e

          test -f "twa-manifest.json"

          echo "Generated Bubblewrap project:"
          find . -maxdepth 3 -type f | sort

      - name: Build Android APK and AAB
        working-directory: android-build
        shell: bash
        timeout-minutes: 30
        run: |
          set -e

          echo "Building OBITREND Android application."

          bubblewrap build

          echo "Android build completed."

      - name: Verify APK and AAB
        working-directory: android-build
        shell: bash
        run: |
          set -e

          echo "Searching for APK and AAB."

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

          APK_FILE="$(find . -type f -name "*signed*.apk" | head -n 1)"
          AAB_FILE="$(find . -type f -name "*.aab" | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Signed APK was not generated."
            exit 1
          fi

          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "AAB found:"
          echo "$AAB_FILE"

          ls -lh "$APK_FILE"
          ls -lh "$AAB_FILE"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-APK-and-AAB
          path: |
            android-build/**/*.apk
            android-build/**/*.aab
          if-no-files-found: error

      - name: Build complete
        shell: bash
        run: |
          echo "========================================"
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "========================================"
