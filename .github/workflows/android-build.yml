name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE.JS
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK packages installed."

      # =========================================================
      # 5. CONFIGURE BUBBLEWRAP BEFORE IT IS USED
      # =========================================================
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # Bubblewrap otherwise asks:
      #
      # Do you want Bubblewrap to install the JDK?
      #
      # GitHub Actions cannot answer that interactive prompt.
      #
      # =========================================================

      - name: Configure Bubblewrap environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING BUBBLEWRAP"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is empty."
            exit 1
          fi

          if [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME does not exist:"
            echo "$JAVA_HOME"
            exit 1
          fi

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: Android SDK does not exist:"
            echo "$SDK_PATH"
            exit 1
          fi

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

          echo ""
          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$SDK_PATH"

          echo ""
          echo "Java version:"
          java -version

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP ENVIRONMENT READY"
          echo "=========================================="

      # =========================================================
      # 6. INSTALL BUBBLEWRAP
      # =========================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING BUBBLEWRAP"
          echo "=========================================="

          npm install -g @bubblewrap/cli

          echo ""
          echo "Bubblewrap version:"
          bubblewrap --version

          echo ""
          echo "Running Bubblewrap doctor..."

          bubblewrap doctor

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP IS READY"
          echo "=========================================="

      # =========================================================
      # 7. VERIFY WEB MANIFEST
      # =========================================================

      - name: Verify Web Manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING WEB MANIFEST"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";

          let manifest;

          try {
            manifest = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            console.error(
              "ERROR: manifest.webmanifest is invalid JSON."
            );
            console.error(error.message);
            process.exit(1);
          }

          console.log("Manifest JSON: VALID");
          console.log("name:", manifest.name);
          console.log("short_name:", manifest.short_name);
          console.log("start_url:", manifest.start_url);
          console.log("display:", manifest.display);

          if (!manifest.name) {
            throw new Error(
              "Manifest is missing name."
            );
          }

          if (!manifest.start_url) {
            throw new Error(
              "Manifest is missing start_url."
            );
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error(
              "Manifest has no icons."
            );
          }

          const base =
            "https://obitrend.vercel.app/manifest.webmanifest";

          const startUrl =
            new URL(
              manifest.start_url,
              base
            );

          console.log(
            "Resolved start URL:",
            startUrl.href
          );

          for (
            const [index, icon]
            of manifest.icons.entries()
          ) {
            if (!icon || !icon.src) {
              throw new Error(
                `Icon ${index} has no src.`
              );
            }

            const iconUrl =
              new URL(
                icon.src,
                base
              );

            if (
              !["http:", "https:"].includes(
                iconUrl.protocol
              )
            ) {
              throw new Error(
                `Icon ${index} has invalid URL.`
              );
            }

            console.log(
              `Icon ${index}:`,
              iconUrl.href
            );
          }

          console.log(
            "MANIFEST VALIDATION: PASSED"
          );
          NODE

      # =========================================================
      # 8. PREPARE ANDROID DIRECTORY
      # =========================================================

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

      # =========================================================
      # 9. CREATE BUBBLEWRAP PROJECT
      # =========================================================

      - name: Create Bubblewrap Android project
        shell: bash
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
          ANDROID_DIR: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING OBITREND ANDROID PROJECT"
          echo "=========================================="

          cd "$ANDROID_DIR"

          sudo apt-get update -y

          sudo apt-get install -y expect

          cat > /tmp/obitrend-bubblewrap.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 900

          set manifest $env(MANIFEST_URL)
          set android_dir $env(ANDROID_DIR)

          cd $android_dir

          spawn npx --yes @bubblewrap/cli init --manifest=$manifest

          # -----------------------------------------------------
          # APPLICATION NAME
          # -----------------------------------------------------

          expect {
            -re {Application name:} {
              send "OBITREND AI Fashion Creator\r"
            }
          }

          # -----------------------------------------------------
          # SHORT NAME
          # -----------------------------------------------------

          expect {
            -re {Short name:} {
              send "OBITREND\r"
            }
          }

          # -----------------------------------------------------
          # APPLICATION ID
          # -----------------------------------------------------

          expect {
            -re {Application ID:} {
              send "ai.obitrend.app\r"
            }
          }

          # -----------------------------------------------------
          # VERSION CODE
          # -----------------------------------------------------

          expect {
            -re {Starting version code} {
              send "1\r"
            }
          }

          # -----------------------------------------------------
          # DISPLAY MODE
          # -----------------------------------------------------

          expect {
            -re {Display mode:} {
              send "\r"
            }
          }

          # -----------------------------------------------------
          # ORIENTATION
          # -----------------------------------------------------

          expect {
            -re {Orientation:} {
              send "portrait\r"
            }
          }

          # -----------------------------------------------------
          # STATUS BAR COLOR
          # -----------------------------------------------------

          expect {
            -re {Status bar color:} {
              send "#111827\r"
            }
          }

          # -----------------------------------------------------
          # SPLASH SCREEN COLOR
          # -----------------------------------------------------

          expect {
            -re {Splash screen color:} {
              send "#111827\r"
            }
          }

          # -----------------------------------------------------
          # ICON
          # -----------------------------------------------------

          expect {
            -re {URL to an image that is at least 512x512px:} {
              send "\r"
            }
          }

          # -----------------------------------------------------
          # MASKABLE ICON
          # -----------------------------------------------------

          expect {
            -re {maskable icons} {
              send "\r"
            }
          }

          # -----------------------------------------------------
          # MONOCHROME ICON
          # -----------------------------------------------------

          expect {
            -re {monochrome icons} {
              send "\r"
            }
          }

          # -----------------------------------------------------
          # SHORTCUTS
          # -----------------------------------------------------

          expect {
            -re {Include app shortcuts} {
              send "n\r"
            }
          }

          # -----------------------------------------------------
          # PLAY BILLING
          # -----------------------------------------------------

          expect {
            -re {Include support for Play Billing} {
              send "n\r"
            }
          }

          # -----------------------------------------------------
          # GEOLOCATION
          # -----------------------------------------------------

          expect {
            -re {Request geolocation permission} {
              send "n\r"
            }
          }

          # -----------------------------------------------------
          # KEY PATH
          # -----------------------------------------------------

          expect {
            -re {Key path:} {
              send "./android.keystore\r"
            }
          }

          # -----------------------------------------------------
          # KEY ALIAS
          # -----------------------------------------------------

          expect {
            -re {Key alias:} {
              send "obitrend\r"
            }
          }

          # -----------------------------------------------------
          # FINISH
          # -----------------------------------------------------

          expect {
            eof {
              catch wait result

              set exit_code [lindex $result 3]

              if {$exit_code != 0} {
                puts "ERROR: Bubblewrap init failed."
                exit $exit_code
              }

              exit 0
            }

            timeout {
              puts "ERROR: Bubblewrap init timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-bubblewrap.exp

          /usr/bin/expect \
            /tmp/obitrend-bubblewrap.exp

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP PROJECT CREATED"
          echo "=========================================="

          test -f "$ANDROID_DIR/twa-manifest.json"
          test -f "$ANDROID_DIR/gradlew"

          echo "twa-manifest.json: FOUND"
          echo "gradlew: FOUND"

      # =========================================================
      # 10. CREATE SIGNING KEY
      # =========================================================

      - name: Create OBITREND signing keystore
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING OBITREND SIGNING KEY"
          echo "=========================================="

          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ "${#SIGNING_PASSWORD}" -lt 6 ]; then
            echo "ERROR: Signing password is too short."
            exit 1
          fi

          rm -f "$ANDROID_DIR/android.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$ANDROID_DIR/android.keystore" \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias obitrend \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

          echo ""
          echo "Testing
