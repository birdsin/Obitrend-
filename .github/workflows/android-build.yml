name: Build OBITREND Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      APP_URL: https://obitrend.vercel.app
      ANDROID_PROJECT: android-build

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ============================================================
      # 2. NODE 22
      # ============================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. ANDROID BUILD TOOLS
      # ============================================================

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 6. VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "OBITREND ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          java -version
          adb version
          sdkmanager --version

      # ============================================================
      # 7. INSTALL BUBBLEWRAP
      # ============================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          npm install --global @bubblewrap/cli@1.25.0 --ignore-scripts

          echo "Bubblewrap version:"
          

          echo "Bubblewrap location:"
          command -v bubblewrap

            # ============================================================
      # 8. CONFIGURE BUBBLEWRAP
      # ============================================================

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING BUBBLEWRAP"
          echo "=========================================="

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          # Verify Java exists.
          test -d "$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"

          # Verify Android SDK exists.
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          echo ""
          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "Verifying Bubblewrap config..."

          node <<'NODE'
          const fs = require("fs");

          const file =
            process.env.HOME + "/.bubblewrap/config.json";

          const config =
            JSON.parse(fs.readFileSync(file, "utf8"));

          if (!config.jdkPath) {
            throw new Error("Bubblewrap jdkPath is missing.");
          }

          if (!config.androidSdkPath) {
            throw new Error(
              "Bubblewrap androidSdkPath is missing."
            );
          }

          if (!fs.existsSync(config.jdkPath)) {
            throw new Error(
              `JDK path does not exist: ${config.jdkPath}`
            );
          }

          if (!fs.existsSync(config.androidSdkPath)) {
            throw new Error(
              `Android SDK path does not exist: ${config.androidSdkPath}`
            );
          }

          console.log(
            "JDK path verified:",
            config.jdkPath
          );

          console.log(
            "Android SDK path verified:",
            config.androidSdkPath
          );

          console.log(
            "Bubblewrap configuration is valid."
          );
          NODE

      # ============================================================
      # 9. CHECK SIGNING SECRETS
      # ============================================================

      - name: Check signing secrets
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing secrets are present."

      # ============================================================
      # 10. PREPARE PROJECT DIRECTORY
      # ============================================================

      - name: Prepare Android project directory
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/$ANDROID_PROJECT"

          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"

          echo "Android project:"
          echo "$PROJECT"

          test -d "$PROJECT"

            # ============================================================
      # 13. INSTALL EXPECT
      # ============================================================

      - name: Install Expect
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y expect

          echo "Expect installed successfully."
                
                # ============================================================
# 14. CREATE BUBBLEWRAP PROJECT
# ============================================================

      - name: Create Bubblewrap Android project
        shell: bash
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/$ANDROID_PROJECT"
          MANIFEST_URL="https://obitrend.vercel.app/manifest.webmanifest"

          echo "=============================================="
          echo "CREATING OBITREND ANDROID PROJECT"
          echo "=============================================="
          echo "Project: $PROJECT"
          echo "Manifest: $MANIFEST_URL"

          rm -rf "$PROJECT"
          mkdir -p "$PROJECT"

          echo ""
          echo "Checking OBITREND manifest..."

          curl --fail --silent --show-error --location \
            "$MANIFEST_URL" \
            -o /tmp/obitrend-live-manifest.json

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/obitrend-live-manifest.json";

          const manifest = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (!manifest.name) {
            throw new Error("Manifest name is missing.");
          }

          if (!manifest.short_name) {
            throw new Error("Manifest short_name is missing.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest start_url is missing.");
          }

          if (!manifest.scope) {
            throw new Error("Manifest scope is missing.");
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error("Manifest icons are missing.");
          }

          for (const icon of manifest.icons) {
            if (!icon.src) {
              throw new Error("Manifest icon src is missing.");
            }

            new URL(icon.src);
          }

          console.log("Manifest validation successful.");
          console.log("Name:", manifest.name);
          console.log("Short name:", manifest.short_name);
          console.log("Start URL:", manifest.start_url);
          console.log("Scope:", manifest.scope);
          NODE

          echo ""
          echo "Checking Bubblewrap environment..."

          bubblewrap doctor

          echo ""
          echo "Starting Bubblewrap initialization..."

          cat > /tmp/obitrend-bubblewrap.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 900

          set manifest $env(MANIFEST_URL)
          set project $env(PROJECT)
          set ks_pass $env(KS_PASS)
          set key_pass $env(KEY_PASS)

          spawn bubblewrap init \
            --manifest="$manifest" \
            --directory="$project"

          expect {
            -re {.*install the JDK.*} {
              send "n\r"
              exp_continue
            }

            -re {.*use your own JDK.*} {
              send "y\r"
              exp_continue
            }

            -re {.*Path to your existing JDK.*} {
              send "$env(JAVA_HOME)\r"
              exp_continue
            }

            -re {.*install the Android SDK.*} {
              send "n\r"
              exp_continue
            }

            -re {.*use your own Android SDK.*} {
              send "y\r"
              exp_continue
            }

            -re {.*Path to your existing Android SDK.*} {
              send "$env(ANDROID_HOME)\r"
              exp_continue
            }

            -re {.*Directory.*does not exist.*} {
              send "y\r"
              exp_continue
            }

            -re {.*Application name.*} {
              send "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            -re {.*Short name.*} {
              send "OBITREND\r"
              exp_continue
            }

            -re {.*Package ID.*} {
              send "com.obitrend.ai\r"
              exp_continue
            }

            -re {.*App Version.*} {
              send "1\r"
              exp_continue
            }

            -re {.*App Version Name.*} {
              send "1.0.0\r"
              exp_continue
            }

            -re {.*Display mode.*} {
              send "standalone\r"
              exp_continue
            }

            -re {.*Orientation.*} {
              send "portrait\r"
              exp_continue
            }

            -re {.*Theme color.*} {
              send "#050505\r"
              exp_continue
            }

            -re {.*Background color.*} {
              send "#050505\r"
              exp_continue
            }

            -re {.*Icon URL.*} {
              send "https://obitrend.vercel.app/icons/icon-512.png\r"
              exp_continue
            }

            -re {.*Maskable icon URL.*} {
              send "\r"
              exp_continue
            }

            -re {.*Start URL.*} {
              send "https://obitrend.vercel.app/\r"
              exp_continue
            }

            -re {.*Scope.*} {
              send "https://obitrend.vercel.app/\r"
              exp_continue
            }

            -re {.*create.*signing key.*} {
              send "y\r"
              exp_continue
            }

            -re {.*overwrite.*} {
              send "y\r"
              exp_continue
            }

            -re {.*Keystore password.*} {
              send "$ks_pass\r"
              exp_continue
            }

            -re {.*Key password.*} {
              send "$key_pass\r"
              exp_continue
            }

            eof {
              catch wait result

              set exit_code [lindex $result 3]

              if {$exit_code != 0} {
                puts stderr "Bubblewrap init failed."
                exit $exit_code
              }

              exit 0
            }

            timeout {
              puts stderr "ERROR: Bubblewrap initialization timed out."
              exit 1
            }

            default {
              exp_continue
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-bubblewrap.exp

          export MANIFEST_URL
          export PROJECT

          /tmp/obitrend-bubblewrap.exp

          echo ""
          echo "Bubblewrap initialization finished."

          test -f "$PROJECT/twa-manifest.json"

          echo ""
          echo "Generated twa-manifest.json:"
          cat "$PROJECT/twa-manifest.json"

          echo ""
          echo "=============================================="
          echo "BUBBLEWRAP PROJECT CREATED SUCCESSFULLY"
          echo "=============================================="

      # ============================================================
      # 15. VERIFY GENERATED PROJECT
      # ============================================================

      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$GITHUB_WORKSPACE/$ANDROID_PROJECT"

          echo "=========================================="
          echo "VERIFYING GENERATED ANDROID PROJECT"
          echo "=========================================="

          test -d "$PROJECT"
          test -f "$PROJECT/twa-manifest.json"

          echo ""
          echo "Generated project files:"
          find "$PROJECT" -maxdepth 3 -type f | sort

          echo ""
          echo "twa-manifest.json:"
          cat "$PROJECT/twa-manifest.json"

      # ============================================================
      # 16. BUILD APK AND AAB
      # ============================================================

      - name: Build Android APK and AAB
        shell: bash
        working-directory: android-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING OBITREND APK AND AAB"
          echo "=========================================="

          bubblewrap build \
            --skipPwaValidation

      # ============================================================
      # 17. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
              -type f | sort

            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ============================================================
      # 18. VERIFY AAB
      # ============================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$(
            find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
              -type f \
              -name "*.aab" \
              | head -n 1
          )"

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."

            find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
              -type f | sort

            exit 1
          fi

          echo "AAB successfully generated:"
          ls -lh "$AAB"

      # ============================================================
      # 19. UPLOAD APK AND AAB
      # ============================================================

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android
          path: |
            android-build/**/*.apk
            android-build/**/*.aab
          if-no-files-found: error

      # ============================================================
      # 20. BUILD COMPLETE
      # ============================================================

      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "=========================================="

          echo ""
          echo "APK:"
          find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "AAB:"
          find "$GITHUB_WORKSPACE/$ANDROID_PROJECT" \
            -type f \
            -name "*.aab" \
            -print
