name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE.JS
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK packages installed."

      # =========================================================
      # 5. CONFIGURE BUBBLEWRAP BEFORE IT IS USED
      # =========================================================
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # Bubblewrap otherwise asks:
      #
      # Do you want Bubblewrap to install the JDK?
      #
      # GitHub Actions cannot answer that interactive prompt.
      #
      # =========================================================

      - name: Configure Bubblewrap environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING BUBBLEWRAP"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is empty."
            exit 1
          fi

          if [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME does not exist:"
            echo "$JAVA_HOME"
            exit 1
          fi

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: Android SDK does not exist:"
            echo "$SDK_PATH"
            exit 1
          fi

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

          echo ""
          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$SDK_PATH"

          echo ""
          echo "Java version:"
          java -version

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP ENVIRONMENT READY"
          echo "=========================================="

      # =========================================================
      # 6. INSTALL BUBBLEWRAP
      # =========================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING BUBBLEWRAP"
          echo "=========================================="

          npm install -g @bubblewrap/cli

          echo ""
          echo "Bubblewrap version:"
          bubblewrap --version

          echo ""
          echo "Running Bubblewrap doctor..."

          bubblewrap doctor

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP IS READY"
          echo "=========================================="

      # =========================================================
      # 7. VERIFY WEB MANIFEST
      # =========================================================

      - name: Verify Web Manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING WEB MANIFEST"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";

          let manifest;

          try {
            manifest = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            console.error(
              "ERROR: manifest.webmanifest is invalid JSON."
            );
            console.error(error.message);
            process.exit(1);
          }

          console.log("Manifest JSON: VALID");
          console.log("name:", manifest.name);
          console.log("short_name:", manifest.short_name);
          console.log("start_url:", manifest.start_url);
          console.log("display:", manifest.display);

          if (!manifest.name) {
            throw new Error(
              "Manifest is missing name."
            );
          }

          if (!manifest.start_url) {
            throw new Error(
              "Manifest is missing start_url."
            );
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error(
              "Manifest has no icons."
            );
          }

          const base =
            "https://obitrend.vercel.app/manifest.webmanifest";

          const startUrl =
            new URL(
              manifest.start_url,
              base
            );

          console.log(
            "Resolved start URL:",
            startUrl.href
          );

          for (
            const [index, icon]
            of manifest.icons.entries()
          ) {
            if (!icon || !icon.src) {
              throw new Error(
                `Icon ${index} has no src.`
              );
            }

            const iconUrl =
              new URL(
                icon.src,
                base
              );

            if (
              !["http:", "https:"].includes(
                iconUrl.protocol
              )
            ) {
              throw new Error(
                `Icon ${index} has invalid URL.`
              );
            }

            console.log(
              `Icon ${index}:`,
              iconUrl.href
            );
          }

          console.log(
            "MANIFEST VALIDATION: PASSED"
          );
          NODE

      # =========================================================
      # 8. PREPARE ANDROID DIRECTORY
      # =========================================================

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

            # =========================================================
      # 9. CREATE BUBBLEWRAP PROJECT
      # =========================================================
      #
      # IMPORTANT:
      # Do NOT use "bubblewrap init" here.
      #
      # init is interactive and can hang GitHub Actions.
      #
      # We create twa-manifest.json directly and then use
      # Bubblewrap UPDATE to generate the Android project.
      #
      # =========================================================

      - name: Create Bubblewrap Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING OBITREND BUBBLEWRAP PROJECT"
          echo "=========================================="

          cd "$ANDROID_DIR"

          echo "Downloading Web Manifest..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          echo "Web Manifest downloaded."

          # -----------------------------------------------------
          # CREATE twa-manifest.json
          # -----------------------------------------------------

          node <<'NODE'
          const fs = require("fs");

          const source =
            JSON.parse(
              fs.readFileSync(
                "/tmp/manifest.webmanifest",
                "utf8"
              )
            );

          const manifestUrl =
            process.env.MANIFEST_URL;

          const manifestBase =
            new URL(manifestUrl);

          // ---------------------------------------------------
          // HOST
          // ---------------------------------------------------

          const host =
            manifestBase.host;

          // ---------------------------------------------------
          // START URL
          // ---------------------------------------------------

          const startUrl =
            new URL(
              source.start_url || "/",
              manifestUrl
            );

          // ---------------------------------------------------
          // SCOPE
          // ---------------------------------------------------

          const scopeUrl =
            new URL(
              source.scope || "/",
              manifestUrl
            );

          // ---------------------------------------------------
          // FIND NORMAL ICON
          // ---------------------------------------------------

          if (
            !Array.isArray(source.icons) ||
            source.icons.length === 0
          ) {
            throw new Error(
              "Web Manifest contains no icons."
            );
          }

          function findIcon(purpose) {
            return source.icons.find(icon => {
              if (!icon || !icon.src) {
                return false;
              }

              if (!purpose) {
                return true;
              }

              const purposes =
                String(
                  icon.purpose || "any"
                )
                .split(/\s+/);

              return purposes.includes(
                purpose
              );
            });
          }

          const normalIcon =
            findIcon("any") ||
            source.icons[0];

          if (
            !normalIcon ||
            !normalIcon.src
          ) {
            throw new Error(
              "No usable application icon found."
            );
          }

          const iconUrl =
            new URL(
              normalIcon.src,
              manifestUrl
            ).href;

          // ---------------------------------------------------
          // MASKABLE ICON
          // ---------------------------------------------------

          const maskableIcon =
            findIcon("maskable");

          const maskableIconUrl =
            maskableIcon &&
            maskableIcon.src
              ? new URL(
                  maskableIcon.src,
                  manifestUrl
                ).href
              : undefined;

          // ---------------------------------------------------
          // BUILD TWA MANIFEST
          // ---------------------------------------------------

          const twaManifest = {
            packageId:
              "ai.obitrend.app",

            host,

            name:
              source.name ||
              "OBITREND AI Fashion Creator",

            launcherName:
              source.short_name ||
              "OBITREND",

            display:
              source.display ||
              "standalone",

            themeColor:
              source.theme_color ||
              "#111827",

            themeColorDark:
              source.theme_color ||
              "#111827",

            navigationColor:
              source.background_color ||
              "#111827",

            navigationColorDark:
              source.background_color ||
              "#111827",

            navigationDividerColor:
              "#00000000",

            navigationDividerColorDark:
              "#00000000",

            backgroundColor:
              source.background_color ||
              "#111827",

            startUrl:
              startUrl.pathname +
              startUrl.search +
              startUrl.hash,

            iconUrl,

            ...(maskableIconUrl
              ? {
                  maskableIconUrl
                }
              : {}),

            splashScreenFadeOutDuration:
              300,

            signingKey: {
              path:
                "./android.keystore",
              alias:
                "obitrend"
            },

            appVersionCode:
              1,

            appVersion:
              "1",

            generatorApp:
              "bubblewrap-cli",

            webManifestUrl:
              manifestUrl,

            fallbackType:
              "customtabs",

            features: {},

            alphaDependencies: {
              enabled: false
            },

            enableSiteSettingsShortcut:
              false,

            isChromeOSOnly:
              false,

            isMetaQuest:
              false,

            fullScopeUrl:
              scopeUrl.href,

            minSdkVersion:
              23,

            shortcuts: [],

            fingerprints: [],

            additionalTrustedOrigins: [],

            retainedBundles: [],

            orientation:
              source.orientation ||
              "portrait"
          };

          fs.writeFileSync(
            "twa-manifest.json",
            JSON.stringify(
              twaManifest,
              null,
              2
            ) + "\n"
          );

          console.log(
            "=========================================="
          );

          console.log(
            "twa-manifest.json CREATED"
          );

          console.log(
            "=========================================="
          );

          console.log(
            JSON.stringify(
              twaManifest,
              null,
              2
            )
          );
          NODE

          # -----------------------------------------------------
          # VERIFY TWA MANIFEST
          # -----------------------------------------------------

          echo ""
          echo "Checking twa-manifest.json..."

          test \
            -f \
            "$ANDROID_DIR/twa-manifest.json"

          node <<'NODE'
          const fs = require("fs");

          const file =
            process.env.ANDROID_DIR +
            "/twa-manifest.json";

          const manifest =
            JSON.parse(
              fs.readFileSync(
                file,
                "utf8"
              )
            );

          const required = [
            "packageId",
            "host",
            "name",
            "launcherName",
            "startUrl",
            "iconUrl",
            "signingKey"
          ];

          for (
            const field of required
          ) {
            if (
              !manifest[field]
            ) {
              throw new Error(
                `Missing twa-manifest field: ${field}`
              );
            }
          }

          if (
            !manifest.signingKey.path
          ) {
            throw new Error(
              "Signing key path missing."
            );
          }

          if (
            !manifest.signingKey.alias
          ) {
            throw new Error(
              "Signing key alias missing."
            );
          }

          console.log(
            "twa-manifest.json: VALID"
          );

          console.log(
            "Package:",
            manifest.packageId
          );

          console.log(
            "Host:",
            manifest.host
          );

          console.log(
            "Start URL:",
            manifest.startUrl
          );

          console.log(
            "Signing key:",
            manifest.signingKey.path
          );

          console.log(
            "Signing alias:",
            manifest.signingKey.alias
          );
          NODE

          # -----------------------------------------------------
          # GENERATE ANDROID PROJECT
          # -----------------------------------------------------

          echo ""
          echo "=========================================="
          echo "GENERATING ANDROID PROJECT"
          echo "=========================================="

          npx --yes @bubblewrap/cli update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP PROJECT GENERATED"
          echo "=========================================="

          # -----------------------------------------------------
          # VERIFY GENERATED FILES
          # -----------------------------------------------------

          if [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "ERROR: gradlew was not generated."
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json is missing."
            exit 1
          fi

          chmod +x \
            "$ANDROID_DIR/gradlew"

          echo ""
          echo "gradlew: FOUND"
          echo "twa-manifest.json: FOUND"

          echo ""
          echo "Generated Android files:"

          find \
            "$ANDROID_DIR" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -150

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT READY"
          echo "=========================================="

      # =========================================================
      # 10. CREATE SIGNING KEY
      # =========================================================

      - name: Create OBITREND signing keystore
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING OBITREND SIGNING KEY"
          echo "=========================================="

          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ "${#SIGNING_PASSWORD}" -lt 6 ]; then
            echo "ERROR: Signing password is too short."
            exit 1
          fi

          rm -f "$ANDROID_DIR/android.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$ANDROID_DIR/android.keystore" \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias obitrend \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

          echo ""
          echo "Testing
