name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK installation complete."

      - name: Validate secrets
        shell: bash
        run: |
          set -e

          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD secret is missing."
            exit 1
          fi

          if [ "${#BUBBLEWRAP_KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD must contain at least 6 characters."
            exit 1
          fi

          if [ "${#BUBBLEWRAP_KEY_PASSWORD}" -lt 6 ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD must contain at least 6 characters."
            exit 1
          fi

          echo "Required signing secrets are available."

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install -g @bubblewrap/cli@1.25.0

          echo "Bubblewrap installed."

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          test -d "$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"

          test -d "$ANDROID_SDK_ROOT"

          echo "Bubblewrap configuration is valid."

      - name: Verify Java
        shell: bash
        run: |
          set -e
          java -version

      - name: Verify Bubblewrap
        shell: bash
        run: |
          set -e

          echo "Bubblewrap version:"
          bubblewrap --version

          echo "Bubblewrap doctor:"
          bubblewrap doctor

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          rm -rf android-build
          mkdir -p android-build

      - name: Install Expect
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y expect

      - name: Generate Android project
        shell: bash
        timeout-minutes: 20
        run: |
          set -e

          cat > /tmp/obitrend-init.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 1200

          set manifest "https://obitrend.vercel.app/manifest.webmanifest"
          set directory "$env(GITHUB_WORKSPACE)/android-build"

          spawn bubblewrap init \
            --manifest="$manifest" \
            --directory="$directory"

          expect {
            -nocase -re {application name.*} {
              send -- "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            -nocase -re {short name.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {package id.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {application id.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {domain.*} {
              send -- "obitrend.vercel.app\r"
              exp_continue
            }

            -nocase -re {url path.*} {
              send -- "/\r"
              exp_continue
            }

            -nocase -re {version code.*} {
              send -- "1\r"
              exp_continue
            }

            -nocase -re {version name.*} {
              send -- "1.0.0\r"
              exp_continue
            }

            -nocase -re {display mode.*} {
              send -- "standalone\r"
              exp_continue
            }

            -nocase -re {orientation.*} {
              send -- "portrait\r"
              exp_continue
            }

            -nocase -re {theme color.*} {
              send -- "#050505\r"
              exp_continue
            }

            -nocase -re {background color.*} {
              send -- "#020204\r"
              exp_continue
            }

            -nocase -re {icon url.*} {
              send -- "https://obitrend.vercel.app/icons/icon-512.png\r"
              exp_continue
            }

            -nocase -re {maskable icon url.*} {
              send -- "https://obitrend.vercel.app/icons/icon-512.png\r"
              exp_continue
            }

            -nocase -re {country.*} {
              send -- "NG\r"
              exp_continue
            }

            -nocase -re {keystore password.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {key password.*} {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {do you want.*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {\(y/n\).*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {\(y/N\).*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {\(Y/n\).*} {
              send -- "n\r"
              exp_continue
            }

            eof {
              catch wait result
              exit 0
            }

            timeout {
              puts stderr "ERROR: Bubblewrap init timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-init.exp

          /tmp/obitrend-init.exp

          echo "Checking generated project..."

          test -f android-build/twa-manifest.json

          echo "Android project generated successfully."

      - name: Verify generated project
        shell: bash
        run: |
          set -e

          if [ ! -f "android-build/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json was not created."
            exit 1
          fi

          if [ ! -f "android-build/android.keystore" ]; then
            echo "ERROR: android.keystore was not created."
            exit 1
          fi

          echo "TWA manifest found."
          echo "Android keystore found."

          echo
          echo "Project contents:"
          find android-build -maxdepth 2 -type f | sort

      - name: Build APK and AAB
        shell: bash
        working-directory: android-build
        timeout-minutes: 30
        run: |
          set -e

          cat > /tmp/obitrend-build.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 1800

          spawn bubblewrap build

          expect {
            -nocase -re {password for the key store.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {password for the key.*} {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {password for the keystore.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {password.*keystore.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {password.*key.*} {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            eof {
              catch wait result
              set exitCode [lindex $result 3]
              exit $exitCode
            }

            timeout {
              puts stderr "ERROR: Bubblewrap build timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-build.exp

          /tmp/obitrend-build.exp

      - name: Verify APK and AAB
        shell: bash
        run: |
          set -e

          echo "Searching for generated Android files..."

          APK="android-build/app-release-signed.apk"
          AAB="android-build/app-release-bundle.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK was not created."
            find android-build -type f | sort
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Android App Bundle was not created."
            find android-build -type f | sort
            exit 1
          fi

          echo
          echo "=========================================="
          echo "OBITREND BUILD SUCCESSFUL"
          echo "=========================================="
          echo
          echo "APK:"
          ls -lh "$APK"
          echo
          echo "AAB:"
          ls -lh "$AAB"
          echo
          echo "=========================================="

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-APK-and-AAB
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab
          if-no-files-found: error

      - name: Build complete
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "=========================================="
          echo "APK and AAB uploaded to GitHub Actions."
          echo "=========================================="
