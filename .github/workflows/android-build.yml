name: Build Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Android SDK ready."

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -e

          npm install -g @bubblewrap/cli@1.25.0

          bubblewrap --version

      - name: Install required tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y jq curl expect

          jq --version
          curl --version
          expect -v

      - name: Check signing secrets
        shell: bash
        run: |
          set -e

          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets found."

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Prepare Android directory
        shell: bash
        run: |
          set -e

          rm -rf android-build
          mkdir -p android-build

          echo "Android directory created."

      - name: Download and validate OBITREND manifest
        shell: bash
        run: |
          set -e

          MANIFEST_URL="https://obitrend.vercel.app/manifest.webmanifest"

          echo "Downloading:"
          echo "$MANIFEST_URL"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 60 \
            -A "Mozilla/5.0" \
            "$MANIFEST_URL" \
            -o android-build/source-manifest.webmanifest

          echo
          echo "Downloaded manifest:"
          cat android-build/source-manifest.webmanifest

          echo
          echo "Validating JSON..."

          jq empty android-build/source-manifest.webmanifest

          echo "Manifest JSON is valid."

      - name: Create clean Android manifest
        shell: bash
        run: |
          set -e

          cd android-build

          jq '
            .name = "OBITREND AI Fashion Creator"
            |
            .short_name = "OBITREND"
            |
            .description = "AI-powered fashion creation studio."
            |
            .id = "/"
            |
            .start_url = "/"
            |
            .scope = "/"
            |
            .display = "standalone"
            |
            .orientation = "portrait"
            |
            .theme_color = "#050505"
            |
            .background_color = "#020204"
            |
            .categories = ["fashion", "photography", "lifestyle"]
            |
            .icons = (
              .icons
              | map(
                  .src =
                    (
                      if (.sizes == "192x192")
                      then "/icons/icon-192.png"
                      elif (.sizes == "512x512")
                      then "/icons/icon-512.png"
                      else .src
                      end
                    )
                )
            )
          ' source-manifest.webmanifest > manifest.webmanifest

          echo
          echo "Clean manifest:"
          cat manifest.webmanifest

          echo
          echo "Checking required fields..."

          jq -e '.name | type == "string" and length > 0' manifest.webmanifest
          jq -e '.short_name | type == "string" and length > 0' manifest.webmanifest
          jq -e '.start_url | type == "string"' manifest.webmanifest
          jq -e '.scope | type == "string"' manifest.webmanifest
          jq -e '.display == "standalone"' manifest.webmanifest
          jq -e '.icons | type == "array"' manifest.webmanifest

          echo
          echo "Clean manifest is valid."

      - name: Create Bubblewrap project
        shell: bash
        working-directory: android-build
        timeout-minutes: 20
        run: |
          set -e

          rm -f twa-manifest.json
          rm -f android.keystore

          cat > /tmp/obitrend-init.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 1200

          spawn bubblewrap init --manifest "$env(PWD)/manifest.webmanifest"

          expect {
            -nocase -re {Do you want Bubblewrap to install the JDK.*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {Path to your existing JDK.*} {
              send -- "$env(JAVA_HOME)\r"
              exp_continue
            }

            -nocase -re {Do you want Bubblewrap to install the Android SDK.*} {
              send -- "n\r"
              exp_continue
            }

            -nocase -re {Path to your existing Android SDK.*} {
              send -- "$env(ANDROID_SDK_ROOT)\r"
              exp_continue
            }

            -nocase -re {Domain.*} {
              send -- "obitrend.vercel.app\r"
              exp_continue
            }

            -nocase -re {URL path.*} {
              send -- "/\r"
              exp_continue
            }

            -nocase -re {Application name.*} {
              send -- "OBITREND AI Fashion Creator\r"
              exp_continue
            }

            -nocase -re {Short name.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Application ID.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {Package ID.*} {
              send -- "com.obitrend.app\r"
              exp_continue
            }

            -nocase -re {Display mode.*} {
              send -- "standalone\r"
              exp_continue
            }

            -nocase -re {Orientation.*} {
              send -- "portrait\r"
              exp_continue
            }

            -nocase -re {Status bar color.*} {
              send -- "#050505\r"
              exp_continue
            }

            -nocase -re {Theme color.*} {
              send -- "#050505\r"
              exp_continue
            }

            -nocase -re {Background color.*} {
              send -- "#020204\r"
              exp_continue
            }

            -nocase -re {Application icon.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {Maskable icon.*} {
              send -- "\r"
              exp_continue
            }

            -nocase -re {Country.*} {
              send -- "NG\r"
              exp_continue
            }

            -nocase -re {First and last names.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {First.*last.*names.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Organizational Unit.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Organization.*} {
              send -- "OBITREND\r"
              exp_continue
            }

            -nocase -re {Country.*} {
              send -- "NG\r"
              exp_continue
            }

            -nocase -re {Keystore Password.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {Key Password.*} {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {Password.*keystore.*} {
              send -- "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {Password.*key.*} {
              send -- "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              exp_continue
            }

            -nocase -re {Do you want to create it now.*} {
              send -- "y\r"
              exp_continue
            }

            eof {
              catch wait result
              set code [lindex $result 3]
              exit $code
            }

            timeout {
              puts stderr "ERROR: Bubblewrap initialization timed out."
              exit 1
            }
          }
          EXPECT

          chmod +x /tmp/obitrend-init.exp

          /tmp/obitrend-init.exp

          echo
          echo "Bubblewrap project generation finished."

          test -f twa-manifest.json

          echo "twa-manifest.json exists."

      - name: Verify generated project
        shell: bash
        working-directory: android-build
        run: |
          set -e

          echo "Checking generated project..."

          test -f twa-manifest.json

          echo
          echo "Generated TWA manifest:"
          cat twa-manifest.json

          echo
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Build Android APK and AAB
        shell: bash
        working-directory: android-build
        timeout-minutes: 30
        run: |
          set -e

          echo "Building OBITREND Android application..."

          bubblewrap build \
            --manifest="$PWD/twa-manifest.json" \
            --signingKeyPath="$PWD/android.keystore" \
            --signingKeyAlias="android"

          echo
          echo "Bubblewrap build completed."

      - name: Verify APK and AAB
        shell: bash
        working-directory: android-build
        run: |
          set -e

          echo "Searching for APK and AAB..."

          APK="app-release-signed.apk"
          AAB="app-release-bundle.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find . -type f | sort
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            find . -type f | sort
            exit 1
          fi

          echo
          echo "========================================"
          echo "OBITREND BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"
          ls -lh "$AAB"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-APK-and-AAB
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab
          if-no-files-found: error

      - name: Build complete
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "========================================"
          echo "APK and AAB uploaded successfully."
          echo "========================================"
