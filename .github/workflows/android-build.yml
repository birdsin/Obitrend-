name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  build-android:

    name: Build OBITREND Android APK and AAB

    runs-on: ubuntu-latest

    steps:

      - name: Checkout OBITREND
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm ci


      - name: Sync Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android


      - name: Download permanent upload key
        uses: actions/download-artifact@v4
        with:
          name: OBITREND-PERMANENT-UPLOAD-KEY
          path: /tmp/obitrend-upload-key
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33476492079


      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          SOURCE_KEYSTORE="/tmp/obitrend-upload-key/upload-keystore.jks"
          FINAL_KEYSTORE="${GITHUB_WORKSPACE}/obitrend-upload-key.jks"

          CI_KEYSTORE="${RUNNER_TEMP}/obitrend-signing.jks"

          CI_PASSWORD="${KEYSTORE_PASSWORD}"

          keytool \
            -importkeystore \
            -noprompt \
            -srckeystore "$SOURCE_KEYSTORE" \
            -srcstoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srckeypass "$KEYSTORE_PASSWORD" \
            -srcalias upload \
            -destkeystore "$CI_KEYSTORE" \
            -deststoretype JKS \
            -deststorepass "$CI_PASSWORD" \
            -destkeypass "$CI_PASSWORD" \
            -destalias obitrend-upload

          cp \
            "$CI_KEYSTORE" \
            "$FINAL_KEYSTORE"

          keytool \
            -list \
            -keystore "$FINAL_KEYSTORE" \
            -storetype JKS \
            -storepass "$CI_PASSWORD" \
            -alias obitrend-upload \
            >/dev/null


      - name: Build release APK and AAB
        shell: bash
        working-directory: android
        env:
          OBITREND_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          OBITREND_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew clean

          ./gradlew assembleRelease bundleRelease


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error


      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-ANDROID-RELEASE
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
