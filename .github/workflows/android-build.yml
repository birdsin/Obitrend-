name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE.JS 22
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."
          echo "SDK: $SDK_PATH"

      # =========================================================
      # 5. INSTALL BUBBLEWRAP
      # FIXED: CONFIG IS CREATED BEFORE ANY BUBBLEWRAP COMMAND
      # =========================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          npm install -g @bubblewrap/cli

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          if [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "ERROR: Java 17 executable was not found at:"
            echo "$JAVA_HOME/bin/java"
            exit 1
          fi

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
{
  "jdkPath": "$JAVA_HOME",
  "androidSdkPath": "$SDK_PATH"
}
EOF

          echo "=========================================="
          echo "Bubblewrap configuration"
          echo "=========================================="

          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "Bubblewrap version:"
          bubblewrap --version

          echo ""
          echo "Java version:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$SDK_PATH"

          echo ""
          echo "JDK:"
          echo "$JAVA_HOME"

          echo ""
          echo "Running Bubblewrap doctor..."

          bubblewrap doctor

          echo ""
          echo "Bubblewrap environment ready."

      # =========================================================
      # 6. DOWNLOAD AND VERIFY WEB MANIFEST
      # =========================================================

      - name: Verify Web Manifest
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";

          const manifest = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          if (!manifest.name) {
            throw new Error("Manifest name is missing.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest start_url is missing.");
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error("Manifest icons are missing.");
          }

          console.log("Manifest: VALID");
          console.log("Name:", manifest.name);

          console.log(
            "Short name:",
            manifest.short_name || "OBITREND"
          );

          console.log(
            "Start URL:",
            manifest.start_url
          );

          console.log(
            "Icons:",
            manifest.icons.length
          );
          NODE

      # =========================================================
      # 7. PREPARE CLEAN ANDROID DIRECTORY
      # =========================================================

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

      # =========================================================
      # 8. CREATE SIGNING KEY
      # =========================================================

      - name: Create OBITREND signing keystore
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ "${#SIGNING_PASSWORD}" -lt 6 ]; then
            echo "ERROR: Signing password must contain at least 6 characters."
            exit 1
          fi

          KEYSTORE="$ANDROID_DIR/android.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias obitrend \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$SIGNING_PASSWORD" \
            -alias obitrend \
            >/dev/null

          echo "Keystore: VALID"
          echo "Alias: obitrend"

      # =========================================================
      # 9. CREATE CLEAN TWA MANIFEST
      # =========================================================

      - name: Create TWA manifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          node <<'NODE'
          const fs = require("fs");

          const source = JSON.parse(
            fs.readFileSync(
              "/tmp/manifest.webmanifest",
              "utf8"
            )
          );

          const manifestUrl =
            process.env.MANIFEST_URL;

          const baseUrl =
            new URL(manifestUrl);

          const startUrl =
            new URL(
              source.start_url || "/",
              manifestUrl
            );

          const scopeUrl =
            new URL(
              source.scope || "/",
              manifestUrl
            );

          if (
            !Array.isArray(source.icons) ||
            source.icons.length === 0
          ) {
            throw new Error(
              "No icons found."
            );
          }

          const normalIcon =
            source.icons.find(
              icon =>
                icon &&
                icon.src &&
                String(
                  icon.purpose || "any"
                )
                  .split(/\s+/)
                  .includes("any")
            ) ||
            source.icons.find(
              icon =>
                icon &&
                icon.src
            );

          if (!normalIcon) {
            throw new Error(
              "No usable icon found."
            );
          }

          const maskableIcon =
            source.icons.find(
              icon =>
                icon &&
                icon.src &&
                String(
                  icon.purpose || ""
                )
                  .split(/\s+/)
                  .includes("maskable")
            );

          const twaManifest = {
            packageId:
              "ai.obitrend.app",

            host:
              baseUrl.host,

            name:
              source.name ||
              "OBITREND AI Fashion Creator",

            launcherName:
              source.short_name ||
              "OBITREND",

            display:
              source.display ||
              "standalone",

            themeColor:
              source.theme_color ||
              "#111827",

            themeColorDark:
              source.theme_color ||
              "#111827",

            navigationColor:
              source.background_color ||
              "#111827",

            navigationColorDark:
              source.background_color ||
              "#111827",

            navigationDividerColor:
              "#00000000",

            navigationDividerColorDark:
              "#00000000",

            backgroundColor:
              source.background_color ||
              "#111827",

            enableNotifications:
              true,

            startUrl:
              startUrl.pathname +
              startUrl.search +
              startUrl.hash,

            iconUrl:
              new URL(
                normalIcon.src,
                manifestUrl
              ).href,

            splashScreenFadeOutDuration:
              300,

            signingKey: {
              path:
                "./android.keystore",

              alias:
                "obitrend"
            },

            appVersionCode:
              1,

            appVersion:
              "1",

            generatorApp:
              "bubblewrap-cli",

            webManifestUrl:
              manifestUrl,

            fallbackType:
              "customtabs",

            features: {},

            alphaDependencies: {
              enabled:
                false
            },

            enableSiteSettingsShortcut:
              false,

            isChromeOSOnly:
              false,

            isMetaQuest:
              false,

            fullScopeUrl:
              scopeUrl.href,

            minSdkVersion:
              23,

            shortcuts: [],

            fingerprints: [],

            additionalTrustedOrigins: [],

            retainedBundles: [],

            orientation:
              source.orientation ||
              "portrait"
          };

          if (maskableIcon) {
            twaManifest.maskableIconUrl =
              new URL(
                maskableIcon.src,
                manifestUrl
              ).href;
          }

          fs.writeFileSync(
            "twa-manifest.json",
            JSON.stringify(
              twaManifest,
              null,
              2
            ) + "\n"
          );

          console.log(
            "TWA manifest created successfully."
          );
          NODE

          test \
            -f \
            "$ANDROID_DIR/twa-manifest.json"

      # =========================================================
      # 10. GENERATE ANDROID PROJECT
      # =========================================================

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          npx \
            --yes \
            @bubblewrap/cli update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

          test \
            -f \
            "$ANDROID_DIR/gradlew"

          test \
            -f \
            "$ANDROID_DIR/app/build.gradle"

          chmod +x \
            "$ANDROID_DIR/gradlew"

          echo "Android project generated successfully."

      # =========================================================
      # 11. BUILD APK + AAB
      # =========================================================

      - name: Build Android APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          keytool \
            -list \
            -keystore "./android.keystore" \
            -storetype PKCS12 \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -alias obitrend \
            >/dev/null

          echo "Keystore: VALID"

          npx \
            --yes \
            @bubblewrap/cli build \
            --skipPwaValidation \
            --signingKeyPath="./android.keystore" \
            --signingKeyAlias="obitrend"

          echo "Bubblewrap build completed."

      # =========================================================
      # 12. VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ANDROID_DIR/app-release-signed.apk"

          test \
            -f \
            "$APK"

          echo "APK:"
          echo "$APK"

          ls -lh "$APK"

      # =========================================================
      # 13. VERIFY AAB
      # =========================================================

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$ANDROID_DIR/app-release-bundle.aab"

          test \
            -f \
            "$AAB"

          echo "AAB:"
          echo "$AAB"

          ls -lh "$AAB"

      # =========================================================
      # 14. VERIFY APK SIGNATURE
      # =========================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          apksigner \
            verify \
            --verbose \
            "$ANDROID_DIR/app-release-signed.apk"

          echo "APK SIGNATURE: VALID"

      # =========================================================
      # 15. UPLOAD APK + AAB
      # =========================================================

      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Build
          path: |
            ${{ env.ANDROID_DIR }}/app-release-signed.apk
            ${{ env.ANDROID_DIR }}/app-release-bundle.aab
          if-no-files-found: error

      # =========================================================
      # 16. BUILD COMPLETE
      # =========================================================

      - name: Build complete
        run: |
          echo "=========================================="
          echo "OBITREND ANDROID BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK: app-release-signed.apk"
          echo "AAB: app-release-bundle.aab"
          echo ""
          echo "BUILD COMPLETE"
          echo "=========================================="
