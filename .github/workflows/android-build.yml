name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # =========================================================
      # 2. NODE.JS
      # =========================================================

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # 3. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK packages installed."

      # =========================================================
      # 5. CONFIGURE BUBBLEWRAP BEFORE IT IS USED
      # =========================================================
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # Bubblewrap otherwise asks:
      #
      # Do you want Bubblewrap to install the JDK?
      #
      # GitHub Actions cannot answer that interactive prompt.
      #
      # =========================================================

      - name: Configure Bubblewrap environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING BUBBLEWRAP"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is empty."
            exit 1
          fi

          if [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME does not exist:"
            echo "$JAVA_HOME"
            exit 1
          fi

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: Android SDK does not exist:"
            echo "$SDK_PATH"
            exit 1
          fi

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

          echo ""
          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$SDK_PATH"

          echo ""
          echo "Java version:"
          java -version

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP ENVIRONMENT READY"
          echo "=========================================="

      # =========================================================
      # 6. INSTALL BUBBLEWRAP
      # =========================================================

      - name: Install Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "INSTALLING BUBBLEWRAP"
          echo "=========================================="

          npm install -g @bubblewrap/cli

          echo ""
          echo "Bubblewrap version:"
          bubblewrap --version

          echo ""
          echo "Running Bubblewrap doctor..."

          bubblewrap doctor

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP IS READY"
          echo "=========================================="

      # =========================================================
      # 7. VERIFY WEB MANIFEST
      # =========================================================

      - name: Verify Web Manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING WEB MANIFEST"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";

          let manifest;

          try {
            manifest = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            console.error(
              "ERROR: manifest.webmanifest is invalid JSON."
            );
            console.error(error.message);
            process.exit(1);
          }

          console.log("Manifest JSON: VALID");
          console.log("name:", manifest.name);
          console.log("short_name:", manifest.short_name);
          console.log("start_url:", manifest.start_url);
          console.log("display:", manifest.display);

          if (!manifest.name) {
            throw new Error(
              "Manifest is missing name."
            );
          }

          if (!manifest.start_url) {
            throw new Error(
              "Manifest is missing start_url."
            );
          }

          if (
            !Array.isArray(manifest.icons) ||
            manifest.icons.length === 0
          ) {
            throw new Error(
              "Manifest has no icons."
            );
          }

          const base =
            "https://obitrend.vercel.app/manifest.webmanifest";

          const startUrl =
            new URL(
              manifest.start_url,
              base
            );

          console.log(
            "Resolved start URL:",
            startUrl.href
          );

          for (
            const [index, icon]
            of manifest.icons.entries()
          ) {
            if (!icon || !icon.src) {
              throw new Error(
                `Icon ${index} has no src.`
              );
            }

            const iconUrl =
              new URL(
                icon.src,
                base
              );

            if (
              !["http:", "https:"].includes(
                iconUrl.protocol
              )
            ) {
              throw new Error(
                `Icon ${index} has invalid URL.`
              );
            }

            console.log(
              `Icon ${index}:`,
              iconUrl.href
            );
          }

          console.log(
            "MANIFEST VALIDATION: PASSED"
          );
          NODE

      # =========================================================
      # 8. PREPARE ANDROID DIRECTORY
      # =========================================================

      - name: Prepare Android build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANDROID_DIR"

          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

                  # =========================================================
      # 9. CREATE BUBBLEWRAP ANDROID PROJECT
      # =========================================================

      - name: Create Bubblewrap Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING OBITREND BUBBLEWRAP PROJECT"
          echo "=========================================="

          cd "$ANDROID_DIR"

          echo "Downloading Web Manifest..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$MANIFEST_URL" \
            -o /tmp/manifest.webmanifest

          echo "Web Manifest downloaded."

          # -----------------------------------------------------
          # CREATE TWA MANIFEST
          # -----------------------------------------------------

          node <<'NODE'
          const fs = require("fs");

          const manifestFile =
            "/tmp/manifest.webmanifest";

          const source =
            JSON.parse(
              fs.readFileSync(
                manifestFile,
                "utf8"
              )
            );

          const manifestUrl =
            process.env.MANIFEST_URL;

          if (!manifestUrl) {
            throw new Error(
              "MANIFEST_URL is not defined."
            );
          }

          const baseUrl =
            new URL(manifestUrl);

          // ---------------------------------------------------
          // HOST
          // ---------------------------------------------------

          const host =
            baseUrl.host;

          // ---------------------------------------------------
          // START URL
          // ---------------------------------------------------

          const startUrl =
            new URL(
              source.start_url || "/",
              manifestUrl
            );

          // ---------------------------------------------------
          // SCOPE
          // ---------------------------------------------------

          const scopeUrl =
            new URL(
              source.scope || "/",
              manifestUrl
            );

          // ---------------------------------------------------
          // ICONS
          // ---------------------------------------------------

          if (
            !Array.isArray(source.icons) ||
            source.icons.length === 0
          ) {
            throw new Error(
              "Web Manifest contains no icons."
            );
          }

          function findIcon(purpose) {
            return source.icons.find(
              (icon) => {
                if (
                  !icon ||
                  !icon.src
                ) {
                  return false;
                }

                if (!purpose) {
                  return true;
                }

                const purposes =
                  String(
                    icon.purpose || "any"
                  )
                  .split(/\s+/);

                return purposes.includes(
                  purpose
                );
              }
            );
          }

          const normalIcon =
            findIcon("any") ||
            source.icons[0];

          if (
            !normalIcon ||
            !normalIcon.src
          ) {
            throw new Error(
              "No usable application icon found."
            );
          }

          const iconUrl =
            new URL(
              normalIcon.src,
              manifestUrl
            ).href;

          const maskableIcon =
            findIcon("maskable");

          const maskableIconUrl =
            maskableIcon &&
            maskableIcon.src
              ? new URL(
                  maskableIcon.src,
                  manifestUrl
                ).href
              : undefined;

          // ---------------------------------------------------
          // BUILD TWA MANIFEST
          // ---------------------------------------------------

          const twaManifest = {
            packageId:
              "ai.obitrend.app",

            host:

              host,

            name:
              source.name ||
              "OBITREND AI Fashion Creator",

            launcherName:
              source.short_name ||
              "OBITREND",

            display:
              source.display ||
              "standalone",

            themeColor:
              source.theme_color ||
              "#111827",

            themeColorDark:
              source.theme_color ||
              "#111827",

            navigationColor:
              source.background_color ||
              "#111827",

            navigationColorDark:
              source.background_color ||
              "#111827",

            navigationDividerColor:
              "#00000000",

            navigationDividerColorDark:
              "#00000000",

            backgroundColor:
              source.background_color ||
              "#111827",

            startUrl:
              startUrl.pathname +
              startUrl.search +
              startUrl.hash,

            iconUrl:

              iconUrl,

            ...(maskableIconUrl
              ? {
                  maskableIconUrl:
                    maskableIconUrl
                }
              : {}),

            splashScreenFadeOutDuration:
              300,

            signingKey: {
              path:
                "./android.keystore",

              alias:
                "obitrend"
            },

            appVersionCode:
              1,

            appVersion:
              "1",

            generatorApp:
              "bubblewrap-cli",

            webManifestUrl:
              manifestUrl,

            fallbackType:
              "customtabs",

            features: {},

            alphaDependencies: {
              enabled:
                false
            },

            enableNotifications:
              true,

            enableSiteSettingsShortcut:
              false,

            isChromeOSOnly:
              false,

            isMetaQuest:
              false,

            fullScopeUrl:
              scopeUrl.href,

            minSdkVersion:
              23,

            shortcuts: [],

            fingerprints: [],

            additionalTrustedOrigins:
              [],

            retainedBundles:
              [],

            orientation:
              source.orientation ||
              "portrait"
          };

          // ---------------------------------------------------
          // WRITE TWA MANIFEST
          // ---------------------------------------------------

          fs.writeFileSync(
            "twa-manifest.json",
            JSON.stringify(
              twaManifest,
              null,
              2
            ) + "\n"
          );

          console.log(
            "twa-manifest.json CREATED"
          );

          console.log(
            "Package:",
            twaManifest.packageId
          );

          console.log(
            "Host:",
            twaManifest.host
          );

          console.log(
            "Start URL:",
            twaManifest.startUrl
          );

          console.log(
            "Icon:",
            twaManifest.iconUrl
          );

          console.log(
            "Notifications:",
            twaManifest.enableNotifications
          );

          console.log(
            "Site settings shortcut:",
            twaManifest.enableSiteSettingsShortcut
          );

          console.log(
            "Signing alias:",
            twaManifest.signingKey.alias
          );
          NODE

          # -----------------------------------------------------
          # VERIFY TWA MANIFEST
          # -----------------------------------------------------

          echo ""
          echo "=========================================="
          echo "VERIFYING TWA MANIFEST"
          echo "=========================================="

          test \
            -f \
            "$ANDROID_DIR/twa-manifest.json"

          node <<'NODE'
          const fs = require("fs");

          const file =
            process.env.ANDROID_DIR +
            "/twa-manifest.json";

          const manifest =
            JSON.parse(
              fs.readFileSync(
                file,
                "utf8"
              )
            );

          const requiredFields = [
            "packageId",
            "host",
            "name",
            "launcherName",
            "startUrl",
            "iconUrl",
            "signingKey"
          ];

          for (
            const field
            of requiredFields
          ) {
            if (
              !manifest[field]
            ) {
              throw new Error(
                `Missing required field: ${field}`
              );
            }
          }

          if (
            !manifest.signingKey.path
          ) {
            throw new Error(
              "Signing key path is missing."
            );
          }

          if (
            !manifest.signingKey.alias
          ) {
            throw new Error(
              "Signing key alias is missing."
            );
          }

          if (
            manifest.signingKey.alias !==
            "obitrend"
          ) {
            throw new Error(
              "Signing key alias must be obitrend."
            );
          }

          if (
            manifest.enableNotifications !==
            true
          ) {
            throw new Error(
              "enableNotifications must be true."
            );
          }

          if (
            manifest.enableSiteSettingsShortcut !==
            false
          ) {
            throw new Error(
              "enableSiteSettingsShortcut must be false."
            );
          }

          console.log(
            "TWA MANIFEST: VALID"
          );

          console.log(
            "Package:",
            manifest.packageId
          );

          console.log(
            "Host:",
            manifest.host
          );

          console.log(
            "Start URL:",
            manifest.startUrl
          );

          console.log(
            "Signing:",
            manifest.signingKey.alias
          );
          NODE

          # -----------------------------------------------------
          # GENERATE ANDROID PROJECT
          # -----------------------------------------------------

          echo ""
          echo "=========================================="
          echo "GENERATING ANDROID PROJECT"
          echo "=========================================="

          npx \
            --yes \
            @bubblewrap/cli update \
            --skipVersionUpgrade \
            --manifest="$ANDROID_DIR/twa-manifest.json"

          echo ""
          echo "=========================================="
          echo "BUBBLEWRAP PROJECT GENERATED"
          echo "=========================================="

          test \
            -f \
            "$ANDROID_DIR/gradlew"

          test \
            -f \
            "$ANDROID_DIR/twa-manifest.json"

          chmod +x \
            "$ANDROID_DIR/gradlew"

          echo "gradlew: FOUND"
          echo "twa-manifest.json: FOUND"

          echo ""
          echo "Generated Android files:"

          find \
            "$ANDROID_DIR" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -150

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT READY"
          echo "=========================================="

            # =========================================================
      #       # =========================================================
      # 10. CREATE ONE OBITREND RELEASE SIGNING KEY
      # =========================================================

      - name: Create OBITREND release signing key
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CREATING ONE OBITREND SIGNING KEY"
          echo "=========================================="

          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          if [ "${#SIGNING_PASSWORD}" -lt 6 ]; then
            echo "ERROR: Signing password must contain at least 6 characters."
            exit 1
          fi

          KEYSTORE="$ANDROID_DIR/android.keystore"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -alias obitrend \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=OBITREND, OU=OBITREND, O=OBITREND, L=Lagos, ST=Lagos, C=NG"

          echo ""
          echo "Signing key created."

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$SIGNING_PASSWORD" \
            -alias obitrend \
            >/dev/null

          echo "Signing key verification: PASSED"
          echo "Alias: obitrend"


      # =========================================================
      # 11. VERIFY ONE SIGNING CONFIGURATION
      # =========================================================

      - name: Verify one signing configuration
        shell: bash
        env:
          SIGNING_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING ONE SIGNING CONFIGURATION"
          echo "=========================================="

          test -f "$ANDROID_DIR/android.keystore"
          test -f "$ANDROID_DIR/twa-manifest.json"
          test -f "$ANDROID_DIR/gradlew"

          keytool \
            -list \
            -v \
            -keystore "$ANDROID_DIR/android.keystore" \
            -storetype JKS \
            -storepass "$SIGNING_PASSWORD" \
            -alias obitrend \
            >/dev/null

          node <<'NODE'
          const fs = require("fs");

          const file =
            process.env.ANDROID_DIR +
            "/twa-manifest.json";

          const manifest =
            JSON.parse(
              fs.readFileSync(file, "utf8")
            );

          if (!manifest.signingKey) {
            throw new Error(
              "signingKey is missing from twa-manifest.json"
            );
          }

          if (
            manifest.signingKey.path !==
            "./android.keystore"
          ) {
            throw new Error(
              "Signing key path must be ./android.keystore"
            );
          }

          if (
            manifest.signingKey.alias !==
            "obitrend"
          ) {
            throw new Error(
              "Signing key alias must be obitrend"
            );
          }

          console.log(
            "Signing configuration: VALID"
          );
          NODE


            # ============================================================
      # 12. VERIFY SIGNING CONFIGURATION
      # ============================================================

      - name: Verify signing configuration
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING SIGNING CONFIGURATION"
          echo "================================================"

          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: BUBBLEWRAP_KEYSTORE_PASSWORD is empty."
            exit 1
          fi

          KEYSTORE="$ANDROID_DIR/android.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: android.keystore not found."
            echo "Expected: $KEYSTORE"
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json not found."
            exit 1
          fi

          if [ ! -d "$ANDROID_DIR/gradlew" ] && [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          echo "android.keystore: FOUND"
          echo "twa-manifest.json: FOUND"
          echo "gradlew: FOUND"
          echo "Alias: obitrend"

          echo ""
          echo "Checking keystore password and alias..."

          keytool \
            -list \
            -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -alias "obitrend" \
            > /dev/null

          echo ""
          echo "================================================"
          echo "SIGNING CONFIGURATION: VALID"
          echo "================================================"


      # =========================================================
      # 13. VERIFY APK SIGNATURE
      # =========================================================

      - name: Verify APK signature
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          APK="$ANDROID_DIR/app-release-signed.apk"

          test -f "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          fi

          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort \
              | tail -1)"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE: VALID"


      # =========================================================
      # 14. VERIFY AAB SIGNATURE
      # =========================================================

      - name: Verify AAB signature
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          SIGNING_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING AAB SIGNATURE"
          echo "=========================================="

          AAB="$ANDROID_DIR/app-release-bundle.aab"

          test -f "$AAB"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB" \
            >/dev/null

          echo ""
          echo "AAB SIGNATURE: VALID"


            # ============================================================
      # 15. SHOW RELEASE FILES
      # ============================================================

      - name: Show release APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "OBITREND RELEASE FILES"
          echo "================================================"

          APK="./app-release-signed.apk"
          AAB="./app-release-bundle.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK not found:"
            echo "$APK"
            echo ""
            echo "Available APK files:"
            find . -maxdepth 4 -type f -name "*.apk" -print || true
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Signed AAB not found:"
            echo "$AAB"
            echo ""
            echo "Available AAB files:"
            find . -maxdepth 4 -type f -name "*.aab" -print || true
            exit 1
          fi

          echo ""
          echo "SIGNED APK:"
          ls -lh "$APK"

          echo ""
          echo "SIGNED AAB:"
          ls -lh "$AAB"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"

          echo ""
          echo "AAB SHA256:"
          sha256sum "$AAB"

          echo ""
          echo "RELEASE FILES: READY"


      # ============================================================
      # 16. UPLOAD APK + AAB
      # ============================================================

      - name: Upload OBITREND APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Release
          path: |
            ${{ env.ANDROID_DIR }}/app-release-signed.apk
            ${{ env.ANDROID_DIR }}/app-release-bundle.aab
          if-no-files-found: error


      # ============================================================
      # 17. BUILD COMPLETE
      # ============================================================

      - name: Build complete
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -euo pipefail

          APK="./app-release-signed.apk"
          AAB="./app-release-bundle.aab"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final signed APK is missing."
            exit 1
          fi

          if [ ! -f "$AAB" ]; then
            echo "ERROR: Final signed AAB is missing."
            exit 1
          fi

          echo ""
          echo "================================================"
          echo "OBITREND ANDROID BUILD COMPLETE"
          echo "================================================"
          echo ""
          echo "APK: SIGNED SUCCESSFULLY"
          echo "AAB: SIGNED SUCCESSFULLY"
          echo ""
          echo "ONE SIGNING KEY"
          echo "ONE ALIAS: obitrend"
          echo "ONE APK SIGNING FLOW"
          echo "ONE AAB SIGNING FLOW"
          echo ""
          echo "APK:"
          echo "$APK"
          echo ""
          echo "AAB:"
          echo "$AAB"
