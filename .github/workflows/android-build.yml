name: Build OBITREND Android APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build OBITREND Android APK and AAB
    runs-on: ubuntu-latest

    env:
      MANIFEST_URL: https://obitrend.vercel.app/manifest.webmanifest
      ANDROID_DIR: ${{ github.workspace }}/android-build

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout OBITREND
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. SET UP NODE
      # ---------------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

                        # ---------------------------------------------------------
      # 3. SET UP ANDROID SDK + INSTALL BUBBLEWRAP
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Android SDK setup"
          echo "=========================================="

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: ANDROID_HOME / ANDROID_SDK_ROOT is not set."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: Android SDK directory does not exist."
            exit 1
          fi

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          sdkmanager --update || true

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed

          echo "Checking build-tools directory..."

          if [ ! -d "$SDK_PATH/build-tools" ]; then
            echo "ERROR: Android build-tools directory was not created."
            exit 1
          fi

          echo "Android SDK is ready."

      - name: Install and Configure Bubblewrap
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Installing Bubblewrap"
          echo "=========================================="

          npm install -g @bubblewrap/cli

                    echo "Java version:"

          echo "Java version:"
          java -version

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Android SDK path is not available."
            exit 1
          fi

          if [ ! -d "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME does not exist."
            exit 1
          fi

          if [ ! -d "$SDK_PATH" ]; then
            echo "ERROR: Android SDK does not exist."
            exit 1
          fi

          if [ ! -d "$SDK_PATH/build-tools" ]; then
            echo "ERROR: Android SDK build-tools are missing."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_PATH"

          echo "Build-tools:"
          ls -la "$SDK_PATH/build-tools"

          mkdir -p "$HOME/.bubblewrap"

          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_PATH"
          }
          EOF

          echo "Bubblewrap configuration:"
          cat "$HOME/.bubblewrap/config.json"

          echo "Running Bubblewrap doctor..."

          bubblewrap doctor

          echo "=========================================="
          echo " Bubblewrap environment is READY"
          echo "=========================================="

      # ---------------------------------------------------------
      # 4. VERIFY WEB MANIFEST
      # ---------------------------------------------------------
      - name: Verify Web Manifest
        shell: bash
        run: |
          set -e

          echo "Checking:"
          echo "$MANIFEST_URL"

          HTTP_STATUS=$(curl -L -s -o /tmp/manifest.webmanifest \
            -w "%{http_code}" \
            "$MANIFEST_URL")

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Web Manifest could not be downloaded."
            cat /tmp/manifest.webmanifest || true
            exit 1
          fi

          echo "Manifest downloaded successfully."

          echo "----- MANIFEST -----"
          cat /tmp/manifest.webmanifest
          echo "--------------------"
                    echo "----- VALIDATING MANIFEST JSON -----"

          node <<'NODE'
          const fs = require("fs");

          const file = "/tmp/manifest.webmanifest";
          const manifestUrl = process.env.MANIFEST_URL;

          let manifest;

          try {
            manifest = JSON.parse(fs.readFileSync(file, "utf8"));
          } catch (error) {
            console.error("ERROR: manifest.webmanifest is not valid JSON.");
            console.error(error.message);
            process.exit(1);
          }

          console.log("Manifest JSON: VALID");
          console.log("name:", manifest.name);
          console.log("short_name:", manifest.short_name);
          console.log("start_url:", manifest.start_url);
          console.log("scope:", manifest.scope);
          console.log("display:", manifest.display);
          console.log(
            "icons:",
            Array.isArray(manifest.icons) ? manifest.icons.length : 0
          );

          if (!manifest.name) {
            throw new Error("Manifest is missing name.");
          }

          if (!manifest.start_url) {
            throw new Error("Manifest is missing start_url.");
          }

          const startUrl = new URL(manifest.start_url, manifestUrl);
          console.log("Resolved start_url:", startUrl.href);

          if (manifest.scope) {
            const scopeUrl = new URL(manifest.scope, manifestUrl);
            console.log("Resolved scope:", scopeUrl.href);
          }

          if (!Array.isArray(manifest.icons) || manifest.icons.length === 0) {
            throw new Error("Manifest has no icons.");
          }

          for (const [index, icon] of manifest.icons.entries()) {
            if (!icon.src) {
              throw new Error(`Icon ${index} has no src.`);
            }

            const iconUrl = new URL(icon.src, manifestUrl);

            if (!["http:", "https:"].includes(iconUrl.protocol)) {
              throw new Error(
                `Icon ${index} has an invalid URL: ${icon.src}`
              );
            }

            console.log(`Icon ${index}:`, iconUrl.href);
          }

          console.log("Manifest URL validation: PASSED");
          NODE

          echo "----- MANIFEST VALIDATION COMPLETE -----"

      # ---------------------------------------------------------
      # 5. CREATE CLEAN ANDROID DIRECTORY
      # ---------------------------------------------------------
      - name: Prepare Android build directory
        shell: bash
        run: |
          set -e

          rm -rf "$ANDROID_DIR"
          mkdir -p "$ANDROID_DIR"

          echo "Android directory:"
          echo "$ANDROID_DIR"

          test -d "$ANDROID_DIR"

                              # ---------------------------------------------------------
      # 6. INITIALIZE BUBBLEWRAP
      # ---------------------------------------------------------
      - name: Create Bubblewrap Android project
        shell: bash
        env:
          MANIFEST_URL: ${{ env.MANIFEST_URL }}
          ANDROID_DIR: ${{ env.ANDROID_DIR }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Creating Bubblewrap Android project"
          echo "=========================================="

          mkdir -p "$ANDROID_DIR"
          cd "$ANDROID_DIR"

          echo "Android directory:"
          pwd

          echo "Manifest:"
          echo "$MANIFEST_URL"

          echo "Checking Bubblewrap..."
          npx --yes @bubblewrap/cli --version

          echo "Checking Expect..."
          command -v expect
          expect -v

          echo "Starting Bubblewrap initialization..."

          cat > /tmp/bubblewrap-init.exp <<'EXPECT'
          #!/usr/bin/expect -f

          set timeout 900

          set manifest $env(MANIFEST_URL)
          set android_dir $env(ANDROID_DIR)

          cd $android_dir

          spawn npx --yes @bubblewrap/cli init --manifest "$manifest"

          # -----------------------------------------------------
          # STEP 1 — WEB APP DETAILS
          # -----------------------------------------------------

          expect {
              -re {Domain:} {
                  send "obitrend.vercel.app\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Domain."
                  exit 1
              }
          }

          expect {
              -re {URL path:} {
                  send "/\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for URL path."
                  exit 1
              }
          }

          # -----------------------------------------------------
          # STEP 2 — ANDROID APP DETAILS
          # -----------------------------------------------------

          expect {
              -re {Application name:} {
                  send "OBITREND AI Fashion Creator\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Application name."
                  exit 1
              }
          }

          expect {
              -re {Short name:} {
                  send "OBITREND\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Short name."
                  exit 1
              }
          }

          expect {
              -re {Application ID:} {
                  send "ai.obitrend.app\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Application ID."
                  exit 1
              }
          }

          expect {
              -re {Starting version code for the new app version:} {
                  send "1\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for version code."
                  exit 1
              }
          }

          # Display mode is a choice prompt.
          # Enter accepts Bubblewrap's default.
          expect {
              -re {Display mode:} {
                  send "\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Display mode."
                  exit 1
              }
          }

          # Orientation is a choice prompt.
          expect {
              -re {Orientation:} {
                  send "\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Orientation."
                  exit 1
              }
          }

          # -----------------------------------------------------
          # STEP 3 — COLORS / ICONS
          # -----------------------------------------------------

          expect {
              -re {Status bar color:} {
                  send "#111827\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Status bar color."
                  exit 1
              }
          }

          expect {
              -re {Splash screen color:} {
                  send "#111827\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Splash screen color."
                  exit 1
              }
          }

          # Bubblewrap requires a valid 512x512+ icon URL.
          # Use the first suitable icon from the live manifest.
          expect {
              -re {URL to an image that is at least 512x512px:} {
                  send "\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for icon URL."
                  exit 1
              }
          }

          expect {
              -re {URL to an image that is at least 512x512px to be used when generating maskable icons} {
                  send "\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for maskable icon URL."
                  exit 1
              }
          }

          # -----------------------------------------------------
          # STEP 4 — OPTIONAL FEATURES
          # -----------------------------------------------------

          expect {
              -re {Include app shortcuts} {
                  send "n\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for app shortcuts."
                  exit 1
              }
          }

          expect {
              -re {Include support for Play Billing} {
                  send "n\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Play Billing."
                  exit 1
              }
          }

          expect {
              -re {Request geolocation permission} {
                  send "n\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for geolocation."
                  exit 1
              }
          }

          # -----------------------------------------------------
          # STEP 5 — SIGNING KEY
          # -----------------------------------------------------

          expect {
              -re {First and Last names} {
                  send "OBITREND\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for First and Last names."
                  exit 1
              }
          }

          expect {
              -re {Organizational Unit} {
                  send "OBITREND\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Organizational Unit."
                  exit 1
              }
          }

          expect {
              -re {Organization} {
                  send "OBITREND\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Organization."
                  exit 1
              }
          }

          expect {
              -re {Country} {
                  send "NG\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for Country."
                  exit 1
              }
          }

          expect {
              -re {Password for the Key Store} {
                  send "$env(BUBBLEWRAP_KEYSTORE_PASSWORD)\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for keystore password."
                  exit 1
              }
          }

          expect {
              -re {Password for the Key} {
                  send "$env(BUBBLEWRAP_KEY_PASSWORD)\r"
              }
              timeout {
                  puts "ERROR: Timed out waiting for key password."
                  exit 1
              }
          }

          # -----------------------------------------------------
          # WAIT FOR BUBBLEWRAP TO FINISH
          # -----------------------------------------------------

          expect {
              eof {
                  catch wait result

                  set exit_code [lindex $result 3]

                  if {$exit_code != 0} {
                      puts "ERROR: Bubblewrap exited with code $exit_code."
                      exit $exit_code
                  }

                  exit 0
              }

              timeout {
                  puts "ERROR: Bubblewrap initialization timed out."
                  exit 1
              }
          }
          EXPECT

          chmod +x /tmp/bubblewrap-init.exp

          echo "Running controlled Bubblewrap initialization..."

          /usr/bin/expect /tmp/bubblewrap-init.exp

          echo "=========================================="
          echo " Bubblewrap initialization finished"
          echo "=========================================="

          echo "Generated files:"
          find . -maxdepth 3 -type f | sort | head -150

          if [ ! -f "twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json was not generated."
            exit 1
          fi

          echo "twa-manifest.json successfully created."

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew was not generated."
            exit 1
          fi

          chmod +x gradlew

          echo "Bubblewrap Android project is READY."



      # ---------------------------------------------------------
      # 7. VERIFY GENERATED ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Verify generated Android project
        shell: bash
        run: |
          set -e

          echo "Generated files:"
          find "$ANDROID_DIR" -maxdepth 2 -type f | sort | head -100

          if [ ! -f "$ANDROID_DIR/twa-manifest.json" ]; then
            echo "ERROR: twa-manifest.json was not generated."
            exit 1
          fi

          echo "twa-manifest.json found."

      # ---------------------------------------------------------
      # 8. BUILD APK + AAB
      # ---------------------------------------------------------
      - name: Build Android APK and AAB
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -e

          npx @bubblewrap/cli build \
            --skipPwaValidation

      # ---------------------------------------------------------
      # 9. VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # ---------------------------------------------------------
      # 10. VERIFY AAB
      # ---------------------------------------------------------
      - name: Verify AAB
        shell: bash
        run: |
          set -e

          AAB=$(find "$ANDROID_DIR" -type f -name "*.aab" | head -1)

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB was not generated."
            exit 1
          fi

          echo "AAB found:"
          echo "$AAB"

      # ---------------------------------------------------------
      # 11. UPLOAD APK + AAB
      # ---------------------------------------------------------
      - name: Upload Android APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OBITREND-Android-Build
          path: |
            ${{ env.ANDROID_DIR }}/**/*.apk
            ${{ env.ANDROID_DIR }}/**/*.aab
          if-no-files-found: error

      # ---------------------------------------------------------
      # 12. BUILD COMPLETE
      # ---------------------------------------------------------
      - name: Build complete
        run: |
          echo "=========================================="
          echo "       OBITREND ANDROID BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK:"
          find "$ANDROID_DIR" -type f -name "*.apk" || true
          echo ""
          echo "AAB:"
          find "$ANDROID_DIR" -type f -name "*.aab" || true
