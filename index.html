<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBITREND AI Fashion Creator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #080808;
  color: #ffffff;
}

header {
  text-align: center;
  padding: 35px 20px;
  border-bottom: 1px solid #4d3c0c;
  background: linear-gradient(135deg, #090909, #1b1b1b);
}

.logo {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: 8px;
}

.logo span {
  color: #d4af37;
}

.subtitle {
  margin-top: 10px;
  color: #aaa;
  letter-spacing: 4px;
}

.container {
  width: min(1000px, 94%);
  margin: 30px auto;
}

.card {
  background: #171717;
  border: 1px solid #4b3b12;
  border-radius: 24px;
  padding: 25px;
  margin-bottom: 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

h2 {
  margin-top: 0;
  color: #d4af37;
}

label {
  display: block;
  margin: 18px 0 8px;
  color: #bbb;
  font-size: 14px;
  font-weight: bold;
  text-transform: uppercase;
}

select,
textarea,
input[type="text"] {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid #444;
  background: #090909;
  color: #fff;
  font-size: 16px;
  outline: none;
}

select:focus,
textarea:focus,
input:focus {
  border-color: #d4af37;
}

textarea {
  min-height: 150px;
  resize: vertical;
}

.upload {
  border: 2px dashed #555;
  border-radius: 20px;
  padding: 30px 20px;
  text-align: center;
  cursor: pointer;
  background: #101010;
}

.upload:hover {
  border-color: #d4af37;
}

.upload-icon {
  font-size: 55px;
}

.upload strong {
  display: block;
  font-size: 20px;
  margin-top: 10px;
}

.upload small {
  color: #888;
  display: block;
  margin-top: 8px;
}

#imageInput {
  display: none;
}

#previewBox {
  display: none;
  text-align: center;
  margin-top: 20px;
}

#preview {
  width: 100%;
  max-width: 500px;
  max-height: 500px;
  object-fit: contain;
  border-radius: 18px;
  border: 1px solid #444;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

button {
  border: none;
  cursor: pointer;
}

.generate {
  width: 100%;
  padding: 20px;
  border-radius: 18px;
  background: linear-gradient(135deg, #d4af37, #ffd966);
  color: #080808;
  font-size: 21px;
  font-weight: 800;
}

.generate:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.status {
  display: none;
  margin-top: 18px;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
  background: #222;
  color: #ddd;
}

.error {
  background: #401818;
  color: #ffbaba;
}

.result {
  display: none;
  text-align: center;
}

#resultImage {
  width: 100%;
  max-width: 800px;
  border-radius: 20px;
  margin-top: 15px;
}

.download {
  display: inline-block;
  margin-top: 15px;
  padding: 14px 22px;
  border-radius: 12px;
  background: #d4af37;
  color: #000;
  font-weight: bold;
  text-decoration: none;
}

@media(max-width:700px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .logo {
    font-size: 30px;
    letter-spacing: 5px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">OBI<span>TREND</span></div>
  <div class="subtitle">AI FASHION CREATOR</div>
</header>

<div class="container">

  <!-- CLOTHING -->
  <div class="card">

    <h2>📸 Fashion Item</h2>

    <div class="upload" onclick="document.getElementById('imageInput').click()">

      <div class="upload-icon">📷</div>

      <strong>Upload Your Clothing Photo</strong>

      <small>
        Choose a clear photo of the clothing item from your phone
      </small>

      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >

    </div>

    <div id="previewBox">
      <img id="preview" alt="Clothing preview">
    </div>

  </div>


  <!-- MODEL -->
  <div class="card">

    <h2>👩 Adult Fashion Model</h2>

    <div class="grid">

      <div>
        <label>Model Type</label>

        <select id="model">
          <option>Elegant adult fashion model</option>
          <option>Professional runway model</option>
          <option>Luxury editorial model</option>
          <option>Commercial fashion model</option>
          <option>Adult Black fashion model</option>
          <option>Adult Asian fashion model</option>
          <option>Adult European fashion model</option>
          <option>Adult Latina fashion model</option>
          <option>Adult Middle Eastern fashion model</option>
          <option>Adult South Asian fashion model</option>
          <option>Adult African fashion model</option>
        </select>
      </div>

      <div>
        <label>Appearance</label>

        <select id="appearance">
          <option>Elegant natural appearance</option>
          <option>Classic beauty</option>
          <option>Modern luxury appearance</option>
          <option>Editorial appearance</option>
          <option>Natural commercial appearance</option>
          <option>High-fashion appearance</option>
        </select>
      </div>

      <div>
        <label>Pose</label>

        <select id="pose">
          <option>Natural standing pose</option>
          <option>Confident walking pose</option>
          <option>Elegant seated pose</option>
          <option>Fashion runway pose</option>
          <option>Relaxed luxury pose</option>
          <option>Professional editorial pose</option>
        </select>
      </div>

      <div>
        <label>Model Styling</label>

        <select id="styling">
          <option>Polished luxury styling</option>
          <option>Modern city fashion styling</option>
          <option>Luxury resort styling</option>
          <option>High-fashion editorial styling</option>
          <option>Premium commercial styling</option>
        </select>
      </div>

    </div>

  </div>


  <!-- LOCATION -->
  <div class="card">

    <h2>🌍 Luxury Location</h2>

    <div class="grid">

      <div>
        <label>Country</label>

        <select id="country">

          <option>United Arab Emirates</option>
          <option>United States</option>
          <option>United Kingdom</option>
          <option>France</option>
          <option>Italy</option>
          <option>Spain</option>
          <option>Greece</option>
          <option>Switzerland</option>
          <option>Monaco</option>
          <option>Singapore</option>
          <option>Japan</option>
          <option>South Korea</option>
          <option>South Africa</option>
          <option>Nigeria</option>
          <option>Morocco</option>
          <option>Australia</option>

        </select>

      </div>


      <div>

        <label>City</label>

        <select id="city">

          <option>Dubai</option>
          <option>Abu Dhabi</option>
          <option>Miami</option>
          <option>New York</option>
          <option>Los Angeles</option>
          <option>Las Vegas</option>
          <option>London</option>
          <option>Paris</option>
          <option>Milan</option>
          <option>Rome</option>
          <option>Barcelona</option>
          <option>Mykonos</option>
          <option>Monaco</option>
          <option>Zurich</option>
          <option>Singapore</option>
          <option>Tokyo</option>
          <option>Seoul</option>
          <option>Cape Town</option>
          <option>Lagos</option>
          <option>Abuja</option>

        </select>

      </div>


      <div>

        <label>Location Type</label>

        <select id="locationType">

          <option>Luxury five-star hotel</option>
          <option>Luxury hotel lobby</option>
          <option>Luxury hotel rooftop</option>
          <option>Luxury resort</option>
          <option>Private luxury villa</option>
          <option>Modern designer house</option>
          <option>Luxury mansion</option>
          <option>Beach resort</option>
          <option>Private beach</option>
          <option>Luxury shopping district</option>
          <option>Designer fashion street</option>
          <option>Luxury restaurant</option>
          <option>Premium rooftop lounge</option>
          <option>Luxury poolside</option>
          <option>Luxury playground</option>
          <option>Beautiful garden</option>
          <option>Luxury marina</option>
          <option>Airport luxury lounge</option>
          <option>Mountain resort</option>
          <option>Desert luxury resort</option>

        </select>

      </div>


      <div>

        <label>Time / Atmosphere</label>

        <select id="atmosphere">

          <option>Golden hour</option>
          <option>Bright daytime</option>
          <option>Beautiful sunset</option>
          <option>Elegant evening</option>
          <option>Luxury night atmosphere</option>
          <option>Soft morning light</option>
          <option>Cinematic evening</option>

        </select>

      </div>

    </div>

  </div>


  <!-- CAR -->
  <div class="card">

    <h2>🚘 Luxury Vehicle</h2>

    <label>Vehicle</label>

    <select id="car">

      <option>No vehicle</option>
      <option>Black luxury SUV</option>
      <option>White luxury SUV</option>
      <option>Luxury Mercedes-Benz G-Class</option>
      <option>Luxury Range Rover</option>
      <option>Luxury Porsche</option>
      <option>Luxury BMW</option>
      <option>Luxury Audi</option>
      <option>Luxury Bentley</option>
      <option>Luxury Rolls-Royce</option>
      <option>Luxury Lamborghini</option>
      <option>Luxury Ferrari</option>
      <option>Luxury sports car</option>

    </select>

  </div>


  <!-- CAMPAIGN -->
  <div class="card">

    <h2>✨ Campaign Style</h2>

    <div class="grid">

      <div>

        <label>Fashion Campaign</label>

        <select id="campaign">

          <option>Luxury fashion campaign</option>
          <option>Fashion advertisement</option>
          <option>Designer campaign</option>
          <option>Magazine editorial</option>
          <option>Luxury resort campaign</option>
          <option>Luxury lifestyle campaign</option>
          <option>Social media fashion campaign</option>
          <option>Premium clothing advertisement</option>

        </select>

      </div>


      <div>

        <label>Photography</label>

        <select id="camera">

          <option>Professional fashion photography</option>
          <option>Luxury editorial photography</option>
          <option>Commercial photography</option>
          <option>Cinematic photography</option>
          <option>Magazine photography</option>
          <option>High-end studio photography</option>

        </select>

      </div>

    </div>

  </div>


  <!-- CUSTOM PROMPT -->
  <div class="card">

    <h2>🧠 AI Prompt Studio</h2>

    <label>Describe Your Vision</label>

    <textarea
      id="prompt"
      placeholder="Example: Create a premium fashion campaign using this outfit. Show the adult model naturally wearing the clothing at a luxury hotel in Dubai with polished commercial photography."
    ></textarea>

    <label>Optional Custom Location</label>

    <input
      id="customLocation"
      type="text"
      placeholder="Example: luxury hotel rooftop in Dubai"
    >

  </div>


  <!-- GENERATE -->
  <div class="card">

    <button
      id="generateBtn"
      class="generate"
    >
      ✨ GENERATE WITH OBITREND AI
    </button>

    <div id="status" class="status"></div>

  </div>


  <!-- RESULT -->
  <div id="resultCard" class="card result">

    <h2>✨ Your OBITREND Creation</h2>

    <img id="resultImage" alt="Generated fashion campaign">

    <br>

    <a
      id="downloadBtn"
      class="download"
      download="obitrend-fashion-campaign.png"
    >
      Download Image
    </a>

  </div>

</div>


<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const previewBox = document.getElementById("previewBox");
const generateBtn = document.getElementById("generateBtn");
const statusBox = document.getElementById("status");
const resultCard = document.getElementById("resultCard");
const resultImage = document.getElementById("resultImage");
const downloadBtn = document.getElementById("downloadBtn");


let imageData = null;


/* =========================
   IMAGE PREVIEW
========================= */

imageInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) {
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("Please select an image file.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {

    imageData = event.target.result;

    preview.src = imageData;

    previewBox.style.display = "block";

  };

  reader.onerror = function() {

    alert("Unable to read this image.");

  };

  reader.readAsDataURL(file);

});


/* =========================
   BUILD PROFESSIONAL PROMPT
========================= */

function buildPrompt() {

  const model =
    document.getElementById("model").value;

  const appearance =
    document.getElementById("appearance").value;

  const pose =
    document.getElementById("pose").value;

  const styling =
    document.getElementById("styling").value;

  const country =
    document.getElementById("country").value;

  const city =
    document.getElementById("city").value;

  const locationType =
    document.getElementById("locationType").value;

  const atmosphere =
    document.getElementById("atmosphere").value;

  const car =
    document.getElementById("car").value;

  const campaign =
    document.getElementById("campaign").value;

  const camera =
    document.getElementById("camera").value;

  const customLocation =
    document.getElementById("customLocation").value.trim();

  const userPrompt =
    document.getElementById("prompt").value.trim();


  const finalLocation =
    customLocation ||
    `${locationType} in ${city}, ${country}`;


  return `
Create a professional premium fashion campaign using the uploaded clothing item.

MODEL:
${model}

APPEARANCE:
${appearance}

STYLING:
${styling}

POSE:
${pose}

LOCATION:
${finalLocation}

COUNTRY:
${country}

CITY:
${city}

ATMOSPHERE:
${atmosphere}

VEHICLE:
${car}

CAMPAIGN:
${campaign}

PHOTOGRAPHY:
${camera}

CREATIVE DIRECTION:
${userPrompt || "Create a polished luxury fashion advertisement that presents the clothing clearly."}

IMPORTANT:
The model is an adult.
Show the clothing accurately and clearly.
Use tasteful professional fashion posing.
Keep the presentation suitable for a premium fashion brand.
No nudity.
No lingerie.
No erotic content.
No sexually suggestive posing.
No emphasis on intimate body areas.
Create sophisticated commercial fashion photography.
Preserve the clothing design, colors, patterns and important details from the uploaded image.

Make the final image look like a professionally produced international luxury fashion campaign.
`;
}


/* =========================
   GENERATE
========================= */

generateBtn.addEventListener("click", async function() {

  resultCard.style.display = "none";

  if (!imageData) {

    showStatus(
      "Please upload a clothing photo first.",
      true
    );

    return;
  }


  generateBtn.disabled = true;

  generateBtn.textContent =
    "✨ CREATING YOUR FASHION CAMPAIGN...";


  showStatus(
    "OBITREND AI is creating your professional fashion campaign..."
  );


  try {

    const prompt = buildPrompt();


    const response = await fetch(
      "/api/generate",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          image: imageData,

          prompt: prompt

        })
      }
    );


    let data;

    try {

      data = await response.json();

    } catch {

      throw new Error(
        "The server returned an invalid response."
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Image generation failed."
      );

    }


    if (!data.image) {

      throw new Error(
        "No generated image was returned."
      );

    }


    resultImage.src = data.image;

    downloadBtn.href = data.image;

    resultCard.style.display = "block";

    showStatus(
      "✨ Your OBITREND fashion campaign is ready!"
    );

    resultCard.scrollIntoView({
      behavior: "smooth"
    });


  } catch (error) {

    console.error(error);

    showStatus(
      error.message ||
      "Something went wrong while generating the image.",
      true
    );

  } finally {

    generateBtn.disabled = false;

    generateBtn.textContent =
      "✨ GENERATE WITH OBITREND AI";

  }

});


/* =========================
   STATUS
========================= */

function showStatus(message, isError = false) {

  statusBox.textContent = message;

  statusBox.style.display = "block";

  statusBox.className =
    "status" +
    (isError ? " error" : "");

}

</script>

</body>
</html>
