<!-- ================================
     OBITREND AI PROMPT STUDIO
     ================================ -->

<section class="prompt-studio">

  <h2>🧠 AI Prompt Studio</h2>

  <label for="obitrendPrompt">
    DESCRIBE YOUR VISION
  </label>

  <textarea
    id="obitrendPrompt"
    name="prompt"
    placeholder="Describe the fashion campaign you want..."
  >Create exactly using a premium realistic quality</textarea>


  <!-- MODEL STYLE -->
  <label for="modelStyle">
    👩 ADULT FASHION MODEL
  </label>

  <select id="modelStyle">
    <option value="a sophisticated adult female fashion model">
      Sophisticated Adult Model
    </option>

    <option value="a glamorous adult female fashion model">
      Glamorous Adult Model
    </option>

    <option value="a confident adult female fashion model">
      Confident Adult Model
    </option>

    <option value="a curvy adult female fashion model">
      Curvy Adult Model
    </option>

    <option value="an elegant adult female fashion model">
      Elegant Adult Model
    </option>

    <option value="a professional African adult female fashion model">
      African Fashion Model
    </option>

    <option value="a high-fashion editorial adult female model">
      Editorial Model
    </option>
  </select>


  <!-- CITY -->
  <label for="cityCountry">
    🌍 CITY & COUNTRY
  </label>

  <select id="cityCountry">

    <option value="">
      Select a city
    </option>

    <option value="Dubai, United Arab Emirates">
      🇦🇪 Dubai, UAE
    </option>

    <option value="Paris, France">
      🇫🇷 Paris, France
    </option>

    <option value="London, United Kingdom">
      🇬🇧 London, UK
    </option>

    <option value="New York City, United States">
      🇺🇸 New York, USA
    </option>

    <option value="Lagos, Nigeria">
      🇳🇬 Lagos, Nigeria
    </option>

    <option value="Abuja, Nigeria">
      🇳🇬 Abuja, Nigeria
    </option>

    <option value="Milan, Italy">
      🇮🇹 Milan, Italy
    </option>

    <option value="Miami, United States">
      🇺🇸 Miami, USA
    </option>

    <option value="Singapore">
      🇸🇬 Singapore
    </option>

    <option value="Doha, Qatar">
      🇶🇦 Doha, Qatar
    </option>

  </select>


  <!-- LUXURY LOCATION -->
  <label for="luxuryLocation">
    🏨 LUXURY LOCATION
  </label>

  <select id="luxuryLocation">

    <option value="">
      Select a luxury location
    </option>

    <option value="inside an ultra-luxury five-star hotel">
      ⭐ Five-Star Luxury Hotel
    </option>

    <option value="on a luxurious hotel rooftop overlooking the city">
      🌃 Luxury Hotel Rooftop
    </option>

    <option value="inside a modern luxury penthouse">
      🏙️ Luxury Penthouse
    </option>

    <option value="in front of a magnificent luxury villa">
      🏡 Luxury Villa
    </option>

    <option value="at a beautiful luxury beach resort">
      🏝️ Luxury Beach Resort
    </option>

    <option value="beside an elegant infinity swimming pool">
      🏊 Infinity Pool
    </option>

    <option value="inside a premium luxury shopping mall">
      🛍️ Luxury Shopping Mall
    </option>

    <option value="at an elegant high-end restaurant">
      🍽️ Luxury Restaurant
    </option>

    <option value="at a beautiful modern city rooftop">
      🌆 City Rooftop
    </option>

    <option value="on a luxury yacht">
      🛥️ Luxury Yacht
    </option>

  </select>


  <!-- LUXURY CAR -->
  <label for="luxuryCar">
    🚘 LUXURY CAR
  </label>

  <select id="luxuryCar">

    <option value="">
      No specific car
    </option>

    <option value="beside a luxury Mercedes-Benz G-Class SUV">
      Mercedes G-Class
    </option>

    <option value="beside a luxury Range Rover SUV">
      Range Rover
    </option>

    <option value="beside a luxury Lamborghini">
      Lamborghini
    </option>

    <option value="beside a luxury Ferrari">
      Ferrari
    </option>

    <option value="beside a luxury Bentley">
      Bentley
    </option>

    <option value="beside a luxury Porsche">
      Porsche
    </option>

    <option value="beside a luxury Rolls-Royce">
      Rolls-Royce
    </option>

  </select>


  <!-- LIFESTYLE -->
  <label for="lifestyleScene">
    ✨ LIFESTYLE SCENE
  </label>

  <select id="lifestyleScene">

    <option value="">
      Select lifestyle scene
    </option>

    <option value="relaxing elegantly in a luxury lounge">
      🛋️ Luxury Lounge
    </option>

    <option value="enjoying a premium coffee at a beautiful modern cafe">
      ☕ Luxury Cafe
    </option>

    <option value="walking through an upscale shopping district">
      🛍️ Shopping District
    </option>

    <option value="relaxing beside a beautiful swimming pool">
      🏊 Poolside
    </option>

    <option value="walking through a beautiful luxury resort">
      🌴 Luxury Resort
    </option>

    <option value="standing on an elegant rooftop during golden hour">
      🌅 Golden Hour Rooftop
    </option>

    <option value="enjoying an elegant outdoor dinner">
      🍽️ Outdoor Dinner
    </option>

  </select>


  <!-- POSE -->
  <label for="fashionPose">
    📸 PROFESSIONAL POSE
  </label>

  <select id="fashionPose">

    <option value="standing confidently in a professional fashion pose">
      Confident Standing
    </option>

    <option value="walking naturally like a professional fashion campaign model">
      Walking Fashion Pose
    </option>

    <option value="standing elegantly with one hand on the waist">
      Hand On Waist
    </option>

    <option value="sitting elegantly in a luxury environment">
      Elegant Sitting
    </option>

    <option value="leaning naturally against a luxury car">
      Luxury Car Pose
    </option>

    <option value="posing naturally while looking confidently toward the camera">
      Looking At Camera
    </option>

  </select>


  <!-- CAMPAIGN STYLE -->
  <label for="campaignStyle">
    🎬 CAMPAIGN STYLE
  </label>

  <select id="campaignStyle">

    <option value="a premium luxury fashion campaign">
      Luxury Campaign
    </option>

    <option value="a high-end fashion magazine editorial">
      Fashion Magazine
    </option>

    <option value="a cinematic luxury fashion advertisement">
      Cinematic Advertisement
    </option>

    <option value="a professional Instagram fashion campaign">
      Social Media Campaign
    </option>

    <option value="a sophisticated designer fashion campaign">
      Designer Campaign
    </option>

    <option value="a premium realistic commercial fashion photoshoot">
      Commercial Photoshoot
    </option>

  </select>


  <!-- CUSTOM LOCATION -->
  <label for="obitrendLocation">
    OPTIONAL CUSTOM LOCATION
  </label>

  <input
    type="text"
    id="obitrendLocation"
    name="location"
    placeholder="Example: luxury hotel rooftop in Dubai"
  />


  <!-- GENERATE BUTTON -->
  <button
    type="button"
    id="obitrendGenerateButton"
  >
    ✨ GENERATE WITH OBITREND AI
  </button>


  <!-- STATUS -->
  <div id="obitrendStatus">
    ✨ Your OBITREND fashion campaign is ready!
  </div>

</section>


<script>
(function () {

  const promptBox = document.getElementById("obitrendPrompt");
  const customLocation = document.getElementById("obitrendLocation");

  const modelStyle = document.getElementById("modelStyle");
  const cityCountry = document.getElementById("cityCountry");
  const luxuryLocation = document.getElementById("luxuryLocation");
  const luxuryCar = document.getElementById("luxuryCar");
  const lifestyleScene = document.getElementById("lifestyleScene");
  const fashionPose = document.getElementById("fashionPose");
  const campaignStyle = document.getElementById("campaignStyle");

  const generateButton =
    document.getElementById("obitrendGenerateButton");

  if (!generateButton) return;

  generateButton.addEventListener("click", function () {

    const originalPrompt =
      promptBox.value.trim();

    const model =
      modelStyle.value;

    const city =
      cityCountry.value;

    const location =
      luxuryLocation.value;

    const car =
      luxuryCar.value;

    const lifestyle =
      lifestyleScene.value;

    const pose =
      fashionPose.value;

    const campaign =
      campaignStyle.value;

    const custom =
      customLocation.value.trim();


    let finalPrompt = originalPrompt;

    finalPrompt +=
      "\n\nMODEL: " + model + ".";

    if (city) {
      finalPrompt +=
        "\nLOCATION CITY AND COUNTRY: " + city + ".";
    }

    if (location) {
      finalPrompt +=
        "\nLUXURY LOCATION: " + location + ".";
    }

    if (car) {
      finalPrompt +=
        "\nLUXURY CAR: " + car + ".";
    }

    if (lifestyle) {
      finalPrompt +=
        "\nLIFESTYLE SCENE: " + lifestyle + ".";
    }

    if (pose) {
      finalPrompt +=
        "\nPOSE: " + pose + ".";
    }

    if (campaign) {
      finalPrompt +=
        "\nCAMPAIGN STYLE: " + campaign + ".";
    }

    if (custom) {
      finalPrompt +=
        "\nCUSTOM LOCATION: " + custom + ".";
    }


    finalPrompt +=
      "\n\nCreate a photorealistic professional fashion campaign image. " +
      "Preserve the uploaded clothing item's important design, color, " +
      "shape, fabric appearance and details. " +
      "Use realistic human proportions, natural lighting, " +
      "professional fashion photography and a premium luxury aesthetic.";


    /*
      Put the completed prompt into the existing prompt field.
      Your existing working generator can then use it.
    */

    promptBox.value = finalPrompt;


    const status =
      document.getElementById("obitrendStatus");

    if (status) {
      status.textContent =
        "✨ OBITREND campaign settings applied. Generating...";
    }

  });

})();
</script>
