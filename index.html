<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBITREND AI Fashion Creator</title>

<meta name="description"
content="OBITREND AI Fashion Creator - Create professional AI fashion campaigns, luxury lifestyle scenes and creative visuals.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#08090d;
  --panel:#11131a;
  --panel2:#171a22;
  --border:#292d38;
  --text:#f7f7f8;
  --muted:#9ca3af;
  --gold:#d7ad5a;
  --gold2:#f3d38a;
  --danger:#ef4444;
  --success:#22c55e;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at top right,rgba(215,173,90,.12),transparent 30%),
    radial-gradient(circle at top left,rgba(90,90,255,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
select,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:20px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:18px 22px;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(17,19,26,.92);
  backdrop-filter:blur(18px);
  margin-bottom:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:52px;
  height:52px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#f3d38a,#a87827);
  color:#111;
  font-size:25px;
  font-weight:900;
  box-shadow:0 10px 35px rgba(215,173,90,.25);
}

.brand h1{
  font-size:21px;
  letter-spacing:.5px;
}

.brand p{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 13px;
  border:1px solid var(--border);
  border-radius:999px;
  color:#b9c0cc;
  font-size:12px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 12px var(--success);
}

/* MAIN */

.layout{
  display:grid;
  grid-template-columns:390px 1fr;
  gap:20px;
}

.panel{
  background:rgba(17,19,26,.95);
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
}

.panel-title{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
}

.panel-title h2{
  font-size:16px;
}

.panel-title p{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.form{
  padding:18px;
}

.section{
  margin-bottom:20px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:#d8dce5;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:11px;
  color:var(--muted);
}

select,
input,
textarea{
  width:100%;
  border:1px solid var(--border);
  background:#0c0e13;
  color:var(--text);
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}

select:focus,
input:focus,
textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(215,173,90,.08);
}

textarea{
  min-height:100px;
  resize:vertical;
}

/* UPLOAD */

.upload{
  border:1px dashed #454b58;
  border-radius:15px;
  padding:18px;
  text-align:center;
  background:#0c0e13;
  transition:.2s;
}

.upload:hover{
  border-color:var(--gold);
}

.upload-icon{
  font-size:28px;
  margin-bottom:7px;
}

.upload p{
  color:var(--muted);
  font-size:11px;
  margin-bottom:10px;
}

.upload input{
  border:0;
  padding:0;
}

/* BUTTONS */

.actions{
  display:flex;
  gap:10px;
  margin-top:8px;
}

.generate{
  flex:1;
  border:0;
  border-radius:13px;
  padding:14px;
  font-weight:900;
  color:#111;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  box-shadow:0 12px 30px rgba(215,173,90,.18);
}

.generate:hover{
  transform:translateY(-1px);
}

.reset{
  width:48px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#171920;
  color:#ddd;
}

/* PREVIEW */

.preview-panel{
  min-height:760px;
  display:flex;
  flex-direction:column;
}

.preview-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 20px;
  border-bottom:1px solid var(--border);
}

.preview-header h2{
  font-size:16px;
}

.preview-header span{
  color:var(--muted);
  font-size:11px;
}

.preview-area{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  min-height:680px;
}

.empty{
  text-align:center;
  max-width:400px;
}

.empty-icon{
  width:90px;
  height:90px;
  margin:0 auto 18px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#181b23;
  border:1px solid var(--border);
  font-size:38px;
}

.empty h3{
  font-size:18px;
  margin-bottom:8px;
}

.empty p{
  color:var(--muted);
  line-height:1.6;
  font-size:13px;
}

/* IMAGE */

.result{
  width:100%;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

#preview{
  display:block;
  width:100%;
  max-width:850px;
  max-height:650px;
  object-fit:contain;
  border-radius:18px;
  border:1px solid var(--border);
  background:#050608;
}

.result-actions{
  display:flex;
  gap:10px;
}

.result-actions button{
  border:1px solid var(--border);
  background:#171920;
  color:#fff;
  padding:10px 15px;
  border-radius:11px;
}

.result-actions .download{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
  font-weight:800;
}

/* LOADING */

.loading{
  display:none;
  text-align:center;
}

.loader{
  width:55px;
  height:55px;
  margin:0 auto 18px;
  border-radius:50%;
  border:4px solid #292d38;
  border-top-color:var(--gold);
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading h3{
  margin-bottom:7px;
}

.loading p{
  color:var(--muted);
  font-size:12px;
}

/* ERROR */

.error{
  display:none;
  padding:15px;
  margin:15px 20px;
  border-radius:12px;
  border:1px solid rgba(239,68,68,.35);
  background:rgba(239,68,68,.08);
  color:#ffb4b4;
  font-size:12px;
}

/* TAGS */

.quick-tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:9px;
}

.tag{
  border:1px solid var(--border);
  background:#151820;
  color:#c9ced8;
  border-radius:999px;
  padding:7px 10px;
  font-size:10px;
}

.tag:hover{
  border-color:var(--gold);
  color:var(--gold2);
}

/* FOOTER */

.footer{
  text-align:center;
  color:#686f7d;
  font-size:11px;
  padding:20px;
}

/* MOBILE */

@media(max-width:950px){

  .layout{
    grid-template-columns:1fr;
  }

  .preview-panel{
    min-height:600px;
  }

  .preview-area{
    min-height:500px;
  }

}

@media(max-width:600px){

  .app{
    padding:10px;
  }

  .header{
    padding:14px;
    border-radius:17px;
  }

  .brand h1{
    font-size:17px;
  }

  .logo{
    width:44px;
    height:44px;
  }

  .status{
    display:none;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .preview-panel{
    min-height:500px;
  }

  .preview-area{
    min-height:420px;
    padding:12px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">

    <div class="logo">O</div>

    <div>
      <h1>OBITREND AI</h1>
      <p>Professional Fashion & Lifestyle Creator</p>
    </div>

  </div>

  <div class="status">
    <span class="status-dot"></span>
    AI Studio Ready
  </div>

</header>


<div class="layout">


<!-- LEFT CONTROL PANEL -->

<section class="panel">

  <div class="panel-title">
    <h2>AI Campaign Studio</h2>
    <p>Build your professional visual scene</p>
  </div>

  <div class="form">


    <!-- VISION -->

    <div class="section">

      <div class="section-title">
        ✨ Describe Your Vision
      </div>

      <div class="field">
        <textarea
          id="vision"
          placeholder="Example: Create a luxury fashion campaign with an elegant adult model wearing the uploaded outfit..."
        ></textarea>
      </div>
