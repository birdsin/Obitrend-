<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBITREND AI Fashion Creator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#07080c;
  color:#fff;
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:16px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:18px;
  margin-bottom:16px;
  border:1px solid #2b2e38;
  border-radius:22px;
  background:linear-gradient(145deg,#15171e,#0e1015);
  box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#f4d68e,#b98028);
  color:#090909;
  font-size:32px;
  font-weight:900;
}

.brand h1{
  font-size:22px;
}

.brand p{
  margin-top:4px;
  color:#999eaa;
  font-size:12px;
}

.status{
  border:1px solid #30343f;
  border-radius:50px;
  padding:9px 13px;
  font-size:11px;
  color:#b9bec8;
}

.status span{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:#22c55e;
}

/* MAIN */

.layout{
  display:grid;
  grid-template-columns:400px 1fr;
  gap:16px;
  align-items:start;
}

.panel{
  border:1px solid #292d37;
  border-radius:22px;
  background:#101218;
  overflow:hidden;
}

.panel-heading{
  padding:20px;
  border-bottom:1px solid #292d37;
}

.panel-heading h2{
  font-size:19px;
}

.panel-heading p{
  margin-top:5px;
  color:#999eaa;
  font-size:12px;
}

/* FORM */

.form{
  padding:18px;
}

.section{
  margin-bottom:22px;
}

.section-title{
  margin-bottom:10px;
  color:#e6e8ed;
  font-size:12px;
  font-weight:bold;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  min-width:0;
}

.field.full{
  grid-column:1/-1;
}

label{
  display:block;
  margin-bottom:6px;
  color:#8f95a2;
  font-size:11px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #30343f;
  border-radius:12px;
  outline:none;
  background:#090b10;
  color:#fff;
  padding:12px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#d6ae5a;
  box-shadow:0 0 0 3px rgba(214,174,90,.08);
}

textarea{
  min-height:120px;
  resize:vertical;
  line-height:1.5;
}

/* QUICK OPTIONS */

.quick-options{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:9px;
}

.quick{
  border:1px solid #30343f;
  border-radius:50px;
  padding:7px 10px;
  background:#171a21;
  color:#c6cad2;
  font-size:10px;
}

.quick:hover{
  border-color:#d6ae5a;
  color:#f1d58e;
}

/* UPLOAD */

.upload{
  border:1px dashed #464b58;
  border-radius:15px;
  padding:17px;
  text-align:center;
  background:#0b0d12;
}

.upload-icon{
  font-size:28px;
  margin-bottom:6px;
}

.upload p{
  color:#8f95a2;
  font-size:11px;
  margin-bottom:10px;
}

.upload input{
  border:0;
  padding:0;
}

/* GENERATE AREA */

.generate-area{
  position:sticky;
  bottom:0;
  z-index:20;
  padding:15px 0 4px;
  background:linear-gradient(
    to bottom,
    rgba(16,18,24,0),
    #101218 18%
  );
}

.generate-button{
  display:block;
  width:100%;
  min-height:56px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#f5d993,#c28b2e);
  color:#111;
  font-size:14px;
  font-weight:900;
  letter-spacing:.3px;
  box-shadow:0 12px 35px rgba
