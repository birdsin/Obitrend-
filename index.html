<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBITREND AI Fashion Creator</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(126,87,194,.28), transparent 35%),
    radial-gradient(circle at top right, rgba(0,188,212,.20), transparent 35%),
    #070914;
  color: #fff;
  min-height: 100vh;
}

button,
select,
input,
textarea {
  font: inherit;
}

.header {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(20px);
  background: rgba(7,9,20,.86);
  border-bottom: 1px solid rgba(255,255,255,.10);
}

.header-inner {
  max-width: 1250px;
  margin: auto;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#8b5cf6,#06b6d4);
  font-size: 22px;
  box-shadow: 0 10px 35px rgba(99,102,241,.35);
}

.logo strong {
  font-size: 20px;
  letter-spacing: .5px;
}

.logo small {
  display: block;
  color: #9ca3af;
  margin-top: 2px;
}

.badge {
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(34,197,94,.12);
  border: 1px solid rgba(34,197,94,.25);
  color: #86efac;
  font-size: 12px;
}

.container {
  max-width: 1250px;
  margin: auto;
  padding: 30px 18px 70px;
}

.hero {
  text-align: center;
  padding: 25px 0 30px;
}

.hero h1 {
  margin: 0;
  font-size: clamp(32px, 7vw, 64px);
  line-height: 1;
  background: linear-gradient(90deg,#fff,#c4b5fd,#67e8f9);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  max-width: 720px;
  margin: 18px auto 0;
  color: #aeb6c8;
  font-size: 16px;
  line-height: 1.7;
}

.workspace {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 22px;
}

.card {
  background: rgba(15,19,35,.78);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 25px 70px rgba(0,0,0,.28);
}

.card h2 {
  margin: 0 0 18px;
  font-size: 19px;
}

.section-title {
  margin: 25px 0 10px;
  font-size: 12px;
  color: #8fa0bd;
  text-transform: uppercase;
  letter-spacing: 1.3px;
}

label {
  display: block;
  margin-bottom: 7px;
  color: #cbd5e1;
  font-size: 13px;
}

textarea,
select,
input[type="text"] {
  width: 100%;
  color: #fff;
  background: #0a0e1c;
  border: 1px solid #26304a;
  border-radius: 13px;
  padding: 13px;
  outline: none;
}

textarea {
  min-height: 105px;
  resize: vertical;
}

select:focus,
textarea:focus,
input:focus {
  border-color: #8b5cf6;
  box-shadow: 0 0 0 3px rgba(139,92,246,.12);
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
}

.upload {
  position: relative;
  min-height: 180px;
  border: 1.5px dashed #465274;
  border-radius: 18px;
  display: grid;
  place-items: center;
  text-align: center;
  cursor: pointer;
  overflow: hidden;
  background: #090d1a;
}

.upload:hover {
  border-color: #8b5cf6;
}

.upload input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.upload-content {
  padding: 20px;
}

.upload-icon {
  font-size: 38px;
  margin-bottom: 8px;
}

.upload small {
  color: #7f8aa3;
}

#preview {
  display: none;
  width: 100%;
  max-height: 320px;
  object-fit: contain;
  border-radius: 15px;
}

.preview-wrap {
  display: none;
  margin-top: 12px;
}

.remove-photo {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  border: 0;
  border-radius: 10px;
  background: #26131a;
  color: #fca5a5;
  cursor: pointer;
}
