<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBITREND Premium Templates</title>
<script type="module" src="/supabase.js"></script>
<script src="/studio/template-catalog.js"></script>
<style>
:root{color-scheme:dark;--gold:#d4af37;--purple:#7651a8;--panel:#111113;--muted:#a5a5aa}
*{box-sizing:border-box}body{margin:0;background:#080809;color:#f7f4ed;font:14px Manrope,system-ui,sans-serif}
main{max-width:1440px;margin:auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{font-weight:900;letter-spacing:.12em;color:#e8ca78}.nav{color:#bcb8ad}
.gallery{border:1px solid #35302a;border-radius:22px;background:linear-gradient(145deg,#151416,#0d0c10);padding:24px;box-shadow:0 18px 60px #0008}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(25px,4vw,42px);margin:0 0 6px}.sub{color:var(--muted);margin:0}
.pro-pill{border:1px solid #a98b3e;border-radius:10px;padding:10px 14px;color:#f3d98c;font-weight:800}
.controls{display:grid;grid-template-columns:minmax(180px,1fr) auto auto minmax(120px,170px);gap:10px;margin:22px 0 16px}
input,select,button{font:inherit}input,select{min-width:0;background:#171719;border:1px solid #51452c;border-radius:10px;padding:12px;color:white}.category-picker{position:relative;min-width:0}.category-picker>button{width:100%;min-height:43px;display:flex;justify-content:space-between;align-items:center;background:#171719;border:1px solid #51452c;border-radius:10px;padding:12px;color:white;text-align:left}.category-menu{position:absolute;z-index:50;top:calc(100% + 8px);left:0;right:0;max-height:min(60vh,420px);overflow:auto;background:#171619;border:1px solid #806b3b;border-radius:14px;box-shadow:0 16px 45px #000c;padding:6px}.category-menu[hidden]{display:none}.category-option{display:block;width:100%;padding:12px;text-align:left;background:transparent;border:0;border-radius:8px;color:#eee}.category-option[aria-selected=true]{background:#3b3020;color:#f3d17b}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{border:1px solid #47413a;background:#1a191b;color:#ddd;border-radius:999px;padding:10px 15px}
.filters button.active{background:#f2d17c;color:#15110a;border-color:#f2d17c;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.card{position:relative;overflow:hidden;border:1px solid #37312b;border-radius:15px;background:#171619;min-width:0}
.photo{height:154px;position:relative;background:linear-gradient(145deg,#252329,#17151b)}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo.photo-unavailable:after{content:"LOCATION PHOTO UNAVAILABLE";position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;color:#d4c49a;font-size:10px;font-weight:800;letter-spacing:.12em;background:linear-gradient(145deg,rgba(20,18,24,.94),rgba(42,35,29,.9))}.card.locked .photo img{filter:blur(2px) brightness(.72);transform:scale(1.05)}
.lock{position:absolute;inset:0;display:grid;place-items:center}.lock span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--gold);background:#090909d9;color:#f1cf75;font-size:23px;box-shadow:0 0 20px #d4af374d}
.tier{position:absolute;top:9px;right:9px;background:#f0cf78;color:#15110a;border-radius:7px;padding:4px 8px;font-size:10px;font-weight:900}
.details{padding:11px}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:#aaa;font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.use{width:100%;margin-top:10px;padding:9px;border:0;border-radius:8px;background:#e9c76f;color:#17120a;font-weight:900}.use:disabled{background:#29272a;color:#aaa}
.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#aaa;margin-top:20px;flex-wrap:wrap}
.pages{display:flex;gap:7px}.pages button{background:#1c1b1e;color:white;border:1px solid #484044;border-radius:8px;padding:8px 12px}
.empty{padding:50px;text-align:center;color:#aaa;grid-column:1/-1}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){main{padding:13px}.gallery{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.photo{height:130px}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.footer{font-size:12px}}
</style></head>
<body><main>
<header><div class="brand">◇ OBITREND</div><div class="nav">CREATOR STUDIO / TEMPLATES</div></header>
<section class="gallery">
<div class="top"><div><h1>Premium Templates Gallery</h1><p class="sub" id="summary">Loading your template library…</p><p class="sub" id="libraryTotal" style="margin-top:7px;color:#e8ca78;font-weight:800">2,120 templates · 20 tools · 106 templates per tool</p></div><div class="pro-pill" id="account">Checking account…</div></div>
<div class="controls"><input id="search" type="search" placeholder="⌕ Search templates…"><div class="filters"><button class="active" data-filter="all">All</button><button data-filter="free">Free</button><button data-filter="pro">PRO</button></div><select id="toolSelect" aria-label="Choose generation tool"><option value="">Choose a generation tool…</option></select><div class="category-picker" id="categoryPicker"><button type="button" id="categoryTrigger" aria-expanded="false">All categories <span>⌄</span></button><div id="categoryMenu" class="category-menu" hidden></div></div><select id="sort"><option value="new">Newest</option><option value="popular">Popular</option><option value="free">Free first</option></select></div>
<div class="grid" id="grid"></div>
<div class="footer"><span id="count"></span><div class="pages"><button id="prev">‹</button><span id="page"></span><button id="next">›</button></div></div>
</section></main>
<script>
(function(){
const catalog=window.OBITREND_TEMPLATE_CATALOG||{};const params=new URLSearchParams(location.search);
let toolId=params.get("tool")||"";let isPro=false,templates=[],filter="all",page=1,perPage=20;
const $=id=>document.getElementById(id);let selectedCategory="";const safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function pricing(){location.href="/studio/pricing"}
async function account(){
 const client=window.obitrendSupabase||window.supabase;
 if(!client?.auth){$("account").textContent="Waiting for sign-in…";return false}
 const {data}=await client.auth.getSession();const token=data?.session?.access_token;
 if(!token){$("account").textContent="Sign in required";isPro=false;return false}
 const response=await fetch("/api/account",{headers:{Authorization:"Bearer "+token,Accept:"application/json"},cache:"no-store"});
 const payload=await response.json();if(!response.ok||!payload?.ok)throw new Error(payload?.error||"Account check failed");
 isPro=payload.account?.pro?.active===true;
 const exp=payload.account?.pro?.expiresAt;let renewal="";if(exp){const days=Math.max(0,Math.ceil((new Date(exp).getTime()-Date.now())/86400000));renewal=" · Renewal in "+days+" days"}
 $("account").textContent=isPro?"♛ PRO"+renewal+" · "+(payload.account?.imageCredits?.available??0)+" credits":"FREE ACCOUNT";return true;
}
function init(){
 const toolSelect=$("toolSelect");
 if(toolSelect&&!toolSelect.dataset.ready){toolSelect.innerHTML='<option value="">Choose a generation tool…</option>'+Object.keys(catalog).map(id=>'<option value="'+safe(id)+'">'+safe(catalog[id].title||id)+' · '+Number(catalog[id].total||catalog[id].templates?.length||0).toLocaleString()+" templates"+'</option>').join("");toolSelect.value=toolId;toolSelect.addEventListener("change",()=>{toolId=toolSelect.value;const next=new URL(location.href);if(toolId)next.searchParams.set("tool",toolId);else next.searchParams.delete("tool");history.replaceState(null,"",next);page=1;selectedCategory="";$("categoryTrigger").innerHTML='All categories <span>⌄</span>';document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x.dataset.filter==="all"));filter="all";init()});toolSelect.dataset.ready="true"}else if(toolSelect)toolSelect.value=toolId;
 const tool=catalog[toolId];if(!tool){templates=[];$("summary").textContent="Browse the complete OBITREND template library by choosing any of the 20 creative tools."; $("libraryTotal").textContent=(Object.keys(catalog).reduce((sum,id)=>sum+Number(catalog[id].total||catalog[id].templates?.length||0),0)).toLocaleString()+" templates across "+Object.keys(catalog).length+" tools · choose a tool to view its collection"; $("grid").innerHTML='<div class="empty">Select one of the 20 OBITREND tools above to view its location templates.</div>';$("count").textContent="20 generation tools available";$("page").textContent="";$("prev").disabled=true;$("next").disabled=true;return}
 templates=tool.templates||[];$("summary").textContent=Number(tool.total||templates.length).toLocaleString()+" AI templates for "+(tool.title||toolId)+" · "+tool.free+" Free · "+tool.pro+" PRO";$("libraryTotal").textContent=(Object.keys(catalog).reduce((sum,id)=>sum+Number(catalog[id].total||catalog[id].templates?.length||0),0)).toLocaleString()+" templates across "+Object.keys(catalog).length+" tools · "+(templates.length||Number(tool.total||0))+" in this collection";
 const cats=[...new Set(templates.map(t=>t.category).filter(Boolean))];
 $("categoryMenu").innerHTML=[{name:"All categories",value:""},...cats.map(x=>({name:x,value:x}))].map(x=>'<button type="button" class="category-option" data-value="'+safe(x.value)+'" aria-selected="false">'+safe(x.name)+'</button>').join("");
 $("categoryTrigger").onclick=()=>{$("categoryMenu").hidden=!$("categoryMenu").hidden;$("categoryTrigger").setAttribute("aria-expanded",String(!$("categoryMenu").hidden))};
 $("categoryMenu").querySelectorAll("button").forEach(b=>b.onclick=()=>{selectedCategory=b.dataset.value;$("categoryTrigger").innerHTML=safe(selectedCategory||"All categories")+' <span>⌄</span>';$("categoryMenu").hidden=true;$("categoryTrigger").setAttribute("aria-expanded","false");page=1;render()});
 document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;page=1;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()}));
 ["search","sort"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",()=>{page=1;render()}));
 $("prev").onclick=()=>{page=Math.max(1,page-1);render()};$("next").onclick=()=>{page++;render()};
 render();
}
function render(){
 let list=templates.filter(t=>(filter==="all"||t.tier===filter)&&(!selectedCategory||t.category===selectedCategory)&&((t.name+" "+(t.category||"")+" "+(t.tags||[]).join(" ")).toLowerCase().includes($("search").value.toLowerCase())));
 const sort=$("sort").value;if(sort==="free")list.sort((a,b)=>(a.tier==="free"?0:1)-(b.tier==="free"?0:1));else if(sort==="popular")list.sort((a,b)=>(b.popularity||0)-(a.popularity||0));else list.sort((a,b)=>b.id.localeCompare(a.id));
 const max=Math.max(1,Math.ceil(list.length/perPage));page=Math.min(page,max);const visible=list.slice((page-1)*perPage,page*perPage);
 $("grid").innerHTML=visible.length?visible.map(t=>{const locked=t.tier==="pro"&&!isPro;return '<article class="card '+(locked?"locked":"")+'"><div class="photo"><img loading="lazy" src="'+safe(t.preview||"")+'" alt="'+safe(t.name)+' preview" onerror="this.onerror=null;this.remove();this.parentNode.classList.add(\'photo-unavailable\')">'+(locked?'<div class="lock"><span>🔒</span></div>':'')+'<b class="tier">'+(t.tier==="free"?"FREE":"♛ PRO")+'</b></div><div class="details"><div class="name">'+safe(t.name)+'</div><div class="meta">'+safe(t.exact_location||t.region||t.category||toolId)+'</div><button class="use" data-id="'+safe(t.id)+'" '+(locked?'data-locked="true"':'')+'>'+(locked?"🔒 Upgrade to Use":"↓ Use Template")+'</button></div></article>'}).join(""):'<div class="empty">No templates match your search.</div>';
 $("grid").querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.locked){pricing();return}const t=templates.find(x=>x.id===b.dataset.id);if(t){const destinationToolId=toolId;sessionStorage.setItem("obitrend-selected-template",JSON.stringify({toolId,destinationToolId,id:t.id,name:t.name,category:t.category||"",prompt:t.prompt||"",preview:t.preview||"",exact_location:t.exact_location||t.region||""}));const destination="/studio/tools/"+encodeURIComponent(destinationToolId);const next=new URL(destination,location.origin);next.searchParams.set("template",t.id);location.href=next.pathname+next.search}}));
 $("count").textContent="Showing "+(list.length?((page-1)*perPage+1):0)+"–"+Math.min(page*perPage,list.length)+" of "+list.length+" · "+tool.free+" Free · "+tool.pro+" PRO";
 $("page").textContent="Page "+page+" of "+max;$("prev").disabled=page===1;$("next").disabled=page===max;
}
window.addEventListener("obitrend:supabase-ready",()=>account().then(()=>{if(catalog[toolId])render()}).catch(()=>{$("account").textContent="Account check failed";isPro=false;if(catalog[toolId])render()}));
account().then(init).catch(()=>{init();$("account").textContent="Account check failed — locked items stay locked"});
})();
</script></body></html>
