bsolute;top:55px;left:36px;width:85px;height:205px;border-radius:42% 42% 25% 25%;background:linear-gradient(90deg,#555,#aaa,#555);clip-path:polygon(20% 0,80% 0,100% 22%,82% 48%,78% 100%,56% 100%,50% 55%,43% 100%,20% 100%,18% 48%,0 22%)}.leg{position:absolute;top:240px;width:32px;height:145px;background:linear-gradient(90deg,#4e4e4e,#aaa,#555);border-radius:16px}.leg.left{left:43px}.leg.right{left:80px}.pose-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pose-grid .mini img{height:90px}.before-after{display:grid;grid-template-columns:1fr 1fr;gap:10px}.before-after figure{margin:0;position:relative}.before-after img{width:100%;height:245px;object-fit:cover;border-radius:8px}.before-after figcaption{font-size:10px;color:var(--beige);margin-top:5px}.model-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.model-grid .mini img{height:155px}.model-grid .mini.selected{border-color:var(--beige);box-shadow:0 0 15px #d4af3735}.status{border:1px solid #d4af3755;border-radius:8px;padding:10px;margin-top:12px;color:#e6d5ac;font-size:11px}.bottom{padding:10px 20px;border-top:1px solid #d4af3744;color:#aaa;font-size:10px;display:flex;justify-content:space-between}

/aside>'}
function background(){return '<aside class="panel"><input placeholder="Search tools, templates..." class="field"><h3>Tools</h3><div class="tabs"><button class="tab active">Background Studio</button><button class="tab">Location Templates</button><button class="tab">Object Removal</button><button class="tab">Generative Fill</button><button class="tab">Batch Process</button></div><h3>Templates</h3><p>▢ Saved Presets</p><p>◷ Recent Projects</p><div class="status">Storage · 72% used · 36.4GB / 50GB</div></aside><section class="center"><div class="title-row"><div><div class="eyebrow">Edit · Project: Campaign_Launch_Shoot_001</div><h1>Background Removal Workspace</h1></div>'+btn("Export",false)+'</div><div class="before-after"><figure><img src="/studio/assets/entry-suit-B2BI6CMb.webp" alt="Original garment portrait"><figcaption>BEFORE · Original</figcaption></figure><figure><img src="/studio/assets/nyc-rooftop-01.jpg" alt="Background replaced preview"><figcaption>AFTER · Rooftop Paris · Preview</figcaption></figure></div><div class="panel" style="margin-top:14px"><h3>Background Removal</h3>'+slider("Precision",82)+slider("Edge Smoothing",45)+'<label><input type="checkbox" checked> Feather Edges</label><h3 style="margin-top:18px">Refine</h3>'+slider("Shadow Intensity",60)+'</div><h3 style="margin-top:20px">Location Templates</h3><div class="cards">'+["Rooftop Paris","Neon Tokyo","Desert Villa"].map((x,i)=>'<div class="mini"><img src="'+["/studio/assets/nyc-rooftop-01.jpg","/studio/assets/runway-01.jpg","/studio/assets/desert-01.jpg"][i]+'" alt=""><b>'+x+'</b></div>').join("")+'</div></section>'+rightPanel()}

abel><input type="checkbox" checked> Web Interactive</label></p><button class="btn primary">Download Lookbook PDF</button></aside>'}
