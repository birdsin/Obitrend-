          if(text.includes(priceText.toLowerCase())&&text.includes(seconds+"s")&&text.includes("1 video credit")){
            card=node;break;
          }
        }
        if(card)break;
      }
      if(card){
        const link=makeLink("/rebuild/?obitrendPurchase=video&duration="+seconds,"Buy "+seconds+"s video credit");
        link.dataset.obVideoPurchase=String(seconds);
        link.style.cssText+="min-height:48px;margin-top:14px;font-size:15px;background:linear-gradient(110deg,#f1d05f,#c69e27);color:#16120a;border-color:#b99a3f;";
        card.appendChild(link);placed++;
      }
    });
    if(placed===durations.length)return;
    const headings=Array.from(document.querySelectorAll("body *")).filter(el=>el.children.length===0&&(el.textContent||"").trim().toLowerCase()==="video");
    for(const heading of headings){
      const wrap=document.createElement("div");wrap.id="ob-host-video-purchase-links";
      wrap.style.cssText="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 18px;width:100%;";
      durations.forEach(seconds=>{
        if(document.querySelector('[data-ob-video-purchase="'+seconds+'"]'))return;
        const link=makeLink("/rebuild/?obitrendPurchase=video&duration="+seconds,"Buy "+seconds+"s video credit");
        link.dataset.obVideoPurchase=String(seconds);
        link.style.cssText+="min-height:48px;font-size:15px;background:linear-gradient(110deg,#f1d05f,#c69e27);color:#16120a;border-color:#b99a3f;";
        wrap.appendChild(link);
      });
      if(wrap.children.length){wrap.id="ob-host-video-purchase-links";heading.insertAdjacentElement("afterend",wrap);}
      return;
    }
  }
  function addReferencePhotoUpload(){
    const brief=Array.from(document.querySelectorAll("label")).find(el=>(el.textContent||"").trim().toLowerCase()==="video brief");
    if(!brief||document.getElementById("ob-video-reference-upload"))return;
    const panel=document.createElement("section");
    panel.id="ob-video-reference-upload";
    panel.style.cssText="display:grid;gap:10px;margin:18px 0 8px;padding:16px;border:1px solid #4a4030;border-radius:14px;background:linear-gradient(145deg,#171512,#101010);";
    const title=document.createElement("div");
    title.textContent="Reference photo";
    title.style.cssText="font:600 15px/1.4 system-ui;color:#f3d36a;";
    const help=document.createElement("p");
    help.textContent="Choose a garment or model photo from your phone to preview it here.";
    help.style.cssText="margin:0;color:#aaa293;font:13px/1.5 system-ui;";
    const input=document.createElement("input");
    input.type="file";input.accept="image/jpeg,image/png,image/webp";input.id="ob-video-reference-file";
    input.setAttribute("aria-label","Choose reference photo");
    input.style.cssText="display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #4a4030;border-radius:10px;background:#0d0d0d;color:#eee;font:13px system-ui;";
    const preview=document.createElement("img");
    preview.id="ob-video-reference-preview";preview.alt="Selected reference photo preview";preview.hidden=true;
    preview.style.cssText="width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#090909;";
    const filename=document.createElement("p");
    filename.id="ob-video-reference-name";filename.style.cssText="margin:0;color:#d8c58c;font:12px/1.4 system-ui;overflow-wrap:anywhere;";
    const notice=document.createElement("p");
    notice.textContent="Your selected photo will be used as the video reference. Generation requires an active Pro account, available video seconds, and a configured video service.";
    notice.style.cssText="margin:0;color:#e6b7a8;font:12px/1.5 system-ui;";
    panel.append(title,help,input,preview,filename,notice);
    brief.insertAdjacentElement("afterend",panel);
    input.addEventListener("change",()=>{
      const file=input.files&&input.files[0];
      if(!file){preview.hidden=true;preview.removeAttribute("src");filename.textContent="";return;}
      if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
        input.value="";preview.hidden=true;preview.removeAttribute("src");filename.textContent="Please choose a JPG, PNG or WEBP image.";return;
      }
      if(file.size>12*1024*1024){
        input.value="";preview.hidden=true;preview.removeAttribute("src");filename.textContent="Image is too large. Please choose a file under 12 MB.";return;
      }
      if(preview.dataset.objectUrl)URL.revokeObjectURL(preview.dataset.objectUrl);
      const objectUrl=URL.createObjectURL(file);preview.dataset.objectUrl=objectUrl;preview.src=objectUrl;preview.hidden=false;
      filename.textContent=file.name+" · "+(file.size/1024/1024).toFixed(2)+" MB";
      window.OBITREND_VIDEO_REFERENCE_FILE=file;
    });
  }
  function addFeeDisclosure(){
    const headings=Array.from(document.querySelectorAll("body *")).filter(el=>el.children.length===0&&["image subscriptions","video"].includes((el.textContent||"").trim().toLowerCase()));
    headings.forEach((heading,index)=>{
      const id="ob-paystack-fee-disclosure-"+(heading.textContent.trim().toLowerCase()==="video"?"video":"image");
      if(document.getElementById(id))return;
      const panel=document.createElement("div");
      panel.id=id;
      panel.setAttribute("role","note");
      panel.style.cssText="display:grid;gap:8px;margin:10px 0 18px;padding:12px 14px;border:1px solid #39332a;border-radius:10px;background:#12110f;color:#ded7c8;font:13px/1.5 system-ui;";
      panel.innerHTML='<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><span style="color:#aaa293">Product price</span><strong style="text-align:right;color:#f3d36a">As listed on each plan</strong></div><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><span style="color:#aaa293">Paystack transaction fee</span><strong style="text-align:right;color:#f3d36a">Calculated separately at checkout</strong></div><div style="color:#aaa293;font-size:12px">Paystack displays the applicable fee and final total before you confirm payment.</div>';
      heading.insertAdjacentElement("afterend",panel);
    });
  }
  function patch(){
    addReferencePhotoUpload();
    addFeeDisclosure();
    document.querySelectorAll("button").forEach(btn=>{
      if((btn.textContent||"").trim().toLowerCase()==="purchases unavailable"&&!btn.dataset.obPatched){
        btn.dataset.obPatched="1";
        const a=makeLink("/rebuild/?obitrendPurchase=pro&plan="+encodeURIComponent(proPlanFor(btn)),"Purchase through OBITREND");
        a.className=btn.className||"";a.style.minHeight="48px";a.style.fontSize="16px";a.style.background="linear-gradient(110deg,#f1d05f,#c69e27)";a.style.color="#16120a";
        btn.replaceWith(a);
      }
    });
    addVideoLinks();
  }
  document.addEventListener("click",function(event){
    const link=event.target.closest&&event.target.closest('a[href*="obitrendPurchase="]');
    if(!link)return;
    const url=new URL(link.href,window.location.origin);
    if(url.origin!==window.location.origin)return;
    const type=url.searchParams.get("obitrendPurchase");
    if(type==="pro"){event.preventDefault();beginCheckout("pro",url.searchParams.get("plan")||"PRO_4_DAY",link);}
    if(type==="video"){event.preventDefault();beginCheckout("video",url.searchParams.get("duration")||"5",link);}
  });
  let obVideoSelectedDuration = 5;
  let obVideoGenerating = false;
  function obVideoStatus(text, isError=false){
    let box=document.getElementById("ob-video-generation-status");
    if(!box){box=document.createElement("section");box.id="ob-video-generation-status";box.setAttribute("role","status");box.style.cssText="display:grid;gap:12px;margin:16px 0;padding:14px;border:1px solid #4a4030;border-radius:12px;background:#12110f;color:#e9dfc9;font:14px/1.5 system-ui;";
      const anchor=document.querySelector("#ob-video-reference-upload");
      if(anchor)anchor.insertAdjacentElement("afterend",box);else document.body.appendChild(box);
    }
    box.replaceChildren();const p=document.createElement("p");p.style.cssText="margin:0;color:"+(isError?"#ff8c8c":"#f3d36a")+";";p.textContent=text;box.appendChild(p);box.hidden=false;
    return box;
  }
  function obVideoDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const value=String(reader.result||"");if(!value.startsWith("data:image/"))reject(new Error("The selected photo could not be prepared."));else resolve(value);};reader.onerror=()=>reject(new Error("The selected photo could not be read."));reader.readAsDataURL(file);});}
  async function obStartVideoGeneration(button){
    if(obVideoGenerating)return;
    const input=document.getElementById("ob-video-reference-file");
    const file=input&&input.files&&input.files[0];
    if(!file){obVideoStatus("Please choose a reference photo before generating your video.",true);return;}
    const textareas=Array.from(document.querySelectorAll("textarea"));
    const promptField=textareas.find(el=>/model takes|video brief|fashion video/i.test((el.placeholder||"")+" "+(el.getAttribute("aria-label")||"")))||textareas[0];
    const prompt=String(promptField&&promptField.value||"").trim();
    if(!prompt){obVideoStatus("Please enter a video brief before generating.",true);if(promptField)promptField.focus();return;}
    const client=getObitrendSupabase();
    if(!client?.auth?.getSession){obVideoStatus("OBITREND sign-in is still loading. Refresh and try again.",true);return;}
    obVideoGenerating=true;
    const oldText=button.textContent;button.disabled=true;button.setAttribute("aria-busy","true");button.textContent="Preparing your video…";
    try{
      const sessionResult=await client.auth.getSession();const token=sessionResult&&sessionResult.data&&sessionResult.data.session&&sessionResult.data.session.access_token;
      if(!token)throw new Error("Please sign in to your OBITREND Pro account first.");
      const imageUrl=await obVideoDataUrl(file);
      const response=await fetch("/api/generate-video",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json",Authorization:"Bearer "+token},body:JSON.stringify({prompt,imageUrl,duration:obVideoSelectedDuration,ratio:"1280:720",cameraStyle:"AI Smart Camera"})});
      const data=await response.json().catch(()=>({}));
      if(!response.ok||data.success!==true||!data.taskId)throw new Error(data.error||data.message||"Video generation could not start.");
      const box=obVideoStatus("Video task accepted. Preparing your "+obVideoSelectedDuration+"-second video…");
      let finished=false;
      for(let attempt=0;attempt<90;attempt++){
        await new Promise(resolve=>setTimeout(resolve,4000));
        const statusResponse=await fetch("/api/video-status?taskId="+encodeURIComponent(data.taskId),{method:"GET",cache:"no-store",headers:{Accept:"application/json",Authorization:"Bearer "+token}});
        const statusData=await statusResponse.json().catch(()=>({}));
        if(!statusResponse.ok)throw new Error(statusData.error||"Unable to check video progress.");
        const state=String(statusData.status||"").toUpperCase();
        if(statusData.success&&state==="SUCCEEDED"&&statusData.videoUrl){
          box.replaceChildren();const title=document.createElement("p");title.textContent="Your video is ready.";title.style.cssText="margin:0;color:#f3d36a;font-weight:700;";box.appendChild(title);
          const video=document.createElement("video");video.controls=true;video.playsInline=true;video.src=statusData.videoUrl;video.style.cssText="width:100%;max-height:65vh;border-radius:10px;background:#000;";box.appendChild(video);
          const link=document.createElement("a");link.href=statusData.videoUrl;link.download="obitrend-fashion-video.mp4";link.textContent="Open / download video";link.style.cssText="display:block;padding:12px;text-align:center;border-radius:10px;background:linear-gradient(110deg,#f1d05f,#c69e27);color:#16120a;font-weight:700;text-decoration:none;";box.appendChild(link);finished=true;box.scrollIntoView({behavior:"smooth",block:"center"});break;
        }
        if(state==="FAILED"||statusData.success===false&&state==="FAILED")throw new Error(statusData.error||"Video generation failed. Check your video balance before retrying.");
        obVideoStatus("Generating video… "+Math.min(99,Math.round((attempt+1)/90*100))+"% (you can keep this page open).");
      }
      if(!finished)obVideoStatus("The video is taking longer than expected. Reopen the Video Creator and check your video history before starting another job.",true);
    }catch(error){obVideoStatus(error&&error.message||"Video generation could not start.",true);}
    finally{obVideoGenerating=false;button.disabled=false;button.removeAttribute("aria-busy");button.textContent=oldText||"Generate Video";}
  }
  document.addEventListener("click",function(event){
    let node=event.target;
    for(let depth=0;node&&depth<7;depth++,node=node.parentElement){
      const label=(node.innerText||node.textContent||"").replace(/\s+/g," ").trim();
      const match=label.match(/^(5|10|15|20)s$/i);
      if(match){obVideoSelectedDuration=Number(match[1]);break;}
      if(depth>0&&/₦\s*(5,000|10,000|15,000|20,000)/.test(label)&&/1\s*credit/i.test(label)){const matches=label.match(/\b(5|10|15|20)s\b/gi)||[];if(matches.length===1){obVideoSelectedDuration=Number(matches[0].replace(/s/i,""));break;}}
    }
  },true);
  document.addEventListener("click",function(event){
    const button=event.target&&event.target.closest&&event.target.closest("button,[role=button]");
    if(!button||!/generate\s+video/i.test((button.innerText||button.textContent||"").replace(/\s+/g," ").trim()))return;
    event.preventDefault();event.stopPropagation();if(event.stopImmediatePropagation)event.stopImmediatePropagation();
    obStartVideoGeneration(button);
  },true);
  
  const observer=new MutationObserver(patch);
  function start(){patch();observer.observe(document.documentElement,{childList:true,subtree:true});}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
})();
</script></body></html>
